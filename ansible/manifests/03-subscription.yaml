apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: contentiq
  namespace: openshift-operators
spec:
  channel: alpha
  name: contentiq-operator
  source: contentiq-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  # Prevent operator OOMKilled/CrashLoop from low CSV defaults.
  # OLM applies these to the operator Deployment.
  config:
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
