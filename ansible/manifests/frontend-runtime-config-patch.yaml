# Optional overlay when the operator sets ONPREM_API_URL but the frontend image reads
# CONTENTIQ_API_BASE_URL (see on_prem_packaging/render_runtime_config.py).
# Writes env.json via initContainer into emptyDir and mounts it at /srv/app/env.json
# so OpenShift random UIDs can restart without PermissionError on the app tree.
#
# Apply after ContentIQ is up (operator may reconcile; re-apply if rolled back):
#   oc patch deployment contentiq-frontend -n contentiq --patch-file ansible/manifests/frontend-runtime-config-patch.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contentiq-frontend
  namespace: contentiq
spec:
  template:
    spec:
      initContainers:
        - name: render-frontend-env-json
          image: docker.io/symplisticai/contentiq-frontend:1.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -z "${CONTENTIQ_API_BASE_URL:-}" ] && [ -n "${ONPREM_API_URL:-}" ]; then
                export CONTENTIQ_API_BASE_URL="${ONPREM_API_URL}"
              fi
              export CONTENTIQ_RUNTIME_CONFIG_PATH=/config/env.json
              export CONTENTIQ_PLAYGROUND_STREAM_TIMEOUT_SECONDS="${CONTENTIQ_PLAYGROUND_STREAM_TIMEOUT_SECONDS:-1800}"
              python /srv/app/on_prem_packaging/render_runtime_config.py
          envFrom:
            - configMapRef:
                name: frontend-config
          volumeMounts:
            - name: frontend-runtime-config
              mountPath: /config
      containers:
        - name: frontend
          volumeMounts:
            - name: frontend-runtime-config
              mountPath: /srv/app/env.json
              subPath: env.json
      volumes:
        - name: frontend-runtime-config
          emptyDir: {}
