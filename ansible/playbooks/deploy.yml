---
- name: ContentIQ happy-path installation
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Core CLI/runtime settings
    contentiq_oc_binary: "oc"
    contentiq_wait_delay_seconds: 10
    # Ansible until loops: high retry count so we only advance when the condition is true (READY, Succeeded, etc.).
    contentiq_wait_retries: 2147483647
    # oc rollout status --timeout: backend/RAG cold starts and image pulls often exceed a few minutes.
    # With 0s, many oc versions treat the deadline as immediate and fail while pods are still Pending.
    contentiq_rollout_timeout_seconds: 14400
    # Deployments default to progressDeadlineSeconds=600 (10m). We patch to at least this before every
    # rollout wait (including Step 6b after route alignment) so the controller does not fail first.
    contentiq_min_progress_deadline_seconds: 14400
    contentiq_apply_min_progress_deadline: true
    contentiq_rollout_recover_on_progress_deadline: true
    contentiq_step7_wait_postgres_ready_before_phase2: true

    # Step 4: OLM installs the operator into openshift-operators; deleting stale pods forces a new
    # reconcile (avoids long CSV/Installing stalls). Applies even when pull-secret tasks are skipped.
    contentiq_step4_restart_operator_pod: true
    contentiq_step4_wait_operator_rollout: true
    contentiq_operator_deployment_name: contentiq-operator-controller-manager
    # Before Step 4 subscription: optional actions to free node RAM on small clusters (e.g. CRC).
    # Set prepare true and list namespaces / deployments you can safely trim; empty lists skip those actions.
    contentiq_step4_prepare_node_memory: false
    contentiq_step4_prune_succeeded_all_namespaces: false
    contentiq_step4_prune_succeeded_namespaces: []
    contentiq_step4_scale_down_deployments: []
    contentiq_step4_prepare_pause_seconds: 0

    # Base paths: all manifests and secrets live under ansible/ (playbook_dir/../)
    contentiq_root_dir: "{{ playbook_dir | dirname }}"
    contentiq_namespace: "contentiq"

    contentiq_namespace_manifest: "{{ contentiq_root_dir }}/manifests/00-namespace.yaml"
    contentiq_catalogsource_manifest: "{{ contentiq_root_dir }}/manifests/02-catalogsource.yaml"
    contentiq_subscription_manifest: "{{ contentiq_root_dir }}/manifests/03-subscription.yaml"
    contentiq_cr_manifest: "{{ contentiq_root_dir }}/manifests/contentiq-custom-resource.yaml"

    # Secrets (use the backend template directly; no dynamic template rendering)
    contentiq_backend_secret_manifest: "{{ contentiq_root_dir }}/secrets/backend-secrets-template.yaml"
    # RAG pods require Secret personalization-api-secrets; apply the template in Step 5b (same as CUSTOMER-GUIDE).
    contentiq_apply_rag_secret: true
    contentiq_rag_secret_manifest: "{{ contentiq_root_dir }}/secrets/rag-secrets-template.yaml"

    # Pull secret: when false, Step 2 is skipped (use with IBM SM registry sync so Ansible does not overwrite SM secrets).
    contentiq_manage_pull_secret: false
    contentiq_pull_secret_name: "dockerhub-pull"
    contentiq_registry_server: "https://index.docker.io/v1/"
    contentiq_registry_username: ""
    contentiq_registry_password: ""
    contentiq_registry_email: ""

    # When true: after the namespace exists, apply backend, RAG, and registry secrets from IBM Secrets Manager
    # (same payloads as Tekton task-contentiq-sync-secrets-from-ibm-sm). Implementation:
    #   - ansible: playbooks/tasks/fetch-and-apply-ibm-sm-secrets.yml (contentiq_ibmsm_sync_engine: ansible)
    #   - shell: playbooks/scripts/sync-ibm-sm-secrets-to-cluster.sh (contentiq_ibmsm_sync_engine: shell)
    # Requires contentiq_secrets_manager_endpoint_url + three secret UUIDs. API key: IBM_CLOUD_API_KEY /
    # IBMCLOUD_API_KEY (or contentiq_ibmsm_api_key); if unset, fetch-and-apply-ibm-sm-secrets reads
    # kube-system/ibm-secret like Tekton (override with contentiq_ibmsm_skip_cluster_api_key).
    # Registry is applied from SM; Ansible Step 2 stays off (contentiq_manage_pull_secret: false above).
    # contentiq_registry_pull_secret_link_enabled still runs the same oc secrets link steps as the legacy path.
    # Endpoint and UUIDs default below (same as ansible/tekton/.env.sm.example); override via env CONTENTIQ_* /
    # SECRETS_MANAGER_ENDPOINT_URL / BACKEND_SECRET_KEY_ID / …, parameters.yml, or -e. Export into the environment
    # (use `export` in .env.sm, or `set -a; source …; set +a`) before ansible-playbook when relying on env files.
    # For installs without IBM SM: -e contentiq_fetch_secrets_from_ibm_sm=false -e contentiq_manage_pull_secret=true
    # and supply contentiq_registry_* (e.g. -e @parameters.yml).
    # Ergonomic alias for local testing: -e contentiq_use_local_secrets=true (forces fetch from SM off for this run).
    # Uses contentiq_backend_secret_manifest + contentiq_rag_secret_manifest (defaults under ansible/secrets/).
    # Optional broker fallback for Step 9: contentiq_broker_assignments_file (e.g. ansible/broker.yml) is used only
    # if IBM SM deferred fetch did not run or did not set contentiq_broker_osb; prefer contentiq_ibmsm_broker_secret_id.
    # Override those paths to point at your own filled-in YAML. You still need image pulls: set
    # contentiq_manage_pull_secret: true and contentiq_registry_* unless the cluster already has them.
    contentiq_use_local_secrets: false
    contentiq_fetch_secrets_from_ibm_sm: true
    contentiq_ibmsm_sync_engine: ansible
    contentiq_secrets_manager_endpoint_url: >-
      {{
        (
          (
            lookup('env', 'CONTENTIQ_SECRETS_MANAGER_ENDPOINT_URL', default='')
            | default(lookup('env', 'SECRETS_MANAGER_ENDPOINT_URL', default=''), true)
          )
          | trim
        )
        | default('https://afa20521-cd75-4864-843f-e59fd0ffd49d.us-south.secrets-manager.appdomain.cloud', true)
      }}
    contentiq_ibmsm_backend_secret_id: >-
      {{
        (
          (
            lookup('env', 'CONTENTIQ_IBMSM_BACKEND_SECRET_ID', default='')
            | default(lookup('env', 'BACKEND_SECRET_KEY_ID', default=''), true)
          )
          | trim
        )
        | default('83eec62f-23d7-80d3-de6c-f7aa48c3ec4e', true)
      }}
    contentiq_ibmsm_rag_secret_id: >-
      {{
        (
          (
            lookup('env', 'CONTENTIQ_IBMSM_RAG_SECRET_ID', default='')
            | default(lookup('env', 'RAG_SECRET_KEY_ID', default=''), true)
          )
          | trim
        )
        | default('3520bb5f-9050-8928-e812-67ed3c959fa8', true)
      }}
    contentiq_ibmsm_registry_secret_id: >-
      {{
        (
          (
            lookup('env', 'CONTENTIQ_IBMSM_REGISTRY_SECRET_ID', default='')
            | default(lookup('env', 'REGISTRY_SECRET_KEY_ID', default=''), true)
          )
          | trim
        )
        | default('3ede12f0-7c8a-fd86-d245-197d064641f9', true)
      }}
    # Optional IBM SM arbitrary secret (e.g. contentiq-broker-secrets): BROKER_API_PREFIX, BROKER_API_VERSION,
    # DEFAULT_BROKER_SERVICE_ID, PRESET_PLAN_ID, PRESET_BROKER_BEARER — used for Step 9 OSB provision/bind.
    contentiq_ibmsm_broker_secret_id: >-
      {{
        (
          (
            lookup('env', 'CONTENTIQ_IBMSM_BROKER_SECRET_ID', default='')
            | default(lookup('env', 'BROKER_SECRET_KEY_ID', default=''), true)
          )
          | trim
        )
        | default('f59daca0-3701-1777-9850-dbcf6a86c929', true)
      }}
    contentiq_ibmsm_broker_payload_base64_wrapped: false
    # When true, the broker secret is not read during Step 1b; Step 9 loads it after the backend Route exists.
    contentiq_ibmsm_defer_broker_sm_fetch_until_osb: true
    # Step 9 always runs after Step 8: OSB client uses the live backend Route (same host as install summary).
    contentiq_osb_broker_assignments_inline: ""
    # Local IBM SM–format broker file (KEY=value lines, same as contentiq-broker-secrets in SM); fallback after SM.
    # Example: "{{ contentiq_root_dir }}/broker.yml" — e.g. when contentiq_ibmsm_broker_secret_id is unset.
    contentiq_broker_assignments_file: ""
    # After OSB bind: store APPLICATION_USERNAME / APPLICATION_PASSWORD in a Secret (optional; use for local testing).
    contentiq_osb_apply_application_credentials_secret: false
    contentiq_osb_application_credentials_secret_name: "contentiq-osb-application-credentials"
    # Debug: Step 1b prints IBM SM backend GET summary (redacted payload preview) — use -e ...=true once, then off.
    contentiq_ibmsm_debug_backend_sm_response: false
    # Debug: OSB script prints effective broker fields (bearer length only) to stderr before PUT.
    contentiq_osb_debug_show_effective_config: true
    # OSB urllib calls use the backend Route from the Ansible controller; false matches contentiq_ibmsm_tls_validate
    # for lab/internal routes. Set true when the controller trusts the cluster CA, or set contentiq_osb_tls_ca_bundle.
    contentiq_osb_tls_validate: false
    # Optional PEM path on the controller for OSB HTTPS when contentiq_osb_tls_validate is true.
    contentiq_osb_tls_ca_bundle: ""
    contentiq_ibmsm_backend_k8s_secret_name: "contentiq-backend-secrets"
    contentiq_ibmsm_rag_k8s_secret_name: "personalization-api-secrets"
    # backend/RAG SM payload: json-stringdata | env-stringdata (KEY=value, # comments) | kubernetes-yaml
    contentiq_ibmsm_backend_payload_format: "env-stringdata"
    contentiq_ibmsm_rag_payload_format: "kubernetes-yaml"
    contentiq_ibmsm_registry_payload_format: "json-stringdata"
    contentiq_ibmsm_backend_payload_base64_wrapped: true
    contentiq_ibmsm_rag_payload_base64_wrapped: true
    contentiq_ibmsm_registry_payload_base64_wrapped: false
    contentiq_ibmsm_rollout_restart_after_sync: false
    # When true: IAM token exchange logs curl/Python output (may expose the API key). Default hides output (no_log).
    contentiq_ibmsm_debug_token_exchange: false
    # TLS verify for IBM IAM + Secrets Manager curl calls. false helps corporate TLS inspection; use true in strict envs.
    contentiq_ibmsm_tls_validate: false

    # Step 7 post-deploy (SCC, Postgres wait before Lakekeeper rollout, pgvector, pull-secret links).
    contentiq_enable_structured_data_poststeps: true
    contentiq_enable_pgvector: true
    contentiq_link_default_pull_secret_for_structured_data: true

    # When true: skip phase-2 rollout waits (edge/lakekeeper/trino) and skip Step 7 — for very small clusters (e.g. CRC).
    # Default false: complete Step 6 phase-2 waits and Step 7 in one playbook run.
    contentiq_defer_phase2_and_structured_poststeps: false

    # Step 7a (runs before phase-2 rollout waits): unblock SCC + CNPG webhook so Lakekeeper/Trino can schedule.
    contentiq_step7_wait_cnpg_webhook_cert: true
    # If cnpg-webhook-cert exists but lacks data.ca.crt (CNPG sometimes omits it), copy from cnpg-ca-secret — CUSTOMER-GUIDE.md
    contentiq_step7_ensure_cnpg_webhook_ca_from_ca_secret: true
    # Set true to delete job/lakekeeper-db-migration-1 so the operator can re-run DB migrations (e.g. after DB wipe).
    contentiq_delete_lakekeeper_migration_job: false

    # After the ContentIQ CR is applied, the operator still reconciles all operands in one pass; these
    # settings only sequence *readiness* checks: core app first, then structured-data workloads.
    contentiq_enable_phased_rollout: true
    # Backend expects in-cluster Redis unless spec.redis.mode=external (set false when using external Redis).
    contentiq_rollout_wait_redis: true
    contentiq_rollout_phase1_deployments:
      - contentiq-backend
      - personalization-rag
      - contentiq-frontend
    # Lakehouse edge + Trino. Skipped when contentiq_rollout_wait_phase2 is false or when phase-2 is deferred.
    contentiq_rollout_wait_phase2: true
    contentiq_rollout_phase2_deployments:
      - edge-auth-proxy
      - edge-gateway
      - lakekeeper
      - trino-coordinator
      - trino-worker
    # Small clusters (e.g. CRC): optional pauses so rollouts are not back-to-back while memory is tight.
    # Set non-zero values in parameters.yml — e.g. 30–90 between deployments, 60–120 before phase 2.
    contentiq_rollout_pause_between_deployments_seconds: 0
    contentiq_rollout_pause_after_redis_seconds: 0
    contentiq_rollout_pause_before_phase2_seconds: 0
    contentiq_rollout_legacy_deployments:
      - contentiq-backend
      - contentiq-frontend
      - personalization-rag

    # Route URLs / hostnames: deploy.yml reads ingress.config/cluster (OpenShift apps domain) and fills
    # __CONTENTIQ_*__ placeholders in secrets + CR before oc apply. Override labels if your DNS names differ.
    contentiq_auto_route_hostnames: true
    contentiq_route_frontend_label: "contentiq-symplistic-ai"
    contentiq_route_backend_label: "api-contentiq-symplistic-ai"
    # OpenShift Route name for RAG (install summary); override if your operator uses a different name.
    contentiq_rag_route_name: "personalization-rag"
    contentiq_render_dir: "{{ contentiq_root_dir }}/.rendered"

    # After Routes exist: align contentiq-backend-secrets to live Route hosts (CUSTOMER-GUIDE oc patch flow).
    # Backend 1.3.x image bakes staging MONGODB_URI into .env; load_dotenv(override=True) wins over K8s secrets.
    contentiq_backend_strip_baked_dotenv: true
    contentiq_backend_dotenv_restart_after_patch: true
    contentiq_align_backend_secret_to_live_routes: true
    contentiq_align_backend_oauth_redirects: true
    contentiq_step6b_wait_backend_rollout_after_align: true
    # After Routes exist: optionally register callback URLs in Azure via Graph (auto when AZURE_GRAPH_* in SM).
    # false | true | auto — see DEPLOYMENT-CONFIG.md "OAuth redirect URI automation".
    contentiq_sync_oauth_redirect_uris_to_providers: auto
    # Google/Box: fixed platform callback (one URI in GCP + Box consoles; proxy forwards to reservation backend).
    # Step 6b patches BOX_REDIRECT_URI, GOOGLE_REDIRECT_URI, OAUTH_CALLBACK_PROXY_BASE from this base.
    # Register once in GCP + Box: https://oauth.contentiq.symplistic.ai/api/connections/.../callback
    contentiq_oauth_fixed_callback_base: "https://oauth.contentiq.symplistic.ai"
    contentiq_oauth_fixed_google_redirect_uri: ""
    contentiq_oauth_fixed_box_redirect_uri: ""
    # Optional POC: use the same fixed proxy for Microsoft instead of per-reservation registration.
    # contentiq_oauth_fixed_microsoft_redirect_uri: "https://oauth.contentiq.symplistic.ai/api/connections/microsoft/auth/microsoft/callback"
    # Local/lab only: overlay Box/Google creds from ansible/secrets/backend-secrets-template.yaml after Step 1b.
    # On-prem / TechZone (IBM SM): false — credentials and redirect URIs live in IBM SM; use
    # playbooks/scripts/add-platform-oauth-keys-to-ibm-sm-backend.sh once. Step 6b still patches
    # BOX_REDIRECT_URI / GOOGLE_REDIRECT_URI / OAUTH_CALLBACK_PROXY_BASE from contentiq_oauth_fixed_callback_base.
    contentiq_merge_platform_oauth_from_template: false
    contentiq_platform_oauth_template_keys:
      - BOX_CLIENT_ID
      - BOX_CLIENT_SECRET
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - AZURE_TENANT_ID
      - AZURE_GRAPH_CLIENT_ID
      - AZURE_GRAPH_CLIENT_SECRET

    # Frontend /env.json: operator sets ONPREM_API_URL; image 1.3.x reads CONTENTIQ_API_BASE_URL.
    # InitContainer + emptyDir avoids PermissionError writing /srv/app/env.json under restricted SCC.
    contentiq_align_frontend_runtime_config: true
    contentiq_frontend_playground_stream_timeout_seconds: 1800
    contentiq_frontend_force_render_env_json_after_rollout: true
    contentiq_finalize_connectivity_after_deploy: true
    contentiq_frontend_runtime_config_patch_manifest: "{{ contentiq_root_dir }}/manifests/frontend-runtime-config-patch.yaml"
    contentiq_frontend_apply_runtime_config_patch: true
    contentiq_frontend_patch_early_after_cr: true
    contentiq_frontend_watch_during_rollouts: true
    contentiq_frontend_patch_before_rollout: true
    contentiq_frontend_patch_assert_retries: 12
    contentiq_frontend_patch_assert_delay_seconds: 5
    contentiq_frontend_rollout_guard_enabled: true
    contentiq_frontend_rollout_guard_poll_seconds: 15
    contentiq_frontend_rollout_stable_checks: 3
    contentiq_frontend_rollout_stable_delay_seconds: 10
    contentiq_step6c_wait_frontend_rollout_after_patch: true
    contentiq_step6c_frontend_ready_timeout_seconds: 600
    contentiq_step6c_env_json_verify_retries: 36
    contentiq_step6c_env_json_verify_delay_seconds: 10
    contentiq_step6c_verify_env_json_in_pod: "{{ not (contentiq_frontend_apply_runtime_config_patch | bool) }}"

    # Step 6d: HAProxy route timeouts (IBM COS list-folder, ingest, playground SSE).
    # Default OpenShift router timeout is ~30s; without this, slow COS listing returns 504.
    contentiq_annotate_route_timeouts: true
    contentiq_route_haproxy_timeout: 1800s
    contentiq_route_timeout_targets:
      - contentiq-frontend
      - contentiq-backend
    contentiq_assert_route_timeouts: true

    # Step 6-post: path Route https://<frontend>/api/* → contentiq-backend.
    # Covers Safari/iOS when layout.html calls /api with empty API_BASE_URL (404 File not found).
    contentiq_ensure_frontend_api_path_route: true
    contentiq_frontend_api_path_route_name: contentiq-frontend-api

    # Step 6g: LAKEHOUSE_INGRESS_PORT from edge-gateway Service (playground structured path uses :8080).
    contentiq_align_lakehouse_ingress_port: true
    contentiq_lakehouse_ingress_service_name: edge-gateway
    contentiq_align_lakehouse_restart_backend: true
    contentiq_align_lakehouse_wait_rollout: true

    # Step 6-post: POST /management/v1/bootstrap when lakekeeper reports bootstrapped=false.
    # Operator may create project/warehouse without accepting terms; structured chat then soft-fails.
    contentiq_bootstrap_lakekeeper: true
    contentiq_lakekeeper_bootstrap_rollout_timeout: 300s

    # Step 6-post: /env.json + CORS after rollouts.
    contentiq_verify_deploy_connectivity: true
    contentiq_verify_env_json_and_cors: true
    contentiq_verify_edge_gateway_from_backend: true
    contentiq_backend_container_name: backend

  tasks:
    - name: Verify oc client is available
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - version
          - --client
      changed_when: false

    - name: Verify current OpenShift login
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - whoami
      changed_when: false

    - name: Local secrets mode — skip IBM Secrets Manager; apply manifests from disk for this run
      ansible.builtin.set_fact:
        contentiq_fetch_secrets_from_ibm_sm: false
      when: contentiq_use_local_secrets | default(false) | bool

    - name: IBM SM mode — force pull-secret management off for this run
      ansible.builtin.set_fact:
        contentiq_manage_pull_secret: false
      when: contentiq_fetch_secrets_from_ibm_sm | bool

    # TechZone / CI often pass contentiq_manage_pull_secret=true with -e @parameters.yml but no
    # registry credentials (parameters.yml is gitignored and not in the release). Avoid a hard fail
    # when any required registry value is empty and IBM SM fetch is off.
    - name: Disable pull-secret management when registry inputs are empty (non-IBM-SM path)
      ansible.builtin.set_fact:
        contentiq_manage_pull_secret: false
      when:
        - not (contentiq_fetch_secrets_from_ibm_sm | default(false) | bool)
        - contentiq_manage_pull_secret | default(false) | bool
        - >-
          (contentiq_registry_username | default('') | trim | length) == 0
          or (contentiq_registry_password | default('') | trim | length) == 0
          or (contentiq_registry_email | default('') | trim | length) == 0

    - name: Pull-secret task disabled because registry inputs are empty
      ansible.builtin.debug:
        msg: >-
          contentiq_manage_pull_secret was true but registry credentials are incomplete
          (missing: {{ contentiq_registry_missing_keys | join(', ') }}).
          Continuing with contentiq_manage_pull_secret=false. For TechZone, prefer IBM SM
          (contentiq_fetch_secrets_from_ibm_sm: true) or pass registry creds via
          post_deploy_override_variables / playbooks/techzone-deploy.vars.example.yml.
      vars:
        contentiq_registry_missing_keys: >-
          {{
            ([] if (contentiq_registry_username | default('') | trim | length) > 0 else ['contentiq_registry_username'])
            + ([] if (contentiq_registry_password | default('') | trim | length) > 0 else ['contentiq_registry_password'])
            + ([] if (contentiq_registry_email | default('') | trim | length) > 0 else ['contentiq_registry_email'])
          }}
      when:
        - not (contentiq_fetch_secrets_from_ibm_sm | default(false) | bool)
        - not (contentiq_manage_pull_secret | default(false) | bool)
        - contentiq_registry_missing_keys | length > 0

    # broker.yml is KEY=value text (IBM SM broker shape), not Ansible YAML — you cannot use -e @broker.yml.
    # When using local secrets and no broker path was passed, default to ansible/broker.yml if it exists.
    - name: Stat default local broker assignments file (ansible/broker.yml)
      ansible.builtin.stat:
        path: "{{ contentiq_root_dir }}/broker.yml"
      register: contentiq_local_broker_yml_stat
      when:
        - contentiq_use_local_secrets | default(false) | bool
        - (contentiq_broker_assignments_file | default('') | trim | length) == 0

    - name: Default OSB broker file to ansible/broker.yml for local-secrets runs when unset
      ansible.builtin.set_fact:
        contentiq_broker_assignments_file: "{{ contentiq_root_dir }}/broker.yml"
      when: >-
        (contentiq_use_local_secrets | default(false) | bool)
        and ((contentiq_broker_assignments_file | default('') | trim | length) == 0)
        and (not (contentiq_local_broker_yml_stat.skipped | default(false) | bool))
        and (contentiq_local_broker_yml_stat.stat.exists | default(false) | bool)

    - name: Resolve whether to link registry pull secret to OLM and workload service accounts
      ansible.builtin.set_fact:
        contentiq_registry_pull_secret_link_enabled: "{{ (contentiq_manage_pull_secret | bool) or (contentiq_fetch_secrets_from_ibm_sm | bool) }}"

    - name: Assert IBM Secrets Manager sync is compatible with Ansible pull-secret steps
      ansible.builtin.assert:
        that:
          - not (contentiq_manage_pull_secret | bool)
        fail_msg: >-
          When contentiq_fetch_secrets_from_ibm_sm is true, set contentiq_manage_pull_secret=false.
          Registry credentials are applied from Secrets Manager (Step 1b); Ansible Step 2 must stay off
          to avoid conflicting docker-registry secrets. Use SM payloads that include openshift-marketplace /
          openshift-operators if catalog pulls require them, or mirror catalog images.
      when: contentiq_fetch_secrets_from_ibm_sm | bool

    - name: Assert IBM Secrets Manager sync has endpoint and secret ids
      ansible.builtin.assert:
        that:
          - contentiq_secrets_manager_endpoint_url | default('') | length > 0
          - contentiq_ibmsm_backend_secret_id | default('') | length > 0
          - contentiq_ibmsm_rag_secret_id | default('') | length > 0
          - contentiq_ibmsm_registry_secret_id | default('') | length > 0
        fail_msg: >-
          contentiq_fetch_secrets_from_ibm_sm requires a non-empty contentiq_secrets_manager_endpoint_url and
          three IBM arbitrary secret UUIDs (playbook defaults match ansible/tekton/.env.sm.example; override with -e,
          parameters.yml, playbooks/ibm-sm-deploy.vars.local.yml, or env CONTENTIQ_SECRETS_MANAGER_ENDPOINT_URL /
          SECRETS_MANAGER_ENDPOINT_URL and CONTENTIQ_IBMSM_*_SECRET_ID or BACKEND_SECRET_KEY_ID / RAG_SECRET_KEY_ID /
          REGISTRY_SECRET_KEY_ID).
      when: contentiq_fetch_secrets_from_ibm_sm | bool

    - name: Assert pull secret inputs are provided when enabled
      ansible.builtin.assert:
        that:
          - (contentiq_registry_username | default('') | trim | length) > 0
          - (contentiq_registry_password | default('') | trim | length) > 0
          - (contentiq_registry_email | default('') | trim | length) > 0
        fail_msg: >-
          Pull-secret management is enabled (contentiq_manage_pull_secret=true,
          contentiq_fetch_secrets_from_ibm_sm=false) but registry credentials are incomplete.
          Missing: {{ contentiq_registry_missing_keys | join(', ') }}.
          Fix: pass contentiq_registry_username/password/email via -e, parameters.yml, or
          post_deploy_override_variables; or use IBM SM (contentiq_fetch_secrets_from_ibm_sm: true,
          contentiq_manage_pull_secret: false) — see playbooks/techzone-deploy.vars.example.yml.
      vars:
        contentiq_registry_missing_keys: >-
          {{
            ([] if (contentiq_registry_username | default('') | trim | length) > 0 else ['contentiq_registry_username'])
            + ([] if (contentiq_registry_password | default('') | trim | length) > 0 else ['contentiq_registry_password'])
            + ([] if (contentiq_registry_email | default('') | trim | length) > 0 else ['contentiq_registry_email'])
          }}
      when:
        - contentiq_manage_pull_secret | bool
        - not (contentiq_fetch_secrets_from_ibm_sm | default(false) | bool)

    - name: "Step 1: Create namespace"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - apply
          - -f
          - "{{ contentiq_namespace_manifest }}"
      register: contentiq_step1_namespace_apply
      changed_when: >-
        'created' in contentiq_step1_namespace_apply.stdout
        or 'configured' in contentiq_step1_namespace_apply.stdout

    - name: "Step 1b: Sync backend, RAG, and registry secrets from IBM Secrets Manager (Ansible tasks)"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/fetch-and-apply-ibm-sm-secrets.yml"
      when:
        - contentiq_fetch_secrets_from_ibm_sm | bool
        - (contentiq_ibmsm_sync_engine | default('ansible') | lower) == 'ansible'

    - name: "Step 1b-post: Overlay Box/Google credentials from local backend secrets template (not IBM SM)"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/patch-platform-oauth-secrets.yml"
      when:
        - contentiq_merge_platform_oauth_from_template | default(false) | bool
        - not (contentiq_fetch_secrets_from_ibm_sm | default(false) | bool)
        - (contentiq_ibmsm_sync_engine | default('ansible') | lower) == 'ansible'

    - name: "Step 1b: Sync backend, RAG, and registry secrets from IBM Secrets Manager (shell script)"
      ansible.builtin.command:
        argv:
          - /bin/bash
          - "{{ playbook_dir }}/scripts/sync-ibm-sm-secrets-to-cluster.sh"
      environment:
        SECRETS_MANAGER_ENDPOINT_URL: "{{ contentiq_secrets_manager_endpoint_url }}"
        BACKEND_SECRET_KEY_ID: "{{ contentiq_ibmsm_backend_secret_id }}"
        RAG_SECRET_KEY_ID: "{{ contentiq_ibmsm_rag_secret_id }}"
        REGISTRY_SECRET_KEY_ID: "{{ contentiq_ibmsm_registry_secret_id }}"
        TARGET_NAMESPACE: "{{ contentiq_namespace }}"
        CONTENTIQ_OC_BINARY: "{{ contentiq_oc_binary }}"
        REGISTRY_K8S_SECRET_NAME: "{{ contentiq_pull_secret_name }}"
        BACKEND_K8S_SECRET_NAME: "{{ contentiq_ibmsm_backend_k8s_secret_name }}"
        RAG_K8S_SECRET_NAME: "{{ contentiq_ibmsm_rag_k8s_secret_name }}"
        BACKEND_PAYLOAD_FORMAT: "{{ contentiq_ibmsm_backend_payload_format }}"
        RAG_PAYLOAD_FORMAT: "{{ contentiq_ibmsm_rag_payload_format }}"
        REGISTRY_PAYLOAD_FORMAT: "{{ contentiq_ibmsm_registry_payload_format }}"
        BACKEND_PAYLOAD_BASE64: "{{ contentiq_ibmsm_backend_payload_base64_wrapped | string }}"
        RAG_PAYLOAD_BASE64: "{{ contentiq_ibmsm_rag_payload_base64_wrapped | string }}"
        REGISTRY_PAYLOAD_BASE64: "{{ contentiq_ibmsm_registry_payload_base64_wrapped | string }}"
        ROLLOUT_RESTART: "{{ contentiq_ibmsm_rollout_restart_after_sync | string }}"
      register: contentiq_step1b_ibmsm_sync
      changed_when: false
      when:
        - contentiq_fetch_secrets_from_ibm_sm | bool
        - (contentiq_ibmsm_sync_engine | default('ansible') | lower) == 'shell'

    - name: "Step 1b-post: Overlay Box/Google credentials from local backend secrets template (not IBM SM)"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/patch-platform-oauth-secrets.yml"
      when:
        - contentiq_merge_platform_oauth_from_template | default(false) | bool
        - not (contentiq_fetch_secrets_from_ibm_sm | default(false) | bool)
        - (contentiq_ibmsm_sync_engine | default('ansible') | lower) == 'shell'

    - name: "Step 2: Create pull secrets in required namespaces"
      ansible.builtin.shell: >-
        set -o pipefail &&
        {{ contentiq_oc_binary }} create secret docker-registry {{ contentiq_pull_secret_name }}
        --docker-server="{{ contentiq_registry_server }}"
        --docker-username="{{ contentiq_registry_username }}"
        --docker-password="{{ contentiq_registry_password }}"
        --docker-email="{{ contentiq_registry_email }}"
        -n {{ item }}
        --dry-run=client -o yaml | {{ contentiq_oc_binary }} apply -f -
      args:
        executable: /bin/bash
      loop:
        - openshift-marketplace
        - openshift-operators
        - "{{ contentiq_namespace }}"
      register: contentiq_step2_pull_secret_apply
      changed_when: >-
        'created' in contentiq_step2_pull_secret_apply.stdout
        or 'configured' in contentiq_step2_pull_secret_apply.stdout
      when: contentiq_manage_pull_secret | bool
      no_log: true

    - name: "Step 2: Link pull secret to default service accounts"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - secrets
          - link
          - default
          - "{{ contentiq_pull_secret_name }}"
          - --for=pull
          - -n
          - "{{ item }}"
      loop:
        - openshift-marketplace
        - openshift-operators
        - "{{ contentiq_namespace }}"
      changed_when: false
      when: contentiq_registry_pull_secret_link_enabled | bool

    - name: "Step 3: Apply CatalogSource"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - apply
          - -f
          - "{{ contentiq_catalogsource_manifest }}"
      register: contentiq_step3_catalog_apply
      changed_when: >-
        'created' in contentiq_step3_catalog_apply.stdout
        or 'configured' in contentiq_step3_catalog_apply.stdout

    - name: "Step 3: Wait for catalog service account"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - serviceaccount
          - contentiq-operators
          - -n
          - openshift-marketplace
      register: contentiq_step3_catalog_sa_wait
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step3_catalog_sa_wait.rc == 0
      when: contentiq_registry_pull_secret_link_enabled | bool

    - name: "Step 3: Link pull secret to catalog service accounts"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - secrets
          - link
          - "{{ item }}"
          - "{{ contentiq_pull_secret_name }}"
          - --for=pull
          - -n
          - openshift-marketplace
      loop:
        - contentiq-operators
        - default
      changed_when: false
      when: contentiq_registry_pull_secret_link_enabled | bool

    - name: "Step 3: Restart catalog pod to pick up pull secret"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - delete
          - pod
          - -l
          - olm.catalogSource=contentiq-operators
          - -n
          - openshift-marketplace
          - --ignore-not-found
      register: contentiq_step3_catalog_pod_restart
      changed_when: "'deleted' in contentiq_step3_catalog_pod_restart.stdout"

    - name: "Step 3: Wait for CatalogSource READY"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - catalogsource
          - contentiq-operators
          - -n
          - openshift-marketplace
          - -o
          - jsonpath={.status.connectionState.lastObservedState}
      register: contentiq_step3_catalog_ready
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step3_catalog_ready.stdout == "READY"

    - name: "Step 4 pre: Delete Succeeded pods (all namespaces)"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - delete
          - pod
          - --all-namespaces
          - --field-selector=status.phase=Succeeded
      register: contentiq_step4_pre_prune_all
      failed_when: false
      changed_when: "'deleted' in contentiq_step4_pre_prune_all.stdout | default('')"
      when:
        - contentiq_step4_prepare_node_memory | bool
        - contentiq_step4_prune_succeeded_all_namespaces | bool

    - name: "Step 4 pre: Delete Succeeded pods in selected namespaces"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - delete
          - pod
          - -n
          - "{{ item }}"
          - --field-selector=status.phase=Succeeded
      loop: "{{ contentiq_step4_prune_succeeded_namespaces }}"
      register: contentiq_step4_pre_prune_ns
      failed_when: false
      changed_when: "'deleted' in (contentiq_step4_pre_prune_ns.results | default([]) | map(attribute='stdout') | join(' '))"
      when:
        - contentiq_step4_prepare_node_memory | bool
        - (contentiq_step4_prune_succeeded_namespaces | length) > 0

    - name: "Step 4 pre: Scale down optional deployments (stops running pods to free RAM)"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - scale
          - "deployment/{{ item.deployment }}"
          - -n
          - "{{ item.namespace }}"
          - --replicas=0
      loop: "{{ contentiq_step4_scale_down_deployments }}"
      register: contentiq_step4_pre_scale
      failed_when: false
      changed_when: "'scaled' in (contentiq_step4_pre_scale.results | default([]) | map(attribute='stdout') | join(' '))"
      when:
        - contentiq_step4_prepare_node_memory | bool
        - (contentiq_step4_scale_down_deployments | length) > 0

    - name: "Step 4 pre: Pause for kubelet to reclaim memory after prune/scale"
      ansible.builtin.pause:
        seconds: "{{ contentiq_step4_prepare_pause_seconds | int }}"
      when:
        - contentiq_step4_prepare_node_memory | bool
        - (contentiq_step4_prepare_pause_seconds | int) > 0

    - name: "Step 4: Apply operator Subscription"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - apply
          - -f
          - "{{ contentiq_subscription_manifest }}"
      register: contentiq_step4_subscription_apply
      changed_when: >-
        'created' in contentiq_step4_subscription_apply.stdout
        or 'configured' in contentiq_step4_subscription_apply.stdout

    - name: "Step 4: Delete existing ContentIQ operator pods (fresh reconcile)"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - delete
          - pod
          - -n
          - openshift-operators
          - -l
          - app.kubernetes.io/name=contentiq-operator
          - --ignore-not-found
      register: contentiq_step4_operator_pod_delete_after_sub
      changed_when: "'deleted' in contentiq_step4_operator_pod_delete_after_sub.stdout"
      when: contentiq_step4_restart_operator_pod | bool

    - name: "Step 4: Wait for operator service account"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - serviceaccount
          - contentiq-operator-controller-manager
          - -n
          - openshift-operators
      register: contentiq_step4_operator_sa_wait
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step4_operator_sa_wait.rc == 0
      when: contentiq_registry_pull_secret_link_enabled | bool

    - name: "Step 4: Link pull secret to operator service account"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - secrets
          - link
          - contentiq-operator-controller-manager
          - "{{ contentiq_pull_secret_name }}"
          - --for=pull
          - -n
          - openshift-operators
      changed_when: false
      when: contentiq_registry_pull_secret_link_enabled | bool

    - name: "Step 4: Restart operator pods after pull-secret link"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - delete
          - pod
          - -n
          - openshift-operators
          - -l
          - app.kubernetes.io/name=contentiq-operator
          - --ignore-not-found
      register: contentiq_step4_operator_pod_restart
      changed_when: "'deleted' in contentiq_step4_operator_pod_restart.stdout"
      when: contentiq_registry_pull_secret_link_enabled | bool

    - name: "Step 4: Wait for subscription installed CSV"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          # OLM kind; bare "subscription" resolves to ACM on many clusters (endless empty jsonpath).
          - subscriptions.operators.coreos.com
          - contentiq
          - -n
          - openshift-operators
          - -o
          - jsonpath={.status.installedCSV}
      register: contentiq_step4_installed_csv_cmd
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step4_installed_csv_cmd.stdout | trim | length > 0

    - name: Set installed CSV name
      ansible.builtin.set_fact:
        contentiq_installed_csv: "{{ contentiq_step4_installed_csv_cmd.stdout | trim }}"

    - name: "Step 4: Wait for operator controller-manager deployment to exist"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - deployment
          - "{{ contentiq_operator_deployment_name }}"
          - -n
          - openshift-operators
      register: contentiq_step4_operator_dep_wait
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step4_operator_dep_wait.rc == 0
      when: contentiq_step4_wait_operator_rollout | bool

    # Published CSV may omit imagePullSecrets; private docker.io pulls then fail until SA is linked
    # and the pod is restarted. Patch the Deployment so new pods use dockerhub-pull immediately.
    - name: "Step 4: Ensure operator Deployment imagePullSecrets for private registry"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - patch
          - deployment
          - "{{ contentiq_operator_deployment_name }}"
          - -n
          - openshift-operators
          - --type
          - merge
          - -p
          - >-
            {{
              {
                'spec': {
                  'template': {
                    'spec': {
                      'imagePullSecrets': [
                        {'name': contentiq_pull_secret_name}
                      ]
                    }
                  }
                }
              } | to_json
            }}
      register: contentiq_step4_operator_ips_patch
      changed_when: >-
        'patched' in (contentiq_step4_operator_ips_patch.stdout | default(''))
      when:
        - contentiq_step4_wait_operator_rollout | bool
        - contentiq_registry_pull_secret_link_enabled | bool

    - name: "Step 4: Ensure operator deployment progress deadline before rollout wait"
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/roles/contentiq_install/tasks/patch_deployment_min_progress_deadline.yml"
      vars:
        patch_dep_name: "{{ contentiq_operator_deployment_name }}"
        patch_dep_namespace: openshift-operators
      when: contentiq_step4_wait_operator_rollout | bool

    - name: "Step 4: Wait for operator controller-manager deployment rollout"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - rollout
          - status
          - "deployment/{{ contentiq_operator_deployment_name }}"
          - -n
          - openshift-operators
          - "--timeout={{ contentiq_rollout_timeout_seconds }}s"
      register: contentiq_step4_operator_rollout
      changed_when: false
      failed_when: false
      when: contentiq_step4_wait_operator_rollout | bool

    # ImagePullBackOff before SA link often burns the default 600s deadline; re-link, restart, wait again.
    - name: "Step 4: Recover operator rollout after progress deadline / ImagePullBackOff"
      when:
        - contentiq_step4_wait_operator_rollout | bool
        - (contentiq_step4_operator_rollout.rc | default(0)) != 0
      block:
        - name: "Step 4: Re-link pull secret to operator SA before recovery restart"
          ansible.builtin.command:
            argv:
              - "{{ contentiq_oc_binary }}"
              - secrets
              - link
              - contentiq-operator-controller-manager
              - "{{ contentiq_pull_secret_name }}"
              - --for=pull
              - -n
              - openshift-operators
          changed_when: false
          when: contentiq_registry_pull_secret_link_enabled | bool

        - name: "Step 4: Re-apply operator Deployment imagePullSecrets before recovery restart"
          ansible.builtin.command:
            argv:
              - "{{ contentiq_oc_binary }}"
              - patch
              - deployment
              - "{{ contentiq_operator_deployment_name }}"
              - -n
              - openshift-operators
              - --type
              - merge
              - -p
              - >-
                {{
                  {
                    'spec': {
                      'template': {
                        'spec': {
                          'imagePullSecrets': [
                            {'name': contentiq_pull_secret_name}
                          ]
                        }
                      }
                    }
                  } | to_json
                }}
          changed_when: false
          when: contentiq_registry_pull_secret_link_enabled | bool

        - name: "Step 4: rollout restart operator after progress deadline"
          ansible.builtin.command:
            argv:
              - "{{ contentiq_oc_binary }}"
              - rollout
              - restart
              - "deployment/{{ contentiq_operator_deployment_name }}"
              - -n
              - openshift-operators
          changed_when: true

        - name: "Step 4: Re-apply min progress deadline after operator recovery restart"
          ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/roles/contentiq_install/tasks/patch_deployment_min_progress_deadline.yml"
          vars:
            patch_dep_name: "{{ contentiq_operator_deployment_name }}"
            patch_dep_namespace: openshift-operators

        - name: "Step 4: Wait for operator controller-manager deployment rollout (after recovery)"
          ansible.builtin.command:
            argv:
              - "{{ contentiq_oc_binary }}"
              - rollout
              - status
              - "deployment/{{ contentiq_operator_deployment_name }}"
              - -n
              - openshift-operators
              - "--timeout={{ contentiq_rollout_timeout_seconds }}s"
          register: contentiq_step4_operator_rollout_recovery
          changed_when: false

    - name: "Step 4: Fail if operator rollout did not succeed"
      ansible.builtin.fail:
        msg: >-
          Operator deployment {{ contentiq_operator_deployment_name }} rollout failed:
          {{ contentiq_step4_operator_rollout_recovery.stderr | default(contentiq_step4_operator_rollout.stderr | default('unknown')) }}
      when:
        - contentiq_step4_wait_operator_rollout | bool
        - >-
          (
            (contentiq_step4_operator_rollout_recovery is defined)
            and (not (contentiq_step4_operator_rollout_recovery.skipped | default(false)))
            and ((contentiq_step4_operator_rollout_recovery.rc | default(1)) != 0)
          )
          or (
            (
              contentiq_step4_operator_rollout_recovery is not defined
              or (contentiq_step4_operator_rollout_recovery.skipped | default(false))
            )
            and ((contentiq_step4_operator_rollout.rc | default(0)) != 0)
          )

    - name: "Step 4: Wait for installed CSV to Succeeded"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - csv
          - "{{ contentiq_installed_csv }}"
          - -n
          - openshift-operators
          - -o
          - jsonpath={.status.phase}
      register: contentiq_step4_csv_phase
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step4_csv_phase.stdout == "Succeeded"

    - name: "Step 4: Wait for ContentIQ CRD"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - crd
          - contentiqs.contentiq.symplistic.ai
      register: contentiq_step4_crd_wait
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step4_crd_wait.rc == 0

    - name: Ensure local render directory for route-resolved manifests
      ansible.builtin.file:
        path: "{{ contentiq_render_dir }}"
        state: directory
        mode: "0700"
      when: contentiq_auto_route_hostnames | bool

    - name: Capture OpenShift ingress application domain
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - ingress.config/cluster
          - -o
          - jsonpath={.spec.domain}
      register: contentiq_apps_domain_cmd
      changed_when: false
      when: contentiq_auto_route_hostnames | bool

    - name: Assert ingress application domain is available for route auto-fill
      ansible.builtin.assert:
        that:
          - (contentiq_apps_domain_cmd.stdout | default('') | trim | length) > 0
        fail_msg: >-
          Could not read spec.domain from ingress.config/cluster. Log in to an OpenShift cluster
          where this resource exists, or set contentiq_auto_route_hostnames: false and replace
          __CONTENTIQ_*__ placeholders in your manifests by hand.
      when: contentiq_auto_route_hostnames | bool

    - name: Compute route hostnames from apps domain and labels
      ansible.builtin.set_fact:
        contentiq_apps_domain: "{{ contentiq_apps_domain_cmd.stdout | trim }}"
        contentiq_route_frontend_host: "{{ contentiq_route_frontend_label }}.{{ contentiq_apps_domain_cmd.stdout | trim }}"
        contentiq_route_backend_host: "{{ contentiq_route_backend_label }}.{{ contentiq_apps_domain_cmd.stdout | trim }}"
      when: contentiq_auto_route_hostnames | bool

    - name: Compute URL-derived secret values (match CUSTOMER-GUIDE route alignment)
      ansible.builtin.set_fact:
        contentiq_derived_frontend_url: "https://{{ contentiq_route_frontend_host }}"
        contentiq_derived_backend_url: "https://{{ contentiq_route_backend_host }}"
        contentiq_derived_session_cookie_domain: "{{ contentiq_route_frontend_host | regex_replace('^[^.]+', '') }}"
        contentiq_derived_microsoft_redirect: "{{ ('https://' ~ contentiq_route_backend_host) ~ '/api/connections/microsoft/auth/microsoft/callback' }}"
        contentiq_derived_tool_api_endpoint: "{{ ('https://' ~ contentiq_route_backend_host) ~ '/api/external/contentiq-tool-query' }}"
      when: contentiq_auto_route_hostnames | bool

    - name: Resolve Google and Box OAuth redirect URIs for rendered backend secret
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/resolve-oauth-redirect-uris.yml"
      vars:
        contentiq_oauth_backend_host: "{{ contentiq_route_backend_host }}"
      when: contentiq_auto_route_hostnames | bool

    - name: Set rendered Google/Box redirect placeholders from resolved OAuth URIs
      ansible.builtin.set_fact:
        contentiq_derived_google_redirect: "{{ contentiq_oauth_redirect_uris.google }}"
        contentiq_derived_box_redirect: "{{ contentiq_oauth_redirect_uris.box }}"
        contentiq_derived_microsoft_redirect: "{{ contentiq_oauth_redirect_uris.microsoft }}"
        contentiq_derived_oauth_callback_proxy_base: "{{ contentiq_oauth_google_box_secret_patch.OAUTH_CALLBACK_PROXY_BASE | default('') }}"
      when: contentiq_auto_route_hostnames | bool

    - name: Copy backend secret manifest for placeholder substitution
      ansible.builtin.copy:
        src: "{{ contentiq_backend_secret_manifest }}"
        dest: "{{ contentiq_render_dir }}/backend-secrets-rendered.yaml"
        mode: "0600"
      when:
        - contentiq_auto_route_hostnames | bool
        - not (contentiq_fetch_secrets_from_ibm_sm | default(false) | bool)
      no_log: true

    # Two passes: ansible.builtin.replace has no replace_all in Ansible 13+ (shared FRONTEND + CORS keys).
    - name: Substitute FRONTEND_URL and CORS (shared placeholder) in rendered backend secret
      ansible.builtin.replace:
        path: "{{ contentiq_render_dir }}/backend-secrets-rendered.yaml"
        regexp: '__CONTENTIQ_FRONTEND_URL__'
        replace: "{{ contentiq_derived_frontend_url }}"
      loop: [1, 2]
      when:
        - contentiq_auto_route_hostnames | bool
        - not (contentiq_fetch_secrets_from_ibm_sm | default(false) | bool)
      no_log: true

    - name: Substitute remaining route-derived keys in rendered backend secret
      ansible.builtin.replace:
        path: "{{ contentiq_render_dir }}/backend-secrets-rendered.yaml"
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - { regexp: '__CONTENTIQ_SESSION_COOKIE_DOMAIN__', replace: "{{ contentiq_derived_session_cookie_domain }}" }
        - { regexp: '__CONTENTIQ_MICROSOFT_REDIRECT_URI__', replace: "{{ contentiq_derived_microsoft_redirect }}" }
        - { regexp: '__CONTENTIQ_BOX_REDIRECT_URI__', replace: "{{ contentiq_derived_box_redirect }}" }
        - { regexp: '__CONTENTIQ_GOOGLE_REDIRECT_URI__', replace: "{{ contentiq_derived_google_redirect }}" }
        - { regexp: '__CONTENTIQ_OAUTH_CALLBACK_PROXY_BASE__', replace: "{{ contentiq_derived_oauth_callback_proxy_base | default('') }}" }
        - { regexp: '__CONTENTIQ_TOOL_API_ENDPOINT__', replace: "{{ contentiq_derived_tool_api_endpoint }}" }
      when:
        - contentiq_auto_route_hostnames | bool
        - not (contentiq_fetch_secrets_from_ibm_sm | default(false) | bool)
      no_log: true

    - name: Copy ContentIQ CR manifest for placeholder substitution
      ansible.builtin.copy:
        src: "{{ contentiq_cr_manifest }}"
        dest: "{{ contentiq_render_dir }}/contentiq-cr-rendered.yaml"
        mode: "0644"
      when: contentiq_auto_route_hostnames | bool

    - name: Substitute route hostnames into rendered ContentIQ CR
      ansible.builtin.replace:
        path: "{{ contentiq_render_dir }}/contentiq-cr-rendered.yaml"
        regexp: "__CONTENTIQ_ROUTE_FRONTEND_HOST__"
        replace: "{{ contentiq_route_frontend_host }}"
      when: contentiq_auto_route_hostnames | bool

    - name: Substitute backend route hostname into rendered ContentIQ CR
      ansible.builtin.replace:
        path: "{{ contentiq_render_dir }}/contentiq-cr-rendered.yaml"
        regexp: "__CONTENTIQ_ROUTE_BACKEND_HOST__"
        replace: "{{ contentiq_route_backend_host }}"
      when: contentiq_auto_route_hostnames | bool

    - name: Select effective manifest paths for this run
      ansible.builtin.set_fact:
        contentiq_effective_backend_secret_manifest: >-
          {{
            (contentiq_render_dir ~ '/backend-secrets-rendered.yaml')
            if (
              (contentiq_auto_route_hostnames | bool)
              and not (contentiq_fetch_secrets_from_ibm_sm | default(false) | bool)
            )
            else contentiq_backend_secret_manifest
          }}
        contentiq_effective_cr_manifest: >-
          {{
            (contentiq_render_dir ~ '/contentiq-cr-rendered.yaml')
            if (contentiq_auto_route_hostnames | bool)
            else contentiq_cr_manifest
          }}

    - name: Refuse apply with unfilled route placeholders when auto hostnames are disabled
      ansible.builtin.assert:
        that:
          - lookup('file', contentiq_backend_secret_manifest) is not search('__CONTENTIQ_')
          - lookup('file', contentiq_cr_manifest) is not search('__CONTENTIQ_')
        fail_msg: >-
          Route placeholders __CONTENTIQ_*__ are still present but contentiq_auto_route_hostnames is false.
          Set contentiq_auto_route_hostnames: true (recommended) or replace placeholders with real values.
      when: not (contentiq_auto_route_hostnames | bool)

    - name: "Step 5: Apply backend secret manifest"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - apply
          - -f
          - "{{ contentiq_effective_backend_secret_manifest }}"
      register: contentiq_step5_backend_secret_apply
      changed_when: >-
        'created' in contentiq_step5_backend_secret_apply.stdout
        or 'configured' in contentiq_step5_backend_secret_apply.stdout
      when: not (contentiq_fetch_secrets_from_ibm_sm | default(false) | bool)
      no_log: true

    - name: "Step 5b: Apply RAG secret manifest"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - apply
          - -f
          - "{{ contentiq_rag_secret_manifest }}"
      register: contentiq_step5_rag_secret_apply
      changed_when: >-
        'created' in contentiq_step5_rag_secret_apply.stdout
        or 'configured' in contentiq_step5_rag_secret_apply.stdout
      when:
        - contentiq_apply_rag_secret | bool
        - not (contentiq_fetch_secrets_from_ibm_sm | default(false) | bool)
      no_log: true

    - name: "Step 6: Apply ContentIQ custom resource"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - apply
          - -f
          - "{{ contentiq_effective_cr_manifest }}"
      register: contentiq_step6_cr_apply
      changed_when: >-
        'created' in contentiq_step6_cr_apply.stdout
        or 'configured' in contentiq_step6_cr_apply.stdout

    # --- Step 6a-pre: Frontend initContainer patch immediately after CR (prevent CrashLoopBackOff) ---
    - name: "Step 6a-pre: Apply frontend runtime patch early (prevent CrashLoopBackOff)"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/ensure-frontend-runtime-patch.yml"
      vars:
        contentiq_frontend_patch_restart_after_apply: true
        contentiq_frontend_patch_wait_rollout: false
      when:
        - contentiq_align_frontend_runtime_config | bool
        - contentiq_frontend_apply_runtime_config_patch | bool
        - contentiq_frontend_patch_early_after_cr | bool

    - name: "Step 6a-pre: Mark frontend early patch applied"
      ansible.builtin.set_fact:
        contentiq_frontend_early_patch_done: true
      when:
        - contentiq_align_frontend_runtime_config | bool
        - contentiq_frontend_apply_runtime_config_patch | bool
        - contentiq_frontend_patch_early_after_cr | bool

    - name: "Step 6a-pre: Strip baked backend .env so K8s MONGODB_URI is used"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/patch-backend-dotenv-override.yml"
      when: contentiq_backend_strip_baked_dotenv | bool

    # --- Step 6b: Align backend secret to live Routes (guide: oc patch FRONTEND_URL, CORS, cookie, OAuth + rollout restart) ---
    - name: "Step 6b: Wait for frontend route hostname"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - route
          - contentiq-frontend
          - -n
          - "{{ contentiq_namespace }}"
          - -o
          - jsonpath={.spec.host}
      register: contentiq_step6b_frontend_route
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step6b_frontend_route.stdout | trim | length > 0
      when: contentiq_align_backend_secret_to_live_routes | bool

    - name: "Step 6b: Wait for backend route hostname"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - route
          - contentiq-backend
          - -n
          - "{{ contentiq_namespace }}"
          - -o
          - jsonpath={.spec.host}
      register: contentiq_step6b_backend_route
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step6b_backend_route.stdout | trim | length > 0
      when: contentiq_align_backend_secret_to_live_routes | bool

    - name: "Step 6b: Build backend secret stringData from live route hosts"
      ansible.builtin.set_fact:
        contentiq_step6b_live_route_secret_stringdata:
          FRONTEND_URL: "https://{{ contentiq_step6b_fe }}"
          CORS_ALLOWED_ORIGINS: "https://{{ contentiq_step6b_fe }}"
          SESSION_COOKIE_DOMAIN: "{{ contentiq_step6b_fe | regex_replace('^[^.]+', '') }}"
          # Cross-origin FE/BE routes: required for Safari/iOS credentialed fetches.
          SESSION_COOKIE_SAMESITE: "None"
          SESSION_COOKIE_SECURE: "true"
          MICROSOFT_REDIRECT_URI: "https://{{ contentiq_step6b_be }}/api/connections/microsoft/auth/microsoft/callback"
          THREAD_MESSAGE_TIMESTAMPS_FILE: "/tmp/.thread_message_timestamps.json"
          # Bake on-prem backend into WXO ContentIQ tools (else prod SaaS URL is used).
          CONTENTIQ_TOOL_API_ENDPOINT: "https://{{ contentiq_step6b_be }}/api/external/contentiq-tool-query"
      vars:
        contentiq_step6b_fe: "{{ contentiq_step6b_frontend_route.stdout | trim }}"
        contentiq_step6b_be: "{{ contentiq_step6b_backend_route.stdout | trim }}"
      when: contentiq_align_backend_secret_to_live_routes | bool

    - name: "Step 6b: Resolve Google and Box OAuth redirect URIs"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/resolve-oauth-redirect-uris.yml"
      vars:
        contentiq_oauth_backend_host: "{{ contentiq_step6b_backend_route.stdout | trim }}"
      when:
        - contentiq_align_backend_secret_to_live_routes | bool
        - contentiq_align_backend_oauth_redirects | bool

    - name: "Step 6b: Append Google and Box OAuth redirect URIs to route alignment"
      ansible.builtin.set_fact:
        contentiq_step6b_live_route_secret_stringdata: "{{ contentiq_step6b_live_route_secret_stringdata | combine(contentiq_oauth_google_box_secret_patch) }}"
      when:
        - contentiq_align_backend_secret_to_live_routes | bool
        - contentiq_align_backend_oauth_redirects | bool

    - name: "Step 6b: Merge-patch backend secret to match live Routes"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - patch
          - secret
          - contentiq-backend-secrets
          - -n
          - "{{ contentiq_namespace }}"
          - --type=merge
          - -p
          - "{{ {'stringData': contentiq_step6b_live_route_secret_stringdata} | to_json }}"
      register: contentiq_step6b_secret_align_patch
      changed_when: true
      when: contentiq_align_backend_secret_to_live_routes | bool
      no_log: true

    - name: "Step 6b: Validate fixed OAuth callback settings"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/validate-dynamic-oauth-secret.yml"
      vars:
        contentiq_oauth_backend_host: "{{ contentiq_step6b_backend_route.stdout | trim }}"
      when:
        - contentiq_align_backend_secret_to_live_routes | bool
        - contentiq_align_backend_oauth_redirects | bool
        - contentiq_oauth_use_fixed_google_box_callback | default(false) | bool

    # Same as rollout-wait-one.yml: without this, the Deployment keeps the 10m default progress deadline.
    - name: "Step 6b-pre: Re-assert backend dotenv override before route-alignment restart"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/patch-backend-dotenv-override.yml"
      vars:
        contentiq_backend_dotenv_restart_after_patch: false
      when: contentiq_backend_strip_baked_dotenv | bool

    - name: "Step 6b: Ensure backend deployment progress deadline before route-alignment restart/wait"
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/roles/contentiq_install/tasks/patch_deployment_min_progress_deadline.yml"
      vars:
        patch_dep_name: contentiq-backend
        patch_dep_namespace: "{{ contentiq_namespace }}"
      when:
        - contentiq_align_backend_secret_to_live_routes | bool
        - contentiq_step6b_wait_backend_rollout_after_align | bool

    - name: "Step 6b: Restart backend deployment to pick up aligned secret"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - rollout
          - restart
          - deployment/contentiq-backend
          - -n
          - "{{ contentiq_namespace }}"
      register: contentiq_step6b_backend_restart
      changed_when: "'restarted' in contentiq_step6b_backend_restart.stdout | default('')"
      when: contentiq_align_backend_secret_to_live_routes | bool

    # Operator reconcile after rollout restart can reset spec.progressDeadlineSeconds to the default (600s);
    # phased rollouts already re-patch after restart in rollout-wait-one.yml — mirror that here so Step 6b
    # does not fail at ~10m while pods are still pulling or scheduling.
    - name: "Step 6b: Re-assert backend dotenv override after route-alignment restart"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/patch-backend-dotenv-override.yml"
      vars:
        contentiq_backend_dotenv_restart_after_patch: false
      when:
        - contentiq_align_backend_secret_to_live_routes | bool
        - contentiq_backend_strip_baked_dotenv | bool

    - name: "Step 6b: Re-ensure backend progress deadline after rollout restart"
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/roles/contentiq_install/tasks/patch_deployment_min_progress_deadline.yml"
      vars:
        patch_dep_name: contentiq-backend
        patch_dep_namespace: "{{ contentiq_namespace }}"
      when:
        - contentiq_align_backend_secret_to_live_routes | bool
        - contentiq_step6b_wait_backend_rollout_after_align | bool

    - name: "Step 6b: Wait for backend rollout after route alignment"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/wait-backend-rollout-step6b.yml"
      when:
        - contentiq_align_backend_secret_to_live_routes | bool
        - contentiq_step6b_wait_backend_rollout_after_align | bool

    - name: "Step 6d-pre: Annotate Route HAProxy timeouts when Routes exist"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/annotate-route-timeouts.yml"
      when: contentiq_annotate_route_timeouts | bool

    - name: "Step 6: Wait for Redis rollout (Deployment or StatefulSet)"
      when:
        - contentiq_enable_phased_rollout | bool
        - contentiq_rollout_wait_redis | bool
      block:
        # Operator creates Redis shortly after the CR reconciles; a single oc get can race and see neither.
        - name: "Step 6: Wait until Redis Deployment or StatefulSet exists"
          ansible.builtin.shell:
            cmd: |
              set -e
              if "{{ contentiq_oc_binary }}" get deployment contentiq-redis -n "{{ contentiq_namespace }}" >/dev/null 2>&1; then
                exit 0
              fi
              if "{{ contentiq_oc_binary }}" get statefulset contentiq-redis -n "{{ contentiq_namespace }}" >/dev/null 2>&1; then
                exit 0
              fi
              exit 1
            executable: /bin/bash
          register: contentiq_step6_redis_wait_exists
          until: contentiq_step6_redis_wait_exists.rc == 0
          retries: "{{ contentiq_wait_retries }}"
          delay: "{{ contentiq_wait_delay_seconds }}"
          changed_when: false

        - name: "Step 6: Detect Redis Deployment"
          ansible.builtin.command:
            argv:
              - "{{ contentiq_oc_binary }}"
              - get
              - deployment
              - contentiq-redis
              - -n
              - "{{ contentiq_namespace }}"
          register: contentiq_step6_redis_dep_get
          failed_when: false
          changed_when: false

        - name: "Step 6: Detect Redis StatefulSet"
          ansible.builtin.command:
            argv:
              - "{{ contentiq_oc_binary }}"
              - get
              - statefulset
              - contentiq-redis
              - -n
              - "{{ contentiq_namespace }}"
          register: contentiq_step6_redis_sts_get
          failed_when: false
          changed_when: false

        - name: "Step 6: Ensure Redis deployment progress deadline before rollout wait"
          ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/roles/contentiq_install/tasks/patch_deployment_min_progress_deadline.yml"
          vars:
            patch_dep_name: contentiq-redis
            patch_dep_namespace: "{{ contentiq_namespace }}"
          when: contentiq_step6_redis_dep_get.rc == 0

        - name: "Step 6: Wait for Redis Deployment rollout"
          ansible.builtin.command:
            argv:
              - "{{ contentiq_oc_binary }}"
              - rollout
              - status
              - deployment/contentiq-redis
              - -n
              - "{{ contentiq_namespace }}"
              - "--timeout={{ contentiq_rollout_timeout_seconds }}s"
          when: contentiq_step6_redis_dep_get.rc == 0
          changed_when: false

        - name: "Step 6: Wait for Redis StatefulSet rollout"
          ansible.builtin.command:
            argv:
              - "{{ contentiq_oc_binary }}"
              - rollout
              - status
              - statefulset/contentiq-redis
              - -n
              - "{{ contentiq_namespace }}"
              - "--timeout={{ contentiq_rollout_timeout_seconds }}s"
          when:
            - contentiq_step6_redis_dep_get.rc != 0
            - contentiq_step6_redis_sts_get.rc == 0
          changed_when: false

        - name: "Step 6: Pause after Redis (before core rollouts)"
          ansible.builtin.pause:
            seconds: "{{ contentiq_rollout_pause_after_redis_seconds | int }}"
          when: (contentiq_rollout_pause_after_redis_seconds | int) > 0

    - name: "Step 6: Wait for core deployments rollout (phased)"
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/roles/contentiq_install/tasks/rollout-wait-one.yml"
      loop: "{{ contentiq_rollout_phase1_deployments }}"
      loop_control:
        loop_var: rollout_dep_name
        index_var: rollout_dep_idx
      vars:
        rollout_dep_list: "{{ contentiq_rollout_phase1_deployments }}"
      when: contentiq_enable_phased_rollout | bool

    - name: "Step 6: Pause before structured-data rollouts (phase 2)"
      ansible.builtin.pause:
        seconds: "{{ contentiq_rollout_pause_before_phase2_seconds | int }}"
      when:
        - contentiq_enable_phased_rollout | bool
        - contentiq_rollout_wait_phase2 | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)
        - (contentiq_rollout_pause_before_phase2_seconds | int) > 0

    # --- Step 7a: SCC, webhook cert, pull secrets (must run before phase-2 oc rollout status or pods never schedule) ---
    - name: "Step 7a: Wait for CNPG controller deployment"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - deployment
          - cnpg-controller-manager
          - -n
          - cnpg-system
      register: contentiq_step7a_cnpg_deployment_wait
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step7a_cnpg_deployment_wait.rc == 0
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)

    # CNPG pods cannot start under restricted-v2 until this binding exists — do this before webhook Secret wait.
    - name: "Step 7a: Read CNPG controller service account name (from Deployment spec)"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - deployment
          - cnpg-controller-manager
          - -n
          - cnpg-system
          - -o
          - jsonpath={.spec.template.spec.serviceAccountName}
      register: contentiq_step7a_cnpg_sa_cmd
      changed_when: false
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)

    - name: Set effective CNPG service account name (Step 7a)
      ansible.builtin.set_fact:
        contentiq_step7_cnpg_sa: "{{ (contentiq_step7a_cnpg_sa_cmd.stdout | trim) or 'default' }}"
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)

    - name: "Step 7a: Grant nonroot-v2 SCC to CNPG controller service account (required before CNPG pods / webhook cert)"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - adm
          - policy
          - add-scc-to-user
          - nonroot-v2
          - -n
          - cnpg-system
          - -z
          - "{{ contentiq_step7_cnpg_sa }}"
      changed_when: false
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)

    - name: "Step 7a: Wait for CNPG webhook certificate secret"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - secret
          - cnpg-webhook-cert
          - -n
          - cnpg-system
      register: contentiq_step7a_cnpg_webhook_cert_wait
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step7a_cnpg_webhook_cert_wait.rc == 0
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)
        - contentiq_step7_wait_cnpg_webhook_cert | bool

    - name: "Step 7a: Ensure cnpg-webhook-cert contains ca.crt (copy from cnpg-ca-secret if missing)"
      ansible.builtin.shell: |
        set -euo pipefail
        OC="{{ contentiq_oc_binary }}"
        NS=cnpg-system
        if "$OC" get secret cnpg-webhook-cert -n "$NS" -o jsonpath='{.data.ca\.crt}' 2>/dev/null | grep -q .; then
          exit 0
        fi
        CA=$("$OC" get secret cnpg-ca-secret -n "$NS" -o jsonpath='{.data.ca\.crt}' 2>/dev/null || true)
        if [ -z "$CA" ]; then
          exit 1
        fi
        "$OC" patch secret cnpg-webhook-cert -n "$NS" --type=json \
          -p="[{\"op\":\"add\",\"path\":\"/data/ca.crt\",\"value\":\"${CA}\"}]"
      args:
        executable: /bin/bash
      register: contentiq_step7a_webhook_ca_ensure
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step7a_webhook_ca_ensure.rc == 0
      changed_when: >-
        ('patched' in (contentiq_step7a_webhook_ca_ensure.stdout | default('')))
        or ('patched' in (contentiq_step7a_webhook_ca_ensure.stderr | default('')))
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)
        - contentiq_step7_wait_cnpg_webhook_cert | bool
        - contentiq_step7_ensure_cnpg_webhook_ca_from_ca_secret | default(true) | bool

    - name: "Step 7a: Wait for lakekeeper service account"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - serviceaccount
          - lakekeeper
          - -n
          - "{{ contentiq_namespace }}"
      register: contentiq_step7a_sa_lakekeeper
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step7a_sa_lakekeeper.rc == 0
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)

    - name: "Step 7a: Wait for trino service account"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - serviceaccount
          - trino
          - -n
          - "{{ contentiq_namespace }}"
      register: contentiq_step7a_sa_trino
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step7a_sa_trino.rc == 0
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)

    - name: "Step 7a: Grant nonroot-v2 SCC to Lakekeeper and Trino (CNPG granted earlier before webhook wait)"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - adm
          - policy
          - add-scc-to-user
          - nonroot-v2
          - -n
          - "{{ item.namespace }}"
          - -z
          - "{{ item.serviceaccount }}"
      loop:
        - namespace: "{{ contentiq_namespace }}"
          serviceaccount: lakekeeper
        - namespace: "{{ contentiq_namespace }}"
          serviceaccount: trino
      changed_when: false
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)

    - name: "Step 7a: Optionally delete Lakekeeper DB migration job (re-run migrations)"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - delete
          - job
          - lakekeeper-db-migration-1
          - -n
          - "{{ contentiq_namespace }}"
          - --ignore-not-found
      register: contentiq_step7a_migration_job_delete
      changed_when: "'deleted' in contentiq_step7a_migration_job_delete.stdout | default('')"
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)
        - contentiq_delete_lakekeeper_migration_job | bool

    - name: "Step 7a: Link pull secret to Lakekeeper/Trino service accounts"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - secrets
          - link
          - "{{ item }}"
          - "{{ contentiq_pull_secret_name }}"
          - --for=pull
          - -n
          - "{{ contentiq_namespace }}"
      loop:
        - lakekeeper
        - trino
      changed_when: false
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)
        - contentiq_registry_pull_secret_link_enabled | bool

    - name: "Step 7a: Optionally link pull secret to default service account"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - secrets
          - link
          - default
          - "{{ contentiq_pull_secret_name }}"
          - --for=pull
          - -n
          - "{{ contentiq_namespace }}"
      changed_when: false
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)
        - contentiq_registry_pull_secret_link_enabled | bool
        - contentiq_link_default_pull_secret_for_structured_data | bool

    # --- Step 7b: Postgres pod before phase-2 rollouts — Lakekeeper init (wait-for-db) needs metadata DB up first ---
    # Select CNPG instance primary only (cluster=postgres alone matches initdb Job pods and breaks oc exec -c postgres).
    - name: "Step 7b: Wait for postgres pod"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - pod
          - -n
          - "{{ contentiq_namespace }}"
          - -l
          - cnpg.io/cluster=postgres,cnpg.io/podRole=instance,cnpg.io/instanceRole=primary
          - -o
          - jsonpath={.items[0].metadata.name}
      register: contentiq_step7_postgres_pod_cmd
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step7_postgres_pod_cmd.stdout | trim | length > 0
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)

    - name: "Step 7b: Wait for postgres primary pod Ready"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - wait
          - pod
          - "{{ contentiq_step7_postgres_pod_cmd.stdout | trim }}"
          - -n
          - "{{ contentiq_namespace }}"
          - --for=condition=Ready
          - "--timeout={{ contentiq_rollout_timeout_seconds }}s"
      changed_when: false
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)
        - contentiq_step7_wait_postgres_ready_before_phase2 | bool

    - name: "Step 7b: Enable pgvector in lakekeeper_metadata DB"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - exec
          - -n
          - "{{ contentiq_namespace }}"
          - "{{ contentiq_step7_postgres_pod_cmd.stdout | trim }}"
          - -c
          - postgres
          - --
          - psql
          - -U
          - postgres
          - -d
          - lakekeeper_metadata
          - -c
          - CREATE EXTENSION IF NOT EXISTS vector;
      changed_when: true
      when:
        - contentiq_enable_structured_data_poststeps | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)
        - contentiq_enable_pgvector | bool

    - name: "Step 6: Wait until structured-data Deployments exist (operator may create them after core)"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - deployment
          - "{{ item }}"
          - -n
          - "{{ contentiq_namespace }}"
      register: contentiq_step6_phase2_dep_present
      changed_when: false
      retries: "{{ contentiq_wait_retries }}"
      delay: "{{ contentiq_wait_delay_seconds }}"
      until: contentiq_step6_phase2_dep_present.rc == 0
      loop: "{{ contentiq_rollout_phase2_deployments }}"
      when:
        - contentiq_enable_phased_rollout | bool
        - contentiq_rollout_wait_phase2 | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)

    - name: "Step 6: Wait for structured-data deployments rollout (after core)"
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/roles/contentiq_install/tasks/rollout-wait-one.yml"
      loop: "{{ contentiq_rollout_phase2_deployments }}"
      loop_control:
        loop_var: rollout_dep_name
        index_var: rollout_dep_idx
      vars:
        rollout_dep_list: "{{ contentiq_rollout_phase2_deployments }}"
      when:
        - contentiq_enable_phased_rollout | bool
        - contentiq_rollout_wait_phase2 | bool
        - not (contentiq_defer_phase2_and_structured_poststeps | bool)

    - name: "Step 6: Wait for all app deployments rollout (single pass, legacy)"
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/roles/contentiq_install/tasks/rollout-wait-one.yml"
      loop: "{{ contentiq_rollout_legacy_deployments }}"
      loop_control:
        loop_var: rollout_dep_name
        index_var: rollout_dep_idx
      vars:
        rollout_dep_list: "{{ contentiq_rollout_legacy_deployments }}"
      when: not (contentiq_enable_phased_rollout | bool)

    # --- Step 6-post: Align /env.json, CORS, HAProxy timeouts, lakehouse port after rollouts ---
    - name: "Step 6-post: Finalize deployment connectivity (after rollouts)"
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/finalize-deployment-connectivity.yml"
      when: contentiq_finalize_connectivity_after_deploy | bool

    - name: "Step 8: Capture frontend route hostname"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - route
          - contentiq-frontend
          - -n
          - "{{ contentiq_namespace }}"
          - -o
          - jsonpath={.spec.host}
      register: contentiq_step8_frontend_route
      changed_when: false

    - name: "Step 8: Capture backend route hostname"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - route
          - contentiq-backend
          - -n
          - "{{ contentiq_namespace }}"
          - -o
          - jsonpath={.spec.host}
      register: contentiq_step8_backend_route
      changed_when: false

    - name: "Step 8: Capture RAG route hostname (if Route exists)"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - route
          - "{{ contentiq_rag_route_name }}"
          - -n
          - "{{ contentiq_namespace }}"
          - -o
          - jsonpath={.spec.host}
      register: contentiq_step8_rag_route
      changed_when: false
      failed_when: false

    # Print URLs here (before Step 9) so the console always shows them even if OSB provision/bind fails later.
    - name: "ContentIQ route URLs (frontend, backend, RAG)"
      ansible.builtin.debug:
        msg:
          - "Frontend URL: https://{{ contentiq_step8_frontend_route.stdout | trim }}"
          - "Backend URL: https://{{ contentiq_step8_backend_route.stdout | trim }}"
          - >-
            RAG URL: {% if (contentiq_step8_rag_route.stdout | default('') | trim | length) > 0 -%}
            https://{{ contentiq_step8_rag_route.stdout | trim }}
            {%- else -%}
            n/a (no Route {{ contentiq_rag_route_name }} in {{ contentiq_namespace }})
            {%- endif %}

    - name: "Step 9: OSB provision and bind (after backend Route from Step 8; not optional)"
      block:
        - name: Set backend base URL for OSB client from live Route
          ansible.builtin.set_fact:
            contentiq_osb_backend_origin: "https://{{ contentiq_step8_backend_route.stdout | trim }}"

        # IBM SM first: TechZone / reserved-instance broker payloads must win over optional ansible/broker.yml.
        # Previously the local file ran first and set contentiq_broker_osb, which skipped the deferred SM fetch.
        - name: "Step 9a-sm: Fetch broker OSB settings from IBM SM when deferred from Step 1b"
          ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/fetch-ibm-sm-broker-osb-deferred.yml"
          when:
            - contentiq_ibmsm_defer_broker_sm_fetch_until_osb | default(false) | bool
            - contentiq_fetch_secrets_from_ibm_sm | bool
            - (contentiq_ibmsm_broker_secret_id | default('') | trim | length) > 0
            - (contentiq_ibmsm_sync_engine | default('ansible') | lower) == 'ansible'
            - contentiq_broker_osb is not defined
            - (contentiq_osb_broker_assignments_inline | default('') | trim | length) == 0

        - name: "Step 9a-file: Load broker OSB settings from local file (IBM SM KEY=value format; fallback)"
          ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/load-broker-osb-from-file.yml"
          when:
            - (contentiq_broker_assignments_file | default('') | trim | length) > 0
            - contentiq_broker_osb is not defined

        - name: "Step 9b: OSB PUT provision and bind (prints username/password)"
          ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/osb-provision-bind-contentiq.yml"

    - name: Print installation summary
      ansible.builtin.debug:
        msg: >-
          {{
            [
              'Installed CSV: ' ~ (contentiq_installed_csv | default('n/a')),
              'Frontend URL: https://' ~ (contentiq_step8_frontend_route.stdout | trim),
              'Backend URL: https://' ~ (contentiq_step8_backend_route.stdout | trim),
            ]
            + (
              [('RAG URL: https://' ~ (contentiq_step8_rag_route.stdout | trim))]
              if (contentiq_step8_rag_route.stdout | default('') | trim | length) > 0
              else [
                'RAG URL: n/a (no Route ' ~ (contentiq_rag_route_name | string) ~ ' in ' ~ (contentiq_namespace | string) ~ ')',
              ]
            )
            + [
              'OSB backend origin: https://' ~ (contentiq_step8_backend_route.stdout | trim),
            ]
            + (
              [
                'OSB instance_id: ' ~ (contentiq_osb_bind_instance_id | string),
                'OSB binding_id: ' ~ (contentiq_osb_bind_binding_id | string),
                'OSB username: ' ~ (contentiq_osb_bind_username | string),
                'OSB password: ' ~ (contentiq_osb_bind_password | string),
              ]
              if (contentiq_osb_bind_username | default('') | trim | length) > 0
              else []
            )
          }}

    - name: Reminder when heavy workloads were deferred
      ansible.builtin.debug:
        msg: >-
          Phase-2 rollouts and Step 7 were skipped (contentiq_defer_phase2_and_structured_poststeps: true).
          Set that to false in parameters.yml or -e and re-run when the cluster has memory for lakehouse/Trino/CNPG work.
      when: contentiq_defer_phase2_and_structured_poststeps | bool
