---
# Merge-patch contentiq-backend-secrets with FRONTEND_URL, CORS, OAuth redirects from live Routes.
# contentiq_align_backend_restart_after_patch: restart backend after patch (false before rollouts exist).
# contentiq_align_backend_wait_rollout_after_patch: wait for rollout after restart.

- name: "Route align: Wait for frontend route hostname"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - route
      - contentiq-frontend
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - jsonpath={.spec.host}
  register: contentiq_step6b_frontend_route
  changed_when: false
  retries: "{{ contentiq_wait_retries }}"
  delay: "{{ contentiq_wait_delay_seconds }}"
  until: contentiq_step6b_frontend_route.stdout | trim | length > 0

- name: "Route align: Wait for backend route hostname"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - route
      - contentiq-backend
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - jsonpath={.spec.host}
  register: contentiq_step6b_backend_route
  changed_when: false
  retries: "{{ contentiq_wait_retries }}"
  delay: "{{ contentiq_wait_delay_seconds }}"
  until: contentiq_step6b_backend_route.stdout | trim | length > 0

- name: "Route align: Build backend secret stringData from live route hosts"
  ansible.builtin.set_fact:
    contentiq_step6b_live_route_secret_stringdata:
      FRONTEND_URL: "https://{{ contentiq_step6b_fe }}"
      CORS_ALLOWED_ORIGINS: "https://{{ contentiq_step6b_fe }}"
      SESSION_COOKIE_DOMAIN: "{{ contentiq_step6b_fe | regex_replace('^[^.]+', '') }}"
      SESSION_COOKIE_SAMESITE: "None"
      SESSION_COOKIE_SECURE: "true"
      MICROSOFT_REDIRECT_URI: "https://{{ contentiq_step6b_be }}/api/connections/microsoft/auth/microsoft/callback"
      # Writable path for analytics timestamps (OpenShift random UID cannot write under /app).
      THREAD_MESSAGE_TIMESTAMPS_FILE: "/tmp/.thread_message_timestamps.json"
      # Bake on-prem backend into WXO ContentIQ tools (else prod SaaS URL is used).
      CONTENTIQ_TOOL_API_ENDPOINT: "https://{{ contentiq_step6b_be }}/api/external/contentiq-tool-query"
  vars:
    contentiq_step6b_fe: "{{ contentiq_step6b_frontend_route.stdout | trim }}"
    contentiq_step6b_be: "{{ contentiq_step6b_backend_route.stdout | trim }}"

- name: "Route align: Resolve Google and Box OAuth redirect URIs"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/resolve-oauth-redirect-uris.yml"
  vars:
    contentiq_oauth_backend_host: "{{ contentiq_step6b_backend_route.stdout | trim }}"
  when: contentiq_align_backend_oauth_redirects | bool

- name: "Route align: Append Google and Box OAuth redirect URIs"
  ansible.builtin.set_fact:
    contentiq_step6b_live_route_secret_stringdata: "{{ contentiq_step6b_live_route_secret_stringdata | combine(contentiq_oauth_google_box_secret_patch) }}"
  when: contentiq_align_backend_oauth_redirects | bool

- name: "Route align: Confirm OAuth patch keys before secret merge-patch"
  ansible.builtin.debug:
    msg: >-
      Route-align secret patch keys:
      {{ contentiq_step6b_live_route_secret_stringdata.keys() | list | sort | join(', ') }}.
      fixed_callback={{ contentiq_oauth_use_fixed_google_box_callback | default(false) }},
      OAUTH_DYNAMIC_REDIRECT_ENABLED={{
        contentiq_step6b_live_route_secret_stringdata.OAUTH_DYNAMIC_REDIRECT_ENABLED | default('MISSING')
      }}
  when: contentiq_align_backend_oauth_redirects | bool

- name: "Route align: Merge-patch backend secret to match live Routes"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - patch
      - secret
      - contentiq-backend-secrets
      - -n
      - "{{ contentiq_namespace }}"
      - --type=merge
      - -p
      - "{{ {'stringData': contentiq_step6b_live_route_secret_stringdata} | to_json }}"
  register: contentiq_step6b_secret_align_patch
  changed_when: true
  no_log: true

- name: "Route align: Ensure fixed-callback dynamic OAuth keys on backend secret"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - patch
      - secret
      - contentiq-backend-secrets
      - -n
      - "{{ contentiq_namespace }}"
      - --type=merge
      - -p
      - "{{ {'stringData': contentiq_oauth_google_box_secret_patch} | to_json }}"
  register: contentiq_step6b_oauth_ensure_patch
  changed_when: true
  when:
    - contentiq_align_backend_oauth_redirects | bool
    - contentiq_oauth_use_fixed_google_box_callback | default(false) | bool
  no_log: true

- name: "Route align: Validate fixed OAuth callback settings"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/validate-dynamic-oauth-secret.yml"
  vars:
    contentiq_oauth_backend_host: "{{ contentiq_step6b_backend_route.stdout | trim }}"
  when:
    - contentiq_align_backend_oauth_redirects | bool
    - contentiq_oauth_use_fixed_google_box_callback | default(false) | bool

- name: "Route align: Ensure backend deployment progress deadline before restart/wait"
  ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/roles/contentiq_install/tasks/patch_deployment_min_progress_deadline.yml"
  vars:
    patch_dep_name: contentiq-backend
    patch_dep_namespace: "{{ contentiq_namespace }}"
  when:
    - contentiq_align_backend_restart_after_patch | bool
    - contentiq_align_backend_wait_rollout_after_patch | bool

- name: "Route align: Restart backend deployment to pick up aligned secret"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - rollout
      - restart
      - deployment/contentiq-backend
      - -n
      - "{{ contentiq_namespace }}"
  register: contentiq_step6b_backend_restart
  changed_when: "'restarted' in contentiq_step6b_backend_restart.stdout | default('')"
  when: contentiq_align_backend_restart_after_patch | bool

- name: "Route align: Re-ensure backend progress deadline after rollout restart"
  ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/roles/contentiq_install/tasks/patch_deployment_min_progress_deadline.yml"
  vars:
    patch_dep_name: contentiq-backend
    patch_dep_namespace: "{{ contentiq_namespace }}"
  when:
    - contentiq_align_backend_restart_after_patch | bool
    - contentiq_align_backend_wait_rollout_after_patch | bool

- name: "Route align: Wait for backend rollout after secret alignment"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - rollout
      - status
      - deployment/contentiq-backend
      - -n
      - "{{ contentiq_namespace }}"
      - "--timeout={{ contentiq_rollout_timeout_seconds }}s"
  changed_when: false
  when:
    - contentiq_align_backend_restart_after_patch | bool
    - contentiq_align_backend_wait_rollout_after_patch | bool
