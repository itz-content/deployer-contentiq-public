---
# Post-alignment checks: /env.json, backend CORS, frontend-config keys, edge-gateway from backend pod.
# Set contentiq_verify_env_json_and_cors=false for Step 6f (edge-gateway only, before Step 6-post align).

- name: "Verify: Resolve route hostnames"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - route
      - "{{ item.route }}"
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - jsonpath={.spec.host}
  register: contentiq_step6e_route_hosts
  changed_when: false
  loop:
    - { route: contentiq-frontend, key: frontend }
    - { route: contentiq-backend, key: backend }
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: Set route host facts"
  ansible.builtin.set_fact:
    contentiq_verify_frontend_host: "{{ contentiq_step6e_route_hosts.results[0].stdout | trim }}"
    contentiq_verify_backend_host: "{{ contentiq_step6e_route_hosts.results[1].stdout | trim }}"
    contentiq_verify_frontend_origin: "https://{{ contentiq_step6e_route_hosts.results[0].stdout | trim }}"
    contentiq_verify_backend_api_url: "https://{{ contentiq_step6e_route_hosts.results[1].stdout | trim }}"
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: Fetch frontend /env.json"
  ansible.builtin.uri:
    url: "{{ contentiq_verify_frontend_origin }}/env.json"
    method: GET
    validate_certs: false
    return_content: true
    status_code: 200
  register: contentiq_step6e_env_json
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: Assert /env.json apiBaseUrl matches backend route"
  ansible.builtin.assert:
    that:
      - contentiq_step6e_env_json.json is mapping
      - contentiq_step6e_env_json.json.apiBaseUrl is defined
      - contentiq_step6e_env_json.json.apiBaseUrl | length > 0
      - contentiq_step6e_env_json.json.apiBaseUrl == contentiq_verify_backend_api_url
    fail_msg: >-
      /env.json apiBaseUrl must be {{ contentiq_verify_backend_api_url }}.
      Got: {{ contentiq_step6e_env_json.content | default('') }}.
      Patch frontend-config (CONTENTIQ_API_BASE_URL) and apply frontend-runtime-config-patch.yaml.
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

# ansible.legacy.uri has no return_headers; curl checks JSON body + CORS in one step.
- name: "Verify: Backend health JSON and CORS (curl)"
  ansible.builtin.shell: |
    set -euo pipefail
    hdr="$(mktemp)"
    body="$(mktemp)"
    trap 'rm -f "$hdr" "$body"' EXIT
    curl -sk -D "$hdr" -o "$body" \
      -H "Origin: {{ contentiq_verify_frontend_origin }}" \
      "{{ contentiq_verify_backend_api_url }}/api/support/health"
    python3 -c "import json,sys; d=json.load(open('$body')); sys.exit(0 if d.get('status')=='healthy' else 1)"
    grep -qiF "access-control-allow-origin: {{ contentiq_verify_frontend_origin }}" "$hdr"
  args:
    executable: /bin/bash
  register: contentiq_step6e_backend_health_cors
  changed_when: false
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: Read frontend-config keys"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - configmap
      - frontend-config
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - jsonpath={.data}
  register: contentiq_step6e_frontend_cm
  changed_when: false
  failed_when: false
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: Warn when CONTENTIQ_API_BASE_URL missing from frontend-config"
  ansible.builtin.debug:
    msg: >-
      WARN: frontend-config should include CONTENTIQ_API_BASE_URL={{ contentiq_verify_backend_api_url }}
      (operator may only set ONPREM_API_URL). Step 6c merge-patch should add it.
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool
    - contentiq_step6e_frontend_cm.stdout is defined
    - "'CONTENTIQ_API_BASE_URL' not in contentiq_step6e_frontend_cm.stdout"

- name: "Verify: Resolve backend pod for in-cluster checks"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - pods
      - -n
      - "{{ contentiq_namespace }}"
      - -l
      - app=contentiq-backend
      - --field-selector=status.phase=Running
      - -o
      - jsonpath={.items[0].metadata.name}
  register: contentiq_step6e_backend_pod
  changed_when: false
  retries: "{{ contentiq_wait_retries }}"
  delay: "{{ contentiq_wait_delay_seconds }}"
  until: contentiq_step6e_backend_pod.stdout | trim | length > 0
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_edge_gateway_from_backend | bool

- name: "Verify: Probe edge-gateway from backend pod"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - exec
      - -n
      - "{{ contentiq_namespace }}"
      - "{{ contentiq_step6e_backend_pod.stdout | trim }}"
      - -c
      - "{{ contentiq_backend_container_name }}"
      - --
      - python3
      - -c
      - |
        import os
        import urllib.error
        import urllib.request
        port = os.environ.get('LAKEHOUSE_INGRESS_PORT', '8080')
        url = f'http://edge-gateway:{port}/management/v1/warehouse'
        try:
            urllib.request.urlopen(url, timeout=8)
        except urllib.error.HTTPError as exc:
            if exc.code in (401, 403):
                print('ok')
            else:
                raise
        else:
            print('ok')
  register: contentiq_step6e_edge_gateway_probe
  changed_when: false
  failed_when: false
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_edge_gateway_from_backend | bool

- name: "Verify: edge-gateway probe failed (structured data / playground may lack tables)"
  ansible.builtin.debug:
    msg: >-
      WARN: backend cannot reach http://edge-gateway/management/v1/warehouse within 8s.
      Check edge-gateway, edge-auth-proxy, lakekeeper pods in {{ contentiq_namespace }}.
      Playground structured queries and ingest-to-lakehouse may fail until this is fixed.
      stderr: {{ contentiq_step6e_edge_gateway_probe.stderr | default('') }}
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_edge_gateway_from_backend | bool
    - contentiq_step6e_edge_gateway_probe.rc | default(0) != 0

- name: "Verify: /env.json and CORS OK"
  ansible.builtin.debug:
    msg:
      - "Frontend: {{ contentiq_verify_frontend_origin }}"
      - "Backend:  {{ contentiq_verify_backend_api_url }}"
      - "/env.json apiBaseUrl: OK"
      - "Backend CORS on /api/support/health: OK"
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: edge-gateway probe result"
  ansible.builtin.debug:
    msg: >-
      edge-gateway from backend: {{ 'OK' if (contentiq_step6e_edge_gateway_probe.rc | default(1)) == 0 else 'FAILED — check edge-gateway / lakekeeper pods' }}
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_edge_gateway_from_backend | bool
