---
# Post-alignment checks: /env.json, backend CORS, frontend-config keys, edge-gateway from backend pod.
# Set contentiq_verify_env_json_and_cors=false for Step 6f (edge-gateway only, before Step 6-post align).

- name: "Verify: Resolve route hostnames"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - route
      - "{{ item.route }}"
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - jsonpath={.spec.host}
  register: contentiq_step6e_route_hosts
  changed_when: false
  loop:
    - { route: contentiq-frontend, key: frontend }
    - { route: contentiq-backend, key: backend }
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: Set route host facts"
  ansible.builtin.set_fact:
    contentiq_verify_frontend_host: "{{ contentiq_step6e_route_hosts.results[0].stdout | trim }}"
    contentiq_verify_backend_host: "{{ contentiq_step6e_route_hosts.results[1].stdout | trim }}"
    contentiq_verify_frontend_origin: "https://{{ contentiq_step6e_route_hosts.results[0].stdout | trim }}"
    contentiq_verify_backend_api_url: "https://{{ contentiq_step6e_route_hosts.results[1].stdout | trim }}"
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: Fetch frontend /env.json"
  ansible.builtin.uri:
    url: "{{ contentiq_verify_frontend_origin }}/env.json"
    method: GET
    validate_certs: false
    return_content: true
    status_code: 200
  register: contentiq_step6e_env_json
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: Assert /env.json apiBaseUrl matches backend route"
  ansible.builtin.assert:
    that:
      - contentiq_step6e_env_json.json is mapping
      - contentiq_step6e_env_json.json.apiBaseUrl is defined
      - contentiq_step6e_env_json.json.apiBaseUrl | length > 0
      - contentiq_step6e_env_json.json.apiBaseUrl == contentiq_verify_backend_api_url
    fail_msg: >-
      /env.json apiBaseUrl must be {{ contentiq_verify_backend_api_url }}.
      Got: {{ contentiq_step6e_env_json.content | default('') }}.
      Patch frontend-config (CONTENTIQ_API_BASE_URL) and apply frontend-runtime-config-patch.yaml.
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

# ansible.legacy.uri has no return_headers; curl checks JSON body + CORS in one step.
- name: "Verify: Backend health JSON and CORS (curl)"
  ansible.builtin.shell: |
    set -euo pipefail
    hdr="$(mktemp)"
    body="$(mktemp)"
    trap 'rm -f "$hdr" "$body"' EXIT
    curl -sk -D "$hdr" -o "$body" \
      -H "Origin: {{ contentiq_verify_frontend_origin }}" \
      "{{ contentiq_verify_backend_api_url }}/api/support/health"
    python3 -c "import json,sys; d=json.load(open('$body')); sys.exit(0 if d.get('status')=='healthy' else 1)"
    grep -qiF "access-control-allow-origin: {{ contentiq_verify_frontend_origin }}" "$hdr"
  args:
    executable: /bin/bash
  register: contentiq_step6e_backend_health_cors
  changed_when: false
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: Safari session cookie attrs on backend secret"
  ansible.builtin.shell: |
    set -euo pipefail
    samesite="$({{ contentiq_oc_binary }} get secret contentiq-backend-secrets -n {{ contentiq_namespace }} -o jsonpath='{.data.SESSION_COOKIE_SAMESITE}' | base64 -d || true)"
    secure="$({{ contentiq_oc_binary }} get secret contentiq-backend-secrets -n {{ contentiq_namespace }} -o jsonpath='{.data.SESSION_COOKIE_SECURE}' | base64 -d || true)"
    echo "SESSION_COOKIE_SAMESITE=${samesite}"
    echo "SESSION_COOKIE_SECURE=${secure}"
    test "${samesite}" = "None"
    test "${secure}" = "true"
  args:
    executable: /bin/bash
  register: contentiq_step6e_session_cookie_attrs
  changed_when: false
  failed_when: false
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: Assert Safari session cookie attrs"
  ansible.builtin.assert:
    that:
      - contentiq_step6e_session_cookie_attrs.rc == 0
    fail_msg: >-
      contentiq-backend-secrets must set SESSION_COOKIE_SAMESITE=None and SESSION_COOKIE_SECURE=true
      for Safari/iOS (cross-origin FE/BE). Re-run Step 6-post / patch-backend-secret-to-live-routes,
      or ensure IBM SM backend payload includes those keys. Got: {{ contentiq_step6e_session_cookie_attrs.stdout | default('') }}
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: ContentIQ tool endpoint matches the live backend Route"
  ansible.builtin.shell: |
    set -euo pipefail
    expected="{{ contentiq_verify_backend_api_url }}/api/external/contentiq-tool-query"
    secret_endpoint="$({{ contentiq_oc_binary }} get secret contentiq-backend-secrets -n {{ contentiq_namespace }} -o jsonpath='{.data.CONTENTIQ_TOOL_API_ENDPOINT}' | base64 -d)"
    pod_endpoint="$({{ contentiq_oc_binary }} exec deployment/contentiq-backend -n {{ contentiq_namespace }} -c {{ contentiq_backend_container_name }} -- sh -c 'printf %s "${CONTENTIQ_TOOL_API_ENDPOINT-}"')"
    test "${secret_endpoint}" = "${expected}"
    test "${pod_endpoint}" = "${expected}"
  args:
    executable: /bin/bash
  register: contentiq_step6e_tool_endpoint
  changed_when: false
  failed_when: false
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool
    - contentiq_verify_tool_api_endpoint | default(true) | bool

- name: "Verify: Assert ContentIQ tool endpoint"
  ansible.builtin.assert:
    that:
      - contentiq_step6e_tool_endpoint.rc == 0
    fail_msg: >-
      CONTENTIQ_TOOL_API_ENDPOINT must be the live backend Route plus
      /api/external/contentiq-tool-query in both contentiq-backend-secrets and the running backend pod.
      Re-run Step 6-post route alignment. Got: {{ contentiq_step6e_tool_endpoint.stdout | default('') }}
      {{ contentiq_step6e_tool_endpoint.stderr | default('') }}
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool
    - contentiq_verify_tool_api_endpoint | default(true) | bool

- name: "Verify: Frontend-host /api path Route proxies to backend (Safari)"
  ansible.builtin.shell: |
    set -euo pipefail
    code="$(curl -sk -o /tmp/contentiq-verify-fe-api.body -w '%{http_code}' \
      "{{ contentiq_verify_frontend_origin }}/api/auth/get-credentials")"
    echo "HTTP_${code}"
    test "${code}" = "401"
    ! grep -qi 'File not found' /tmp/contentiq-verify-fe-api.body
  args:
    executable: /bin/bash
  register: contentiq_step6e_frontend_api_path
  changed_when: false
  failed_when: false
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool
    - contentiq_ensure_frontend_api_path_route | default(true) | bool

- name: "Verify: Assert frontend-host /api path Route"
  ansible.builtin.assert:
    that:
      - contentiq_step6e_frontend_api_path.rc == 0
    fail_msg: >-
      https://{{ contentiq_verify_frontend_host | default('') }}/api/auth/get-credentials must return 401 JSON
      (proxied to backend), not 404 File not found from frontend static server.
      Re-run Step 6-post / scripts/ensure-frontend-api-path-route.sh.
      Got: {{ contentiq_step6e_frontend_api_path.stdout | default('') }}
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool
    - contentiq_ensure_frontend_api_path_route | default(true) | bool

- name: "Verify: Read frontend-config keys"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - configmap
      - frontend-config
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - jsonpath={.data}
  register: contentiq_step6e_frontend_cm
  changed_when: false
  failed_when: false
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: Warn when CONTENTIQ_API_BASE_URL missing from frontend-config"
  ansible.builtin.debug:
    msg: >-
      WARN: frontend-config should include CONTENTIQ_API_BASE_URL={{ contentiq_verify_backend_api_url }}
      (operator may only set ONPREM_API_URL). Step 6c merge-patch should add it.
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool
    - contentiq_step6e_frontend_cm.stdout is defined
    - "'CONTENTIQ_API_BASE_URL' not in contentiq_step6e_frontend_cm.stdout"

- name: "Verify: Resolve backend pod for in-cluster checks"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - pods
      - -n
      - "{{ contentiq_namespace }}"
      - -l
      - app=contentiq-backend
      - --field-selector=status.phase=Running
      - -o
      - jsonpath={.items[0].metadata.name}
  register: contentiq_step6e_backend_pod
  changed_when: false
  retries: "{{ contentiq_wait_retries }}"
  delay: "{{ contentiq_wait_delay_seconds }}"
  until: contentiq_step6e_backend_pod.stdout | trim | length > 0
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_edge_gateway_from_backend | bool

- name: "Verify: Probe edge-gateway from backend pod"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - exec
      - -n
      - "{{ contentiq_namespace }}"
      - "{{ contentiq_step6e_backend_pod.stdout | trim }}"
      - -c
      - "{{ contentiq_backend_container_name }}"
      - --
      - python3
      - -c
      - |
        import os
        import urllib.error
        import urllib.request
        port = os.environ.get('LAKEHOUSE_INGRESS_PORT', '8080')
        url = f'http://edge-gateway:{port}/management/v1/warehouse'
        try:
            urllib.request.urlopen(url, timeout=8)
        except urllib.error.HTTPError as exc:
            if exc.code in (401, 403):
                print('ok')
            else:
                raise
        else:
            print('ok')
  register: contentiq_step6e_edge_gateway_probe
  changed_when: false
  failed_when: false
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_edge_gateway_from_backend | bool

- name: "Verify: edge-gateway probe failed (structured data / playground may lack tables)"
  ansible.builtin.debug:
    msg: >-
      WARN: backend cannot reach http://edge-gateway/management/v1/warehouse within 8s.
      Check edge-gateway, edge-auth-proxy, lakekeeper pods in {{ contentiq_namespace }}.
      Playground structured queries and ingest-to-lakehouse may fail until this is fixed.
      stderr: {{ contentiq_step6e_edge_gateway_probe.stderr | default('') }}
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_edge_gateway_from_backend | bool
    - contentiq_step6e_edge_gateway_probe.rc | default(0) != 0

- name: "Verify: /env.json and CORS OK"
  ansible.builtin.debug:
    msg:
      - "Frontend: {{ contentiq_verify_frontend_origin }}"
      - "Backend:  {{ contentiq_verify_backend_api_url }}"
      - "/env.json apiBaseUrl: OK"
      - "Backend CORS on /api/support/health: OK"
      - "SESSION_COOKIE_SAMESITE=None + SESSION_COOKIE_SECURE=true: OK (Safari)"
      - "CONTENTIQ_TOOL_API_ENDPOINT matches live backend Route: OK"
      - "Frontend-host /api path Route → backend: OK (Safari same-origin /api)"
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_env_json_and_cors | default(true) | bool

- name: "Verify: edge-gateway probe result"
  ansible.builtin.debug:
    msg: >-
      edge-gateway from backend: {{ 'OK' if (contentiq_step6e_edge_gateway_probe.rc | default(1)) == 0 else 'FAILED — check edge-gateway / lakekeeper pods' }}
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_edge_gateway_from_backend | bool

- name: "Verify: Confirm Lakekeeper bootstrapped=true (when lakekeeper present)"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - exec
      - -n
      - "{{ contentiq_namespace }}"
      - deploy/contentiq-backend
      - -c
      - "{{ contentiq_backend_container_name }}"
      - --
      - python3
      - -c
      - |
        import json
        import os
        import urllib.request
        token = os.environ.get("LAKEHOUSE_SERVICE_TOKEN", "").strip()
        headers = {"Accept": "application/json"}
        if token:
            headers["Authorization"] = f"Bearer {token}"
        req = urllib.request.Request(
            "http://lakekeeper:8181/management/v1/info",
            headers=headers,
            method="GET",
        )
        with urllib.request.urlopen(req, timeout=10) as resp:
            info = json.loads(resp.read().decode())
        print(json.dumps({"bootstrapped": bool(info.get("bootstrapped"))}))
        raise SystemExit(0 if info.get("bootstrapped") is True else 1)
  register: contentiq_verify_lakekeeper_bootstrap_probe
  changed_when: false
  failed_when: false
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_lakekeeper_bootstrap | default(true) | bool
    - not (contentiq_defer_phase2_and_structured_poststeps | default(false) | bool)

- name: "Verify: Lakekeeper not bootstrapped (structured playground may soft-fail)"
  ansible.builtin.debug:
    msg: >-
      WARN: Lakekeeper reports bootstrapped=false (or probe failed).
      Structured document chat may return "couldn't retrieve the information" until
      Step 6-post bootstrap-lakekeeper.yml runs successfully.
      stdout={{ contentiq_verify_lakekeeper_bootstrap_probe.stdout | default('') }}
      stderr={{ contentiq_verify_lakekeeper_bootstrap_probe.stderr | default('') }}
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_lakekeeper_bootstrap | default(true) | bool
    - not (contentiq_defer_phase2_and_structured_poststeps | default(false) | bool)
    - contentiq_verify_lakekeeper_bootstrap_probe.rc | default(0) != 0

- name: "Verify: Lakekeeper bootstrapped OK"
  ansible.builtin.debug:
    msg: "Lakekeeper bootstrapped: OK {{ contentiq_verify_lakekeeper_bootstrap_probe.stdout | default('') | trim }}"
  when:
    - contentiq_verify_deploy_connectivity | bool
    - contentiq_verify_lakekeeper_bootstrap | default(true) | bool
    - not (contentiq_defer_phase2_and_structured_poststeps | default(false) | bool)
    - contentiq_verify_lakekeeper_bootstrap_probe.rc | default(1) == 0
