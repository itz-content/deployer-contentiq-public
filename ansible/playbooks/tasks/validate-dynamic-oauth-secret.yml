---
# Validate the live backend Secret after route alignment. This catches IBM SM
# refreshes, missing dynamic-state settings, and stale reservation origins
# before a user reaches the provider consent screen.
# Requires: contentiq_oauth_backend_host, contentiq_oauth_fixed_callback_base

- name: "OAuth validation: Read aligned backend secret"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - secret
      - contentiq-backend-secrets
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - json
  register: contentiq_dynamic_oauth_secret_cmd
  changed_when: false
  no_log: true

- name: "OAuth validation: Decode required dynamic callback settings"
  ansible.builtin.set_fact:
    contentiq_dynamic_oauth_enabled: "{{ (_data.OAUTH_DYNAMIC_REDIRECT_ENABLED | default('') | b64decode | trim | lower) }}"
    contentiq_dynamic_oauth_proxy_base: "{{ (_data.OAUTH_CALLBACK_PROXY_BASE | default('') | b64decode | trim | regex_replace('/$', '')) }}"
    contentiq_dynamic_oauth_backend_origin: "{{ (_data.OAUTH_CALLBACK_BACKEND_ORIGIN | default('') | b64decode | trim | regex_replace('/$', '')) }}"
    contentiq_dynamic_oauth_state_secret_length: "{{ (_data.OAUTH_CALLBACK_STATE_SECRET | default('') | b64decode | trim | length) }}"
    contentiq_dynamic_oauth_state_ttl: "{{ (_data.OAUTH_STATE_TTL_SECONDS | default('') | b64decode | trim) | default('600', true) }}"
  vars:
    _data: "{{ (contentiq_dynamic_oauth_secret_cmd.stdout | from_json).data | default({}) }}"
  no_log: true

- name: "OAuth validation: Assert fixed callback flow is ready"
  ansible.builtin.assert:
    that:
      - contentiq_dynamic_oauth_enabled in ['true', '1', 'yes', 'on']
      - contentiq_dynamic_oauth_state_secret_length | int >= 32
      - contentiq_dynamic_oauth_state_ttl | int >= 600
      - contentiq_dynamic_oauth_state_ttl | int <= 3600
      - contentiq_dynamic_oauth_proxy_base == (contentiq_oauth_fixed_callback_base | trim | regex_replace('/$', ''))
      - contentiq_dynamic_oauth_backend_origin == ('https://' ~ contentiq_oauth_backend_host | trim | regex_replace('/$', ''))
    fail_msg: >-
      Fixed OAuth callback validation failed after Step 6b auto-ensure. Expected
      OAUTH_DYNAMIC_REDIRECT_ENABLED=true, OAUTH_CALLBACK_STATE_SECRET (>=32 chars),
      OAUTH_STATE_TTL_SECONDS in 600–3600, OAUTH_CALLBACK_PROXY_BASE matching
      contentiq_oauth_fixed_callback_base, and OAUTH_CALLBACK_BACKEND_ORIGIN matching
      the live contentiq-backend Route. Check that resolve-oauth-redirect-uris.yml
      ran with a fixed callback base and that the merge-patch to contentiq-backend-secrets succeeded.
    success_msg: "Fixed OAuth callback settings match the live reservation backend Route."
