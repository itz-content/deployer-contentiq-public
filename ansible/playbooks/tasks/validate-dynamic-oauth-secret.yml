---
# Validate the live backend Secret after route alignment. This catches IBM SM
# refreshes, missing dynamic-state settings, and stale reservation origins
# before a user reaches the provider consent screen.
# Requires: contentiq_oauth_backend_host, contentiq_oauth_fixed_callback_base

- name: "OAuth validation: Read aligned backend secret"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - secret
      - contentiq-backend-secrets
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - json
  register: contentiq_dynamic_oauth_secret_cmd
  changed_when: false
  no_log: true

- name: "OAuth validation: Decode required dynamic callback settings"
  ansible.builtin.set_fact:
    contentiq_dynamic_oauth_enabled: "{{ (_raw_enabled | b64decode | trim | lower) if (_raw_enabled | length > 0) else '' }}"
    contentiq_dynamic_oauth_proxy_base: "{{ (_raw_proxy | b64decode | trim | regex_replace('/$', '')) if (_raw_proxy | length > 0) else '' }}"
    contentiq_dynamic_oauth_backend_origin: "{{ (_raw_origin | b64decode | trim | regex_replace('/$', '')) if (_raw_origin | length > 0) else '' }}"
    contentiq_dynamic_oauth_state_secret_length: "{{ (_raw_state | b64decode | trim | length) if (_raw_state | length > 0) else 0 }}"
    contentiq_dynamic_oauth_state_ttl: "{{ (_raw_ttl | b64decode | trim) if (_raw_ttl | length > 0) else '600' }}"
    contentiq_dynamic_oauth_present_keys: "{{ _data.keys() | list | select('match', '^OAUTH_|^GOOGLE_REDIRECT|^BOX_REDIRECT') | list | sort }}"
  vars:
    _data: "{{ (contentiq_dynamic_oauth_secret_cmd.stdout | from_json).data | default({}) }}"
    _raw_enabled: "{{ _data.OAUTH_DYNAMIC_REDIRECT_ENABLED | default('', true) | trim }}"
    _raw_proxy: "{{ _data.OAUTH_CALLBACK_PROXY_BASE | default('', true) | trim }}"
    _raw_origin: "{{ _data.OAUTH_CALLBACK_BACKEND_ORIGIN | default('', true) | trim }}"
    _raw_state: "{{ _data.OAUTH_CALLBACK_STATE_SECRET | default('', true) | trim }}"
    _raw_ttl: "{{ _data.OAUTH_STATE_TTL_SECONDS | default('', true) | trim }}"
  no_log: true

- name: "OAuth validation: Assert fixed callback flow is ready"
  ansible.builtin.assert:
    that:
      - contentiq_dynamic_oauth_enabled | string | lower in ['true', '1', 'yes', 'on']
      - contentiq_dynamic_oauth_state_secret_length | int >= 32
      - contentiq_dynamic_oauth_state_ttl | int >= 600
      - contentiq_dynamic_oauth_state_ttl | int <= 3600
      - contentiq_dynamic_oauth_proxy_base == (contentiq_oauth_fixed_callback_base | trim | regex_replace('/$', ''))
      - contentiq_dynamic_oauth_backend_origin == ('https://' ~ contentiq_oauth_backend_host | trim | regex_replace('/$', ''))
    fail_msg: >-
      Fixed OAuth callback validation failed after Step 6b auto-ensure.
      OAUTH_DYNAMIC_REDIRECT_ENABLED={{ contentiq_dynamic_oauth_enabled | default('') | quote }}
      (want true), OAUTH_CALLBACK_STATE_SECRET length={{ contentiq_dynamic_oauth_state_secret_length }}
      (want >=32), OAUTH_STATE_TTL_SECONDS={{ contentiq_dynamic_oauth_state_ttl | quote }}
      (want 600–3600), OAUTH_CALLBACK_PROXY_BASE={{ contentiq_dynamic_oauth_proxy_base | quote }}
      (want {{ contentiq_oauth_fixed_callback_base | trim | regex_replace('/$', '') | quote }}),
      OAUTH_CALLBACK_BACKEND_ORIGIN={{ contentiq_dynamic_oauth_backend_origin | quote }}
      (want {{ ('https://' ~ contentiq_oauth_backend_host | trim | regex_replace('/$', '')) | quote }}).
      Present OAuth-related keys: {{ contentiq_dynamic_oauth_present_keys | join(', ') }}.
      Check that resolve-oauth-redirect-uris.yml ran with a fixed callback base and that the
      merge-patch to contentiq-backend-secrets included OAUTH_DYNAMIC_REDIRECT_ENABLED.
    success_msg: "Fixed OAuth callback settings match the live reservation backend Route."
