    - name: Build backend OpenShift Secret manifest from SM payload
      ansible.builtin.shell: |
        set -euo pipefail
        export IBMSM_FORMAT="{{ contentiq_ibmsm_backend_payload_format }}"
        export IBMSM_RAW="{{ contentiq_ibmsm_temp_path }}/backend.payload.raw"
        export IBMSM_OUT="{{ contentiq_ibmsm_temp_path }}/backend.manifest.json"
        export IBMSM_NAME="{{ contentiq_ibmsm_backend_k8s_secret_name }}"
        export IBMSM_NS="{{ contentiq_namespace }}"
        python3 <<'PY'
        import base64
        import json
        import os
        import re

        fmt = os.environ["IBMSM_FORMAT"]
        raw_path = os.environ["IBMSM_RAW"]
        out_path = os.environ["IBMSM_OUT"]
        k8s_name = os.environ["IBMSM_NAME"]
        ns = os.environ["IBMSM_NS"]
        raw = open(raw_path, encoding="utf-8-sig").read().strip()
        if fmt == "json-stringdata":
            if not raw:
                raise SystemExit("SM payload is empty (json-stringdata)")

            def load_flat_json_object_blob(blob, label, b64_hint_var):
                cur = blob
                b64_used = False
                for _ in range(8):
                    data = None
                    try:
                        data = json.loads(cur)
                    except json.JSONDecodeError:
                        if _ == 0 and not b64_used:
                            b64_used = True
                            pad = (-len(cur)) % 4
                            try:
                                cur = base64.b64decode(cur + "=" * pad, validate=False).decode(
                                    "utf-8"
                                ).strip()
                                continue
                            except Exception:
                                pass
                        raise SystemExit(
                            "%s is not valid JSON (json-stringdata). If SM stores base64, set %s true."
                            % (label, b64_hint_var)
                        )
                    if isinstance(data, str):
                        cur = data.strip()
                        continue
                    if isinstance(data, list):
                        if len(data) == 1 and isinstance(data[0], dict):
                            return data[0]
                        raise SystemExit(
                            "%s: JSON array; json-stringdata expects one object (or one-element array)."
                            % label
                        )
                    if isinstance(data, dict):
                        if isinstance(data.get("stringData"), dict) and data.get("kind") == "Secret":
                            return dict(data["stringData"])
                        return data
                    raise SystemExit("%s: JSON root must be an object" % label)
                raise SystemExit("%s: too many nested JSON-encoded strings" % label)

            data = load_flat_json_object_blob(
                raw,
                "backend SM payload",
                "contentiq_ibmsm_backend_payload_base64_wrapped",
            )
            if not isinstance(data, dict):
                raise SystemExit("SM JSON root must be an object")
            string_data = {}
            for k, v in data.items():
                if v is None:
                    string_data[k] = ""
                elif isinstance(v, (dict, list)):
                    string_data[k] = json.dumps(v)
                else:
                    string_data[k] = str(v)
            manifest = {
                "apiVersion": "v1",
                "kind": "Secret",
                "metadata": {"name": k8s_name, "namespace": ns},
                "type": "Opaque",
                "stringData": string_data,
            }
            with open(out_path, "w", encoding="utf-8") as f:
                json.dump(manifest, f)
        elif fmt == "env-stringdata":
            if not raw:
                raise SystemExit("SM payload is empty (env-stringdata)")

            def parse_env_stringdata(blob):
                # Prefer KEY: value (YAML-ish) before KEY=value so base64 padding "=" inside quoted values
                # does not become the separator (e.g. API_KEY: "NDF...=").
                out = {}
                re_colon = re.compile(r"^([A-Za-z_][A-Za-z0-9_.-]*)\s*:\s*(.+)$")
                re_equals = re.compile(r"^([A-Za-z_][A-Za-z0-9_.-]*)\s*=\s*(.+)$")
                for raw_line in blob.splitlines():
                    s = raw_line.strip()
                    if not s or s.startswith("#"):
                        continue
                    if s.startswith("export "):
                        s = s[7:].lstrip()
                    m = re_colon.match(s) or re_equals.match(s)
                    if not m:
                        continue
                    key, val = m.group(1), m.group(2).strip()
                    if not key or key.startswith("#"):
                        continue
                    if len(val) >= 2 and val[0] == val[-1] and val[0] in ('"', "'"):
                        val = val[1:-1]
                    out[key] = val
                return out

            data = parse_env_stringdata(raw)
            if not data:
                raise SystemExit(
                    "env-stringdata: no KEY=value or KEY: value entries (comments/blank lines skipped). "
                    "If the file is still base64-wrapped, set contentiq_ibmsm_backend_payload_base64_wrapped true."
                )
            string_data = {k: str(v) for k, v in data.items()}
            manifest = {
                "apiVersion": "v1",
                "kind": "Secret",
                "metadata": {"name": k8s_name, "namespace": ns},
                "type": "Opaque",
                "stringData": string_data,
            }
            with open(out_path, "w", encoding="utf-8") as f:
                json.dump(manifest, f)
        elif fmt == "kubernetes-yaml":
            open(out_path, "w", encoding="utf-8").write(raw)
        else:
            raise SystemExit("Unknown format " + fmt)
        PY
      args:
        executable: /bin/bash
      changed_when: true
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Apply backend secret from temp manifest
      ansible.builtin.command:
        argv:
