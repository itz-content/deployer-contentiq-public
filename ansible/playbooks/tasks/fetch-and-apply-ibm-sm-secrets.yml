---
# Fetch arbitrary secrets from IBM Secrets Manager (v2 API) and oc apply backend, RAG, and registry;
# optionally fetch a 4th broker OSB config secret (KEY = value payload) into fact contentiq_broker_osb.
# credentials. Same payloads as ansible/tekton/task-contentiq-sync-secrets-from-ibm-sm and
# playbooks/scripts/sync-ibm-sm-secrets-to-cluster.sh.
#
# Include from deploy.yml after the namespace exists, e.g.:
#   - ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/fetch-and-apply-ibm-sm-secrets.yml"
#     when: contentiq_fetch_secrets_from_ibm_sm | default(false) | bool
#
# Expected vars (see deploy.yml): contentiq_secrets_manager_endpoint_url, contentiq_ibmsm_*_secret_id,
# contentiq_ibmsm_*_payload_format (json-stringdata | env-stringdata | kubernetes-yaml for backend/RAG),
# contentiq_ibmsm_*_payload_base64_wrapped (true when SM stores the whole payload as one base64 string),
# contentiq_namespace, contentiq_oc_binary, contentiq_pull_secret_name (for default registry secret name).
# Debugging: set contentiq_ibmsm_apply_show_logs true (or legacy contentiq_ibmsm_registry_apply_show_logs)
# to disable no_log on SM fetch/payload/manifest/oc-apply tasks — output may include secrets and API keys.
# Backend SM GET shape (redacted preview): contentiq_ibmsm_debug_backend_sm_response true.
# Broker arbitrary secret (contentiq-broker-secrets): optional; when contentiq_ibmsm_defer_broker_sm_fetch_until_osb
# is true, broker is not fetched here — deploy.yml Step 9 fetches it before OSB provision.
#
# API key: contentiq_ibmsm_api_key / IBMCLOUD_API_KEY / IBM_CLOUD_API_KEY first; if still empty (and not
# contentiq_ibmsm_skip_cluster_api_key), same fallback as sync-ibm-sm-secrets-to-cluster.sh — oc get
# kube-system/ibm-secret .data.apiKey. contentiq_ibmsm_api_key_from_cluster true forces that path and
# fails the play if the secret is missing or empty.
#
- name: IBM Secrets Manager fetch + apply (temp dir, deleted in always)
  block:
    - name: Create temp directory for SM-derived manifests
      ansible.builtin.tempfile:
        state: directory
        prefix: contentiq-ibmsm-
      register: contentiq_ibmsm_tempdir

    - name: Remember temp directory path
      ansible.builtin.set_fact:
        contentiq_ibmsm_temp_path: "{{ contentiq_ibmsm_tempdir.path }}"

    - name: Resolve redaction for IBM SM sensitive tasks (debugging)
      ansible.builtin.set_fact:
        _contentiq_ibmsm_no_log_sensitive_tasks: >-
          {{
            (
              not (
                (contentiq_ibmsm_apply_show_logs | default(false) | bool)
                or (contentiq_ibmsm_registry_apply_show_logs | default(false) | bool)
              )
            ) | bool
          }}

    - name: Normalize Secrets Manager endpoint URL
      ansible.builtin.set_fact:
        _ibmsm_ep: >-
          {{
            (
              contentiq_secrets_manager_endpoint_url
              | default(contentiq_ibmsm_endpoint_url | default('', true), true)
            )
            | trim
            | regex_replace('/$', '')
          }}

    - name: Resolve IBM Cloud API key from extra var, env, or cluster ibm-secret
      ansible.builtin.set_fact:
        _ibmsm_api_key: >-
          {{
            contentiq_ibmsm_api_key
            | default(lookup('env', 'IBMCLOUD_API_KEY'), true)
            | default(lookup('env', 'IBM_CLOUD_API_KEY'), true)
            | default('', true)
            | trim
          }}

    - name: Read IBM API key from kube-system/ibm-secret
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - secret
          - ibm-secret
          - -n
          - kube-system
          - -o
          - jsonpath={.data.apiKey}
      register: contentiq_ibmsm_cluster_apikey_b64
      changed_when: false
      failed_when: >-
        (
          contentiq_ibmsm_api_key_from_cluster | default(false) | bool
        ) and (
          contentiq_ibmsm_cluster_apikey_b64.rc != 0
          or (contentiq_ibmsm_cluster_apikey_b64.stdout | default('') | length == 0)
        )
      when: >-
        (contentiq_ibmsm_api_key_from_cluster | default(false) | bool)
        or (
          (_ibmsm_api_key | default('') | trim | length == 0)
          and not (contentiq_ibmsm_skip_cluster_api_key | default(false) | bool)
        )
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Decode cluster IBM API key
      ansible.builtin.set_fact:
        _ibmsm_api_key: "{{ contentiq_ibmsm_cluster_apikey_b64.stdout | b64decode | trim }}"
      when:
        - not (contentiq_ibmsm_cluster_apikey_b64.skipped | default(false))
        - contentiq_ibmsm_cluster_apikey_b64.stdout | default('') | length > 0
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Assert IBM API key is available
      ansible.builtin.assert:
        that:
          - _ibmsm_api_key | length > 0
        fail_msg: >-
          Set IBMCLOUD_API_KEY / IBM_CLOUD_API_KEY or pass contentiq_ibmsm_api_key; or ensure
          {{ contentiq_oc_binary }} can read kube-system/ibm-secret (same as Tekton / sync-ibm-sm-secrets-to-cluster.sh).
          To require the cluster secret only, set contentiq_ibmsm_api_key_from_cluster true.
          To disable the automatic ibm-secret fallback, set contentiq_ibmsm_skip_cluster_api_key true.

    - name: Strip whitespace from IBM API key (common in kube secrets)
      ansible.builtin.set_fact:
        _ibmsm_api_key: "{{ _ibmsm_api_key | trim }}"
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Obtain IAM access token for Secrets Manager
      block:
        - name: Exchange IBM API key for IAM access token
          ansible.builtin.shell: |
            set -euo pipefail
            if [[ "${IBMSM_TLS_VERIFY:-1}" == "0" ]]; then EXTRA=( -k ); else EXTRA=(); fi
            tmp="$(mktemp)"
            trap 'rm -f "${tmp}"' EXIT
            http_code="$(curl -sS "${EXTRA[@]}" -o "${tmp}" -w '%{http_code}' -X POST "https://iam.cloud.ibm.com/identity/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -H "Accept: application/json" \
              --data-urlencode "grant_type=urn:ibm:params:oauth:grant-type:apikey" \
              --data-urlencode "apikey=${IBM_API_KEY}")"
            python3 - "${tmp}" "${http_code}" <<'PY'
            import json
            import sys

            path, code = sys.argv[1], sys.argv[2]
            with open(path, "r", encoding="utf-8") as f:
                raw = f.read()
            if code != "200":
                try:
                    j = json.loads(raw)
                    detail = (
                        j.get("errorMessage")
                        or j.get("message")
                        or j.get("errorCode")
                        or str(j)[:500]
                    )
                except json.JSONDecodeError:
                    detail = raw[:500]
                sys.stderr.write("IAM token request HTTP %s: %s\n" % (code, detail))
                sys.exit(1)
            try:
                j = json.loads(raw)
            except json.JSONDecodeError:
                sys.stderr.write("IAM response was not JSON (first 400 chars): %r\n" % (raw[:400],))
                sys.exit(1)
            tok = j.get("access_token")
            if not tok:
                sys.stderr.write("IAM JSON missing access_token; keys: %s\n" % list(j.keys()))
                sys.exit(1)
            print(tok)
            PY
          environment:
            IBM_API_KEY: "{{ _ibmsm_api_key }}"
            IBMSM_TLS_VERIFY: "{{ '0' if not (contentiq_ibmsm_tls_validate | default(true) | bool) else '1' }}"
          register: contentiq_ibmsm_access_token_cmd
          changed_when: false
          no_log: "{{ not (contentiq_ibmsm_debug_token_exchange | default(false) | bool) }}"

        - name: Record IAM access token
          ansible.builtin.set_fact:
            contentiq_ibmsm_access_token: "{{ contentiq_ibmsm_access_token_cmd.stdout | trim }}"
      rescue:
        - name: Explain IAM token failure
          ansible.builtin.fail:
            msg: >-
              IBM IAM token exchange failed (after a non-empty API key was found). Ansible hid task output
              because no_log is true. Typical causes: kube-system/ibm-secret apiKey is not a valid IBM Cloud
              API key, key was rotated or revoked, this host cannot reach https://iam.cloud.ibm.com (proxy/firewall),
              or TLS inspection breaks verification (try contentiq_ibmsm_tls_validate: false on the play vars).
              To print curl/Python diagnostics in the log (may expose the API key), re-run with
              -e contentiq_ibmsm_debug_token_exchange=true.
              After a successful token exchange, SM fetch/manifest/oc failures can be debugged with
              -e contentiq_ibmsm_apply_show_logs=true (may expose secret material in logs).

    - name: Optional — list secret names from IBM SM (debug)
      ansible.builtin.shell: |
        set -euo pipefail
        if [[ "${IBMSM_TLS_VERIFY:-1}" == "0" ]]; then EXTRA=( -k ); else EXTRA=(); fi
        curl -fsS "${EXTRA[@]}" -X GET "${SM_URL}/api/v2/secrets" \
          -H "Authorization: Bearer ${IBM_IAM_TOKEN}" \
          -H "Accept: application/json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("\n".join(sorted(x.get("name","") for x in d.get("secrets",[]))[:200]))'
      environment:
        IBM_IAM_TOKEN: "{{ contentiq_ibmsm_access_token }}"
        SM_URL: "{{ _ibmsm_ep }}"
        IBMSM_TLS_VERIFY: "{{ '0' if not (contentiq_ibmsm_tls_validate | default(true) | bool) else '1' }}"
      register: contentiq_ibmsm_list_out
      changed_when: false
      when: contentiq_ibmsm_list_secret_names | default(false) | bool

    - name: Show SM secret name list (debug)
      ansible.builtin.debug:
        var: contentiq_ibmsm_list_out.stdout_lines
      when: contentiq_ibmsm_list_secret_names | default(false) | bool

    - name: Derive secret UUIDs for HTTP GET
      ansible.builtin.set_fact:
        _ibmsm_bid: "{{ contentiq_ibmsm_backend_secret_id | default(lookup('env', 'CONTENTIQ_SM_BACKEND_SECRET_ID'), true) | trim }}"
        _ibmsm_rid: "{{ contentiq_ibmsm_rag_secret_id | default(lookup('env', 'CONTENTIQ_SM_RAG_SECRET_ID'), true) | trim }}"
        _ibmsm_regid: "{{ contentiq_ibmsm_registry_secret_id | default(lookup('env', 'CONTENTIQ_SM_REGISTRY_SECRET_ID'), true) | trim }}"
        _ibmsm_brokerid: >-
          {{
            contentiq_ibmsm_broker_secret_id
            | default(lookup('env', 'CONTENTIQ_IBMSM_BROKER_SECRET_ID'), true)
            | default(lookup('env', 'BROKER_SECRET_KEY_ID'), true)
            | default('', true)
            | trim
          }}

    - name: Decide whether broker secret is fetched during Step 1b (skip when deferred to Step 9)
      ansible.builtin.set_fact:
        _ibmsm_broker_fetch_now: >-
          {{
            (_ibmsm_brokerid | length > 0)
            and not (contentiq_ibmsm_defer_broker_sm_fetch_until_osb | default(false) | bool)
          }}

    - name: "Step 1b note — broker OSB secret timing (avoids silent skip when deferred)"
      ansible.builtin.debug:
        msg: >-
          Broker OSB arbitrary secret id {{ _ibmsm_brokerid }} is not read in this Step 1b because
          contentiq_ibmsm_defer_broker_sm_fetch_until_osb is true; it will be GET from IBM SM in deploy Step 9
          after the backend Route exists. Backend, RAG, and registry secrets are still synced in this Step 1b.
      when:
        - (_ibmsm_brokerid | length > 0)
        - contentiq_ibmsm_defer_broker_sm_fetch_until_osb | default(false) | bool

    - name: Fetch backend secret from IBM SM
      ansible.builtin.shell: |
        set -euo pipefail
        if [[ "${IBMSM_TLS_VERIFY:-1}" == "0" ]]; then EXTRA=( -k ); else EXTRA=(); fi
        curl -fsS "${EXTRA[@]}" -X GET "${SM_URL}" \
          -H "Authorization: Bearer ${IBM_IAM_TOKEN}" \
          -H "Accept: application/json"
      environment:
        IBM_IAM_TOKEN: "{{ contentiq_ibmsm_access_token }}"
        SM_URL: "{{ _ibmsm_ep }}/api/v2/secrets/{{ _ibmsm_bid }}"
        IBMSM_TLS_VERIFY: "{{ '0' if not (contentiq_ibmsm_tls_validate | default(true) | bool) else '1' }}"
      register: contentiq_ibmsm_backend_get
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"
      changed_when: false
      args:
        executable: /bin/bash

    - name: Debug — IBM SM backend secret GET summary (structure + redacted payload preview)
      ansible.builtin.shell: |
        set -euo pipefail
        python3 <<'PY'
        import json
        import sys

        j = json.loads(sys.stdin.read())
        keys = sorted(j.keys())
        name = j.get("name") or (j.get("metadata") or {}).get("name")
        st = j.get("secret_type") or j.get("type")
        sid = j.get("id") or j.get("secret_id")
        d = j.get("data") or {}
        p = d.get("payload", j.get("payload"))
        if p is None and isinstance(d.get("secret_data"), dict):
            p = d["secret_data"].get("payload")
        if isinstance(p, str):
            plen = len(p)
            phead = repr(p[:160])
        elif p is not None:
            s = json.dumps(p)
            plen = len(s)
            phead = repr(s[:160])
        else:
            plen = 0
            phead = "None"
        sys.stderr.write(
            "IBM SM backend GET summary: top_keys=%s name=%r secret_type=%r id=%r payload_python_type=%s "
            "payload_len=%s payload_preview=%s\n"
            % (keys, name, st, sid, type(p).__name__, plen, phead)
        )
        PY
      args:
        executable: /bin/bash
        stdin: "{{ contentiq_ibmsm_backend_get.stdout }}"
      changed_when: false
      when: contentiq_ibmsm_debug_backend_sm_response | default(false) | bool

    - name: Fetch RAG secret from IBM SM
      ansible.builtin.shell: |
        set -euo pipefail
        if [[ "${IBMSM_TLS_VERIFY:-1}" == "0" ]]; then EXTRA=( -k ); else EXTRA=(); fi
        curl -fsS "${EXTRA[@]}" -X GET "${SM_URL}" \
          -H "Authorization: Bearer ${IBM_IAM_TOKEN}" \
          -H "Accept: application/json"
      environment:
        IBM_IAM_TOKEN: "{{ contentiq_ibmsm_access_token }}"
        SM_URL: "{{ _ibmsm_ep }}/api/v2/secrets/{{ _ibmsm_rid }}"
        IBMSM_TLS_VERIFY: "{{ '0' if not (contentiq_ibmsm_tls_validate | default(true) | bool) else '1' }}"
      register: contentiq_ibmsm_rag_get
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"
      changed_when: false
      args:
        executable: /bin/bash

    - name: Fetch registry secret from IBM SM
      ansible.builtin.shell: |
        set -euo pipefail
        if [[ "${IBMSM_TLS_VERIFY:-1}" == "0" ]]; then EXTRA=( -k ); else EXTRA=(); fi
        curl -fsS "${EXTRA[@]}" -X GET "${SM_URL}" \
          -H "Authorization: Bearer ${IBM_IAM_TOKEN}" \
          -H "Accept: application/json"
      environment:
        IBM_IAM_TOKEN: "{{ contentiq_ibmsm_access_token }}"
        SM_URL: "{{ _ibmsm_ep }}/api/v2/secrets/{{ _ibmsm_regid }}"
        IBMSM_TLS_VERIFY: "{{ '0' if not (contentiq_ibmsm_tls_validate | default(true) | bool) else '1' }}"
      register: contentiq_ibmsm_registry_get
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"
      changed_when: false
      args:
        executable: /bin/bash

    - name: Fetch broker OSB config secret from IBM SM (contentiq-broker-secrets style payload)
      ansible.builtin.shell: |
        set -euo pipefail
        if [[ "${IBMSM_TLS_VERIFY:-1}" == "0" ]]; then EXTRA=( -k ); else EXTRA=(); fi
        curl -fsS "${EXTRA[@]}" -X GET "${SM_URL}" \
          -H "Authorization: Bearer ${IBM_IAM_TOKEN}" \
          -H "Accept: application/json"
      environment:
        IBM_IAM_TOKEN: "{{ contentiq_ibmsm_access_token }}"
        SM_URL: "{{ _ibmsm_ep }}/api/v2/secrets/{{ _ibmsm_brokerid }}"
        IBMSM_TLS_VERIFY: "{{ '0' if not (contentiq_ibmsm_tls_validate | default(true) | bool) else '1' }}"
      register: contentiq_ibmsm_broker_get
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"
      changed_when: false
      args:
        executable: /bin/bash
      when: _ibmsm_broker_fetch_now | bool

    - name: Extract SM payload strings
      ansible.builtin.set_fact:
        _ibmsm_backend_payload: >-
          {{
            ((contentiq_ibmsm_backend_get.stdout | from_json).data | default({}, true)).payload
            | default((contentiq_ibmsm_backend_get.stdout | from_json).payload | default('', true), true)
          }}
        _ibmsm_rag_payload: >-
          {{
            ((contentiq_ibmsm_rag_get.stdout | from_json).data | default({}, true)).payload
            | default((contentiq_ibmsm_rag_get.stdout | from_json).payload | default('', true), true)
          }}
        _ibmsm_registry_payload: >-
          {{
            ((contentiq_ibmsm_registry_get.stdout | from_json).data | default({}, true)).payload
            | default((contentiq_ibmsm_registry_get.stdout | from_json).payload | default('', true), true)
          }}
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Extract broker SM payload string
      ansible.builtin.set_fact:
        _ibmsm_broker_payload: >-
          {{
            ((contentiq_ibmsm_broker_get.stdout | from_json).data | default({}, true)).payload
            | default((contentiq_ibmsm_broker_get.stdout | from_json).payload | default('', true), true)
          }}
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"
      when: _ibmsm_broker_fetch_now | bool

    - name: Coerce non-string SM payloads to JSON text (IBM may return objects)
      ansible.builtin.set_fact:
        _ibmsm_backend_payload: >-
          {{
            _ibmsm_backend_payload | to_json
            if (_ibmsm_backend_payload is not string and _ibmsm_backend_payload is not none)
            else _ibmsm_backend_payload
          }}
        _ibmsm_rag_payload: >-
          {{
            _ibmsm_rag_payload | to_json
            if (_ibmsm_rag_payload is not string and _ibmsm_rag_payload is not none)
            else _ibmsm_rag_payload
          }}
        _ibmsm_registry_payload: >-
          {{
            _ibmsm_registry_payload | to_json
            if (_ibmsm_registry_payload is not string and _ibmsm_registry_payload is not none)
            else _ibmsm_registry_payload
          }}
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Coerce non-string broker SM payload to JSON text (IBM may return objects)
      ansible.builtin.set_fact:
        _ibmsm_broker_payload: >-
          {{
            _ibmsm_broker_payload | to_json
            if (_ibmsm_broker_payload is not string and _ibmsm_broker_payload is not none)
            else _ibmsm_broker_payload
          }}
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"
      when: _ibmsm_broker_fetch_now | bool

    - name: Base64-decode SM payload strings where configured (backend and RAG)
      ansible.builtin.set_fact:
        _ibmsm_backend_payload: >-
          {{
            (
              (_ibmsm_backend_payload | trim | replace('\n', '') | replace('\r', ''))
              + ('=' * (((4 - ((_ibmsm_backend_payload | trim | replace('\n', '') | replace('\r', '') | length) % 4)) % 4)))
            ) | b64decode
            if (contentiq_ibmsm_backend_payload_base64_wrapped | default(false) | bool)
            else _ibmsm_backend_payload
          }}
        _ibmsm_rag_payload: >-
          {{
            (
              (_ibmsm_rag_payload | trim | replace('\n', '') | replace('\r', ''))
              + ('=' * (((4 - ((_ibmsm_rag_payload | trim | replace('\n', '') | replace('\r', '') | length) % 4)) % 4)))
            ) | b64decode
            if (contentiq_ibmsm_rag_payload_base64_wrapped | default(false) | bool)
            else _ibmsm_rag_payload
          }}
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Base64-decode broker SM payload when configured
      ansible.builtin.set_fact:
        _ibmsm_broker_payload: >-
          {{
            (
              (_ibmsm_broker_payload | trim | replace('\n', '') | replace('\r', ''))
              + ('=' * (((4 - ((_ibmsm_broker_payload | trim | replace('\n', '') | replace('\r', '') | length) % 4)) % 4)))
            ) | b64decode
            if (contentiq_ibmsm_broker_payload_base64_wrapped | default(false) | bool)
            else _ibmsm_broker_payload
          }}
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"
      when: _ibmsm_broker_fetch_now | bool

    - name: Stage registry payload for Python base64 decode (transport layer; avoids Jinja in secret body)
      when: contentiq_ibmsm_registry_payload_base64_wrapped | default(false) | bool
      ansible.builtin.copy:
        dest: "{{ contentiq_ibmsm_temp_path }}/registry.payload.transport.b64.txt"
        content: "{{ _ibmsm_registry_payload | string | b64encode }}"
        mode: "0600"
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Base64-decode registry SM payload (Python; tolerant padding and url-safe alphabet)
      when: contentiq_ibmsm_registry_payload_base64_wrapped | default(false) | bool
      ansible.builtin.shell: |
        set -euo pipefail
        export IBMSM_TRANSPORT="{{ contentiq_ibmsm_temp_path }}/registry.payload.transport.b64.txt"
        python3 <<'PY'
        import base64
        import os
        import sys

        def normalize(s):
            s = s.strip().replace("\n", "").replace("\r", "").replace(" ", "")
            if len(s) >= 2 and s[0] == '"' and s[-1] == '"':
                s = s[1:-1]
            return s

        def decode_blob(blob):
            orig = blob.strip()
            variants = [orig, orig.translate(str.maketrans("-_", "+/"))]
            seen = set()
            for b0 in variants:
                if not b0 or b0 in seen:
                    continue
                seen.add(b0)
                core = b0.rstrip("=")
                for pad in range(4):
                    try:
                        rawb = base64.b64decode(core + ("=" * pad), validate=False)
                    except Exception:
                        continue
                    if not rawb:
                        continue
                    txt = rawb.decode("utf-8", errors="replace").strip()
                    if txt and txt != orig:
                        return txt
            return None

        enc = open(os.environ["IBMSM_TRANSPORT"], encoding="utf-8").read().strip()
        if not enc:
            sys.exit("registry SM base64 transport file is empty")
        try:
            inner = base64.b64decode(enc, validate=False).decode("utf-8", errors="replace")
        except Exception as e:
            sys.exit("registry transport base64 decode failed: %s" % (e,))
        raw = normalize(inner)
        if not raw:
            sys.exit("registry SM payload is empty after transport unwrap")
        data = decode_blob(raw)
        if data is None:
            sys.exit(
                "registry: could not base64-decode IBM SM payload after tolerant attempts. "
                "If SM returns plain JSON/YAML, set contentiq_ibmsm_registry_payload_base64_wrapped false."
            )
        sys.stdout.write(data)
        PY
      args:
        executable: /bin/bash
      register: _ibmsm_registry_b64_py
      changed_when: false
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Apply Python registry base64 decode to fact
      when: contentiq_ibmsm_registry_payload_base64_wrapped | default(false) | bool
      ansible.builtin.set_fact:
        _ibmsm_registry_payload: "{{ _ibmsm_registry_b64_py.stdout }}"
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Write raw SM payloads to temp files (short-lived)
      ansible.builtin.copy:
