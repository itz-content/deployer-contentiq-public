    - name: Materialize registry pull secret from SM (kubernetes-yaml)
      when: contentiq_ibmsm_registry_payload_format | default('json-stringdata') == 'kubernetes-yaml'
      ansible.builtin.shell: |
        set -euo pipefail
        export IBMSM_REG_RAW="{{ contentiq_ibmsm_temp_path }}/registry.payload.raw"
        export IBMSM_REG_OUT="{{ contentiq_ibmsm_temp_path }}/registry.manifest.apply.yaml"
        python3 <<'PY'
        import json
        import os
        import sys

        raw_path = os.environ["IBMSM_REG_RAW"]
        out_path = os.environ["IBMSM_REG_OUT"]
        raw = open(raw_path, encoding="utf-8").read().strip()
        if not raw:
            sys.exit("registry SM payload is empty")
        try:
            data = json.loads(raw)
        except json.JSONDecodeError:
            open(out_path, "w", encoding="utf-8").write(raw)
            sys.exit(0)
        if isinstance(data, list):
            if not data:
                sys.exit("registry SM JSON is an empty array")
            out = {"apiVersion": "v1", "kind": "List", "items": data}
        elif isinstance(data, dict):
            if data.get("kind") in (None, "") or data.get("apiVersion") in (None, ""):
                sys.exit(
                    "registry SM JSON is a credential/map object, not a Kubernetes manifest (missing kind/apiVersion). "
                    "Use json-stringdata or dockerconfigjson."
                )
            out = data
        else:
            sys.exit("registry SM JSON root must be an object or array, not " + type(data).__name__)
        with open(out_path, "w", encoding="utf-8") as f:
            json.dump(out, f)
        PY
        "{{ contentiq_oc_binary }}" apply -f "${IBMSM_REG_OUT}"
