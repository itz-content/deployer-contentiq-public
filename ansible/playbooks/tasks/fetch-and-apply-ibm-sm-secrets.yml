    - name: Parse broker OSB secret body (KEY = value lines, e.g. contentiq-broker-secrets)
      ansible.builtin.shell: |
        set -euo pipefail
        export BROKER_RAW="{{ contentiq_ibmsm_temp_path }}/broker.payload.raw"
        python3 <<'PY'
        import ast
        import json
        import os
        import re
        import sys

        path = os.environ["BROKER_RAW"]
        raw = open(path, encoding="utf-8-sig").read().strip().lstrip("\ufeff")
        if not raw:
            sys.stderr.write("broker SM payload is empty\n")
            sys.exit(1)

        def defs_from_kv_lines(text):
            out = {}
            for line in text.splitlines():
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                m = re.match(r"^(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$", line)
                if not m:
                    continue
                k, v = m.group(1), m.group(2).strip()
                if len(v) >= 2 and v[0] == v[-1] and v[0] in "\"'":
                    v = v[1:-1]
                out[k] = v
            return out

        def defs_from_colon_lines(text):
            out = {}
            for line in text.splitlines():
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                m = re.match(r"^([A-Za-z_][A-Za-z0-9_]*)\s*:\s*(.+)$", line)
                if not m:
                    continue
                k, v = m.group(1), m.group(2).strip()
                if len(v) >= 2 and v[0] == v[-1] and v[0] in "\"'":
                    v = v[1:-1]
                out[k] = v
            return out

        def flat_str_dict(obj):
            if not isinstance(obj, dict):
                return None
            return {str(k): ("" if v is None else str(v)) for k, v in obj.items()}

        def coerce_obj_to_defs(obj):
            if obj is None:
                return None
            if isinstance(obj, dict):
                return flat_str_dict(obj)
            if isinstance(obj, list):
                for el in obj:
                    d = coerce_obj_to_defs(el)
                    if d:
                        return d
                return None
            if isinstance(obj, str):
                s = obj.strip().lstrip("\ufeff")
                if not s:
                    return None
                try:
                    return coerce_obj_to_defs(json.loads(s))
                except json.JSONDecodeError:
                    pass
                if s.startswith("{") and len(s) < 65536:
                    try:
                        return coerce_obj_to_defs(ast.literal_eval(s))
                    except (ValueError, SyntaxError):
                        pass
                return None
            return None

        def defs_from_json_or_yaml(text):
            blob = text.strip().lstrip("\ufeff")
            try:
                obj = json.loads(blob)
                d = coerce_obj_to_defs(obj)
                if d:
                    return d
            except json.JSONDecodeError:
                pass
            try:
                import yaml  # type: ignore
            except ImportError:
                yaml = None
            if yaml:
                try:
                    obj = yaml.safe_load(blob)
                    d = coerce_obj_to_defs(obj)
                    if d:
                        return d
                except Exception:
                    pass
            return None

        defs = defs_from_kv_lines(raw)
        if not defs:
            defs = defs_from_colon_lines(raw)
        if not defs:
            defs = defs_from_json_or_yaml(raw) or {}
        if not defs:
            blob = raw.strip().lstrip("\ufeff")
            if blob.startswith("{"):
                try:
                    outer = json.loads(blob)
                    inner = None
                    if isinstance(outer, dict):
                        inner = outer.get("payload") or outer.get("secret") or outer.get("values")
                    if isinstance(inner, str) and inner.strip():
                        defs = (
                            defs_from_kv_lines(inner)
                            or defs_from_colon_lines(inner)
                            or defs_from_json_or_yaml(inner)
                            or {}
                        )
                except json.JSONDecodeError:
                    pass
        if not defs:
            sys.stderr.write(
                "broker secret parse: payload not recognized (use KEY=value, KEY: value, JSON object/array, or envelope).\n"
            )
            sys.exit(1)
        api_prefix = (defs.get("BROKER_API_PREFIX") or "/api/broker").strip()
        api_version = (defs.get("BROKER_API_VERSION") or "2.12").strip()
        service_id = (
            defs.get("DEFAULT_BROKER_SERVICE_ID")
            or defs.get("SERVICE_ID")
            or defs.get("CONTENTIQ_BROKER_SERVICE_ID")
            or ""
        ).strip()
        plan_id = (
            defs.get("PRESET_PLAN_ID")
            or defs.get("PLAN_ID")
            or defs.get("CONTENTIQ_RESOURCE_PLAN_ID")
            or ""
        ).strip()
        bearer = (
            defs.get("PRESET_BROKER_BEARER")
            or defs.get("BROKER_BEARER")
            or ""
        ).strip()
        out = {
            "api_prefix": api_prefix,
            "api_version": api_version,
            "service_id": service_id,
            "plan_id": plan_id,
            "bearer": bearer,
        }
        missing = [k for k in ("service_id", "plan_id", "bearer") if not out[k]]
        if missing:
            sys.stderr.write("broker secret parse: missing keys: %s\n" % (", ".join(missing),))
            sys.exit(1)
        print(json.dumps(out, separators=(",", ":")))
        PY
      args:
        executable: /bin/bash
      register: contentiq_ibmsm_broker_osb_parse
      changed_when: false
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"
      when: _ibmsm_broker_fetch_now | bool

