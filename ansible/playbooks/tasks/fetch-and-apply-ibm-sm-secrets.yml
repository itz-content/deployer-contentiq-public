    - name: Materialize registry pull secret from SM (json-stringdata) in each target namespace
      when: contentiq_ibmsm_registry_payload_format | default('json-stringdata') == 'json-stringdata'
      ansible.builtin.shell: |
        set -euo pipefail
        export IBMSM_RAW="{{ contentiq_ibmsm_temp_path }}/registry.payload.raw"
        export IBMSM_OUT="{{ contentiq_ibmsm_temp_path }}/registry.manifest-{{ item | replace('/', '-') }}.json"
        export IBMSM_NAME="{{ contentiq_ibmsm_registry_k8s_secret_name | default(contentiq_pull_secret_name) | default('dockerhub-pull') }}"
        export IBMSM_NS="{{ item }}"
        python3 <<'PY'
        import base64
        import json
        import os
        import re
        import sys

        raw_path = os.environ["IBMSM_RAW"]
        out_path = os.environ["IBMSM_OUT"]
        k8s_name = os.environ["IBMSM_NAME"]
        ns = os.environ["IBMSM_NS"]
        raw = open(raw_path, encoding="utf-8-sig").read().strip()
        if not raw:
            sys.exit("registry SM payload is empty")

        for _unwrap in range(4):
            t = raw.strip()
            if len(t) >= 2 and t[0] == '"' and t[-1] == '"':
                try:
                    inner = json.loads(t)
                    if isinstance(inner, str) and inner.strip():
                        raw = inner.strip()
                        continue
                except json.JSONDecodeError:
                    pass
            break

        def try_registry_env_credentials(blob):
            """Dotenv-style registry creds: .dockerconfigjson / DOCKER_* / REGISTRY_* / contentiq_registry_* (parameters.yml names)."""
            re_colon = re.compile(r"^((?:\.dockerconfigjson|[A-Za-z_][A-Za-z0-9_.-]*))\s*:\s*(.+)$")
            re_equals = re.compile(r"^((?:\.dockerconfigjson|[A-Za-z_][A-Za-z0-9_.-]*))\s*=\s*(.+)$")
            env = {}
            for raw_line in blob.splitlines():
                s = raw_line.strip()
                if not s or s.startswith("#"):
                    continue
                if s.startswith("export "):
                    s = s[7:].lstrip()
                m = re_colon.match(s) or re_equals.match(s)
                if not m:
                    continue
                key, val = m.group(1), m.group(2).strip()
                if len(val) >= 2 and val[0] == val[-1] and val[0] in ('"', "'"):
                    val = val[1:-1]
                env[key] = val
            if not env:
                return None
            for k in (".dockerconfigjson", "DOCKER_CONFIG_JSON", "DOCKER_CONFIG", "PULL_SECRET_JSON"):
                if k not in env:
                    continue
                rawj = env[k].strip()
                try:
                    dc = json.loads(rawj)
                except json.JSONDecodeError:
                    continue
                if isinstance(dc, dict) and "auths" in dc:
                    return {".dockerconfigjson": json.dumps(dc)}, "kubernetes.io/dockerconfigjson"
            user = next(
                (
                    env[k]
                    for k in (
                        "DOCKER_USERNAME",
                        "REGISTRY_USERNAME",
                        "USERNAME",
                        "contentiq_registry_username",
                    )
                    if env.get(k)
                ),
                None,
            )
            pw = next(
                (
                    env[k]
                    for k in (
                        "DOCKER_PASSWORD",
                        "REGISTRY_PASSWORD",
                        "PASSWORD",
                        "contentiq_registry_password",
                    )
                    if env.get(k)
                ),
                None,
            )
            reg = (
                env.get("DOCKER_SERVER")
                or env.get("DOCKER_REGISTRY")
                or env.get("REGISTRY_SERVER")
                or env.get("contentiq_registry_server")
                or "https://index.docker.io/v1/"
            )
            email = env.get("contentiq_registry_email") or env.get("DOCKER_EMAIL") or env.get("REGISTRY_EMAIL")
            if user is not None and pw is not None:
                token = base64.b64encode(("%s:%s" % (user, pw)).encode("utf-8")).decode("ascii")
                entry = {"username": user, "password": pw, "auth": token}
                if email:
                    entry["email"] = email
                dc = {"auths": {reg: entry}}
                return {".dockerconfigjson": json.dumps(dc)}, "kubernetes.io/dockerconfigjson"
            return None

        def tolerant_b64_unwrap(s):
            orig = s.strip().lstrip("\ufeff")
            b = orig.replace("\n", "").replace("\r", "").replace(" ", "")
            if not b:
                return None
            variants = [b, b.translate(str.maketrans("-_", "+/"))]
            seen = set()
            for b0 in variants:
                if not b0 or b0 in seen:
                    continue
                seen.add(b0)
                core = b0.rstrip("=")
                for pad in range(4):
                    try:
                        rawb = base64.b64decode(core + ("=" * pad), validate=False)
                    except Exception:
                        continue
                    if not rawb:
                        continue
                    txt = rawb.decode("utf-8", errors="replace").strip()
                    if not txt:
                        continue
                    try:
                        j = json.loads(txt)
                        if isinstance(j, (dict, list)):
                            return txt
                    except json.JSONDecodeError:
                        pass
                    if txt != orig:
                        return txt
            return None

        def try_registry_base64_dockerconfig(blob):
            """Single blob that is only base64 (no outer '{') encoding a .dockerconfigjson-style JSON."""
            orig = blob.strip().lstrip("\ufeff")
            compact = re.sub(r"\s+", "", orig)
            if len(compact) < 8:
                return None
            if not re.fullmatch(r"[A-Za-z0-9+/=_-]+", compact):
                return None
            for variant in (compact, compact.translate(str.maketrans("-_", "+/"))):
                core = variant.rstrip("=")
                for pad in range(4):
                    try:
                        rawb = base64.b64decode(core + ("=" * pad), validate=False)
                    except Exception:
                        continue
                    if not rawb:
                        continue
                    txt = rawb.decode("utf-8", errors="replace").strip()
                    try:
                        o = json.loads(txt)
                    except json.JSONDecodeError:
                        continue
                    if isinstance(o, dict) and "auths" in o:
                        return {".dockerconfigjson": json.dumps(o)}, "kubernetes.io/dockerconfigjson"
                    if isinstance(o, str) and o.strip():
                        try:
                            o2 = json.loads(o.strip())
                        except json.JSONDecodeError:
                            continue
                        if isinstance(o2, dict) and "auths" in o2:
                            return {".dockerconfigjson": json.dumps(o2)}, "kubernetes.io/dockerconfigjson"
            return None

        def peel_registry_transport_layers(start):
            layers = [start]
            cur = start
            for _ in range(10):
                nxt = tolerant_b64_unwrap(cur)
                if nxt is None or nxt == cur:
                    break
                cur = nxt
                layers.append(cur)
            return layers

        def parse_registry_root(blob, label, b64_hint_var):
            cur = blob.strip().lstrip("\ufeff")
            if not cur:
                sys.exit("registry SM payload is empty")

            def parse_layer(s):
                json_err = None
                try:
                    return json.loads(s), json_err
                except json.JSONDecodeError as e:
                    json_err = e
                try:
                    import yaml

                    y = yaml.safe_load(s)
                    if y is not None:
                        return y, json_err
                except Exception:
                    pass
                return None, json_err

            for _ in range(14):
                data, json_err = parse_layer(cur)
                if data is None:
                    nxt = tolerant_b64_unwrap(cur)
                    if nxt is not None:
                        cur = nxt
                        continue
                    hint = "byte_len=%d" % len(cur)
                    if json_err is not None:
                        hint += " json_error=%s" % (str(json_err).replace("\n", " ")[:220],)
                    sys.exit(
                        "%s is not valid JSON or YAML after decode attempts (%s). "
                        "If this is a dotenv-style registry file (.dockerconfigjson: {...} or DOCKER_USERNAME/PASSWORD), "
                        "it is supported under json-stringdata; otherwise tune contentiq_ibmsm_registry_payload_base64_wrapped "
                        "or use dockerconfigjson/kubernetes-yaml. Hint var: %s"
                        % (label, hint, b64_hint_var)
                    )
                if isinstance(data, str):
                    cur = data.strip()
                    continue
                return data
            sys.exit("%s: too many nested JSON-encoded strings" % label)

        def to_str(v):
            if v is None:
                return ""
            if isinstance(v, (dict, list)):
                return json.dumps(v)
            return str(v)

        def merge_dockerconfig_array(items):
            merged_auths = {}
            for i, el in enumerate(items):
                if isinstance(el, str):
                    try:
                        el = json.loads(el.strip())
                    except json.JSONDecodeError as e:
                        sys.exit("registry array item %d is not valid JSON: %s" % (i, e))
                if not isinstance(el, dict):
                    sys.exit("registry array item %d must be a JSON object" % i)
                if "auths" in el:
                    merged_auths.update(el.get("auths") or {})
                    continue
                if ".dockerconfigjson" in el:
                    inner = el[".dockerconfigjson"]
                    if isinstance(inner, str):
                        inner = json.loads(inner)
                    if isinstance(inner, dict) and "auths" in inner:
                        merged_auths.update(inner.get("auths") or {})
                    continue
                sys.exit(
                    "registry array item %d has no 'auths' or '.dockerconfigjson'." % i
                )
            if not merged_auths:
                sys.exit("registry JSON array produced no merged auths")
            return {".dockerconfigjson": json.dumps({"auths": merged_auths})}

        def dict_to_stringdata_and_type(d):
            if isinstance(d.get("stringData"), dict) and d.get("kind") == "Secret":
                return dict(d["stringData"]), d.get("type") or "Opaque"
            if ".dockerconfigjson" in d:
                v = d[".dockerconfigjson"]
                if isinstance(v, dict):
                    v = json.dumps(v)
                return {".dockerconfigjson": str(v)}, "kubernetes.io/dockerconfigjson"
            if "auths" in d:
                return {".dockerconfigjson": json.dumps(d)}, "kubernetes.io/dockerconfigjson"
            return {k: to_str(v) for k, v in d.items()}, "Opaque"

        def try_registry_json_via_raw_decode(blob):
            """Parse registry JSON: whole-blob first, then first object/array via raw_decode (no PyYAML)."""
            s = blob.strip().lstrip("\ufeff")
            try:
                obj = json.loads(s)
            except json.JSONDecodeError:
                obj = None
            if isinstance(obj, str) and obj.strip():
                try:
                    obj = json.loads(obj.strip())
                except json.JSONDecodeError:
                    obj = None
            if isinstance(obj, dict):
                if (
                    "auths" in obj
                    or ".dockerconfigjson" in obj
                    or (obj.get("kind") == "Secret" and isinstance(obj.get("stringData"), dict))
                ):
                    return dict_to_stringdata_and_type(obj)
            elif isinstance(obj, list) and obj:
                try:
                    sd = merge_dockerconfig_array(obj)
                    return sd, "kubernetes.io/dockerconfigjson"
                except SystemExit:
                    pass
            dec = json.JSONDecoder()
            for i, ch in enumerate(s):
                if ch not in "{[":
                    continue
                try:
                    obj, _end = dec.raw_decode(s[i:])
                except json.JSONDecodeError:
                    continue
                if isinstance(obj, dict):
                    if not (
                        "auths" in obj
                        or ".dockerconfigjson" in obj
                        or (obj.get("kind") == "Secret" and isinstance(obj.get("stringData"), dict))
                    ):
                        continue
                    return dict_to_stringdata_and_type(obj)
                if isinstance(obj, list) and obj:
                    try:
                        sd = merge_dockerconfig_array(obj)
                        return sd, "kubernetes.io/dockerconfigjson"
                    except SystemExit:
                        continue
            return None

        string_data = None
        secret_type = None
        for layer in peel_registry_transport_layers(raw):
            tup = try_registry_json_via_raw_decode(layer)
            if tup is not None:
                string_data, secret_type = tup
                break
            tup = try_registry_env_credentials(layer)
            if tup is not None:
                string_data, secret_type = tup
                break
            tup = try_registry_base64_dockerconfig(layer)
            if tup is not None:
                string_data, secret_type = tup
                break
        if string_data is None:
            root = parse_registry_root(
                raw,
                "registry SM payload",
                "contentiq_ibmsm_registry_payload_base64_wrapped",
            )

            if isinstance(root, list):
                if not root:
                    sys.exit("registry SM payload is an empty array")
                if len(root) == 1 and isinstance(root[0], dict):
                    string_data, secret_type = dict_to_stringdata_and_type(root[0])
                elif all(isinstance(x, dict) and x.get("kind") == "Secret" for x in root):
                    sys.exit(
                        "registry payload is an array of Kubernetes Secrets; use kubernetes-yaml (oc apply List)."
                    )
                else:
                    string_data = merge_dockerconfig_array(root)
                    secret_type = "kubernetes.io/dockerconfigjson"
            elif isinstance(root, dict):
                string_data, secret_type = dict_to_stringdata_and_type(root)
            else:
                sys.exit(
                    "registry SM root must be a JSON/YAML object or array of docker configs, not "
                    + type(root).__name__
                )

        manifest = {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": k8s_name, "namespace": ns},
            "type": secret_type,
            "stringData": string_data,
        }
        with open(out_path, "w", encoding="utf-8") as f:
            json.dump(manifest, f)
        PY
        "{{ contentiq_oc_binary }}" apply -f "${IBMSM_OUT}" -n "${IBMSM_NS}"
      args:
        executable: /bin/bash
      loop: "{{ contentiq_ibmsm_registry_namespaces | default(['openshift-marketplace', 'openshift-operators', contentiq_namespace]) }}"
      register: contentiq_ibmsm_apply_registry_sd
      changed_when: true
      loop_control:
        label: "{{ item }}"
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Materialize registry pull secret from SM (dockerconfigjson) in each target namespace
      when: contentiq_ibmsm_registry_payload_format | default('json-stringdata') == 'dockerconfigjson'
      ansible.builtin.shell: |
        set -euo pipefail
        export IBMSM_RAW="{{ contentiq_ibmsm_temp_path }}/registry.payload.raw"
        export IBMSM_NORM="{{ contentiq_ibmsm_temp_path }}/registry.dockerconfigjson.normalized.json"
        python3 <<'PY'
        import base64
        import json
        import os
        import sys

        raw_path = os.environ["IBMSM_RAW"]
        out_path = os.environ["IBMSM_NORM"]
        raw = open(raw_path, encoding="utf-8-sig").read().strip()
        if not raw:
            sys.exit("registry SM payload is empty")

        def tolerant_b64_unwrap(s):
            orig = s.strip().lstrip("\ufeff")
            b = orig.replace("\n", "").replace("\r", "").replace(" ", "")
            if not b:
                return None
            variants = [b, b.translate(str.maketrans("-_", "+/"))]
            seen = set()
            for b0 in variants:
                if not b0 or b0 in seen:
                    continue
                seen.add(b0)
                core = b0.rstrip("=")
                for pad in range(4):
                    try:
                        rawb = base64.b64decode(core + ("=" * pad), validate=False)
                    except Exception:
                        continue
                    if not rawb:
                        continue
                    txt = rawb.decode("utf-8", errors="replace").strip()
                    if not txt:
                        continue
                    try:
                        j = json.loads(txt)
                        if isinstance(j, (dict, list)):
                            return txt
                    except json.JSONDecodeError:
                        pass
                    if txt != orig:
                        return txt
            return None

        def parse_root(blob):
            cur = blob.strip().lstrip("\ufeff")
            if not cur:
                sys.exit("registry SM payload is empty")

            def parse_layer(s):
                json_err = None
                try:
                    return json.loads(s), json_err
                except json.JSONDecodeError as e:
                    json_err = e
                try:
                    import yaml

                    y = yaml.safe_load(s)
                    if y is not None:
                        return y, json_err
                except Exception:
                    pass
                return None, json_err

            for _ in range(14):
                data, json_err = parse_layer(cur)
                if data is None:
                    nxt = tolerant_b64_unwrap(cur)
                    if nxt is not None:
                        cur = nxt
                        continue
                    hint = "byte_len=%d" % len(cur)
                    if json_err is not None:
                        hint += " json_error=%s" % (str(json_err).replace("\n", " ")[:220],)
                    sys.exit(
                        "registry payload is not valid JSON or YAML for dockerconfigjson (%s)." % hint
                    )
                if isinstance(data, str):
                    cur = data.strip()
                    continue
                return data
            sys.exit("registry payload: too many nested JSON strings")

        def merge_auths_array(items):
            merged = {}
            for i, el in enumerate(items):
                if isinstance(el, str):
                    el = json.loads(el.strip())
                if not isinstance(el, dict):
                    sys.exit("dockerconfigjson array item %d must be an object" % i)
                if "auths" in el:
                    merged.update(el.get("auths") or {})
                elif ".dockerconfigjson" in el:
                    inner = el[".dockerconfigjson"]
                    if isinstance(inner, str):
                        inner = json.loads(inner)
                    merged.update((inner or {}).get("auths") or {})
                else:
                    sys.exit("dockerconfigjson array item %d: need auths or .dockerconfigjson" % i)
            if not merged:
                sys.exit("dockerconfigjson array produced no auths")
            return {"auths": merged}

        def to_dockerconfig_obj(root):
            if isinstance(root, list):
                if len(root) == 1 and isinstance(root[0], dict):
                    root = root[0]
                else:
                    return merge_auths_array(root)
            if not isinstance(root, dict):
                sys.exit("dockerconfigjson root must be object or array")
            if "auths" in root:
                return root
            if ".dockerconfigjson" in root:
                inner = root[".dockerconfigjson"]
                if isinstance(inner, str):
                    inner = json.loads(inner)
                if not isinstance(inner, dict) or "auths" not in inner:
                    sys.exit(".dockerconfigjson must contain auths")
                return inner
            sys.exit("dockerconfigjson object needs auths or .dockerconfigjson")

        root = parse_root(raw)
        obj = to_dockerconfig_obj(root)
        with open(out_path, "w", encoding="utf-8") as f:
            json.dump(obj, f)
        PY
        "{{ contentiq_oc_binary }}" create secret docker-registry "{{ contentiq_ibmsm_registry_k8s_secret_name | default(contentiq_pull_secret_name) | default('dockerhub-pull') }}"
        -n "{{ item }}"
        --from-file=.dockerconfigjson="${IBMSM_NORM}"
        --dry-run=client -o yaml | "{{ contentiq_oc_binary }}" apply -f -
      args:
        executable: /bin/bash
      loop: "{{ contentiq_ibmsm_registry_namespaces | default(['openshift-marketplace', 'openshift-operators', contentiq_namespace]) }}"
      register: contentiq_ibmsm_apply_registry_dcj
      changed_when: true
      loop_control:
        label: "{{ item }}"
      no_log: "{{ _contentiq_ibmsm_no_log_sensitive_tasks | bool }}"

    - name: Skip remaining local secret + pull-secret steps (already applied from IBM SM)
      ansible.builtin.set_fact:
        contentiq_apply_rag_secret: false
        contentiq_manage_pull_secret: false

    - name: Optional rollout restart after IBM SM apply
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - rollout
          - restart
          - "deployment/{{ item }}"
          - "-n"
          - "{{ contentiq_namespace }}"
      loop:
        - contentiq-backend
        - personalization-rag
      when: contentiq_ibmsm_rollout_restart_after_sync | default(false) | bool
      failed_when: false
      changed_when: true

  always:
    - name: Remove temp directory with SM-derived manifests
      ansible.builtin.file:
        path: "{{ contentiq_ibmsm_temp_path }}"
        state: absent
      when: contentiq_ibmsm_temp_path is defined
