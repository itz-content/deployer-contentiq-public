---
# Resolve OAuth redirect URIs for backend secret alignment and provider sync.
# Requires: contentiq_oauth_backend_host (backend Route hostname, no scheme).
# Optional: contentiq_oauth_fixed_callback_base, contentiq_oauth_fixed_google_redirect_uri,
#           contentiq_oauth_fixed_box_redirect_uri, contentiq_oauth_fixed_microsoft_redirect_uri
#           (playbook vars or IBM SM via cluster secret).
# Sets: contentiq_oauth_redirect_uris, contentiq_oauth_google_box_secret_patch

- name: "OAuth URIs: Load fixed-callback overrides from backend secret when unset"
  when:
    - (contentiq_oauth_fixed_callback_base | default('') | trim | length) == 0
    - (contentiq_oauth_fixed_google_redirect_uri | default('') | trim | length) == 0
    - (contentiq_oauth_fixed_box_redirect_uri | default('') | trim | length) == 0
  block:
    - name: "OAuth URIs: Secret keys for fixed callback configuration"
      ansible.builtin.set_fact:
        contentiq_oauth_fixed_config_keys:
          - OAUTH_CALLBACK_PROXY_BASE
          - GOOGLE_REDIRECT_URI
          - BOX_REDIRECT_URI

    - name: "OAuth URIs: Read fixed-callback keys from cluster secret"
      ansible.builtin.command:
        argv:
          - "{{ contentiq_oc_binary }}"
          - get
          - secret
          - contentiq-backend-secrets
          - -n
          - "{{ contentiq_namespace }}"
          - -o
          - "jsonpath={.data.{{ item }}}"
      register: contentiq_oauth_fixed_config_lookup
      loop: "{{ contentiq_oauth_fixed_config_keys }}"
      changed_when: false
      failed_when: false
      no_log: true

    - name: "OAuth URIs: Decode fixed-callback secret values"
      ansible.builtin.set_fact:
        contentiq_oauth_fixed_config_values: "{{ contentiq_oauth_fixed_config_values | default({}) | combine({item.item: _val}) }}"
      vars:
        _raw: "{{ item.stdout | default('') | trim }}"
        _val: "{{ (_raw | b64decode | trim) if (_raw | length > 0) else '' }}"
      loop: "{{ contentiq_oauth_fixed_config_lookup.results }}"
      no_log: true

    - name: "OAuth URIs: Apply fixed-callback values from secret"
      ansible.builtin.set_fact:
        contentiq_oauth_fixed_callback_base: >-
          {{
            (
              contentiq_oauth_fixed_callback_base
              | default(contentiq_oauth_fixed_config_values['OAUTH_CALLBACK_PROXY_BASE'] | default('', true), true)
            ) | trim
          }}
        contentiq_oauth_fixed_google_redirect_uri: >-
          {{
            (
              contentiq_oauth_fixed_google_redirect_uri
              | default(contentiq_oauth_fixed_config_values['GOOGLE_REDIRECT_URI'] | default('', true), true)
            ) | trim
          }}
        contentiq_oauth_fixed_box_redirect_uri: >-
          {{
            (
              contentiq_oauth_fixed_box_redirect_uri
              | default(contentiq_oauth_fixed_config_values['BOX_REDIRECT_URI'] | default('', true), true)
            ) | trim
          }}

- name: "OAuth URIs: Resolve Microsoft, Google, and Box redirect URIs"
  ansible.builtin.set_fact:
    contentiq_oauth_fixed_base_normalized: "{{ contentiq_oauth_fixed_callback_base | default('') | trim | regex_replace('/$', '') }}"
    contentiq_oauth_redirect_uris:
      microsoft: "{{ _microsoft_uri }}"
      google: "{{ _google_uri }}"
      box: "{{ _box_uri }}"
    contentiq_oauth_google_box_secret_patch: "{{ _secret_patch }}"
    contentiq_oauth_use_fixed_google_box_callback: "{{ _use_fixed | bool }}"
    contentiq_oauth_use_fixed_microsoft_callback: "{{ _use_fixed_microsoft | bool }}"
  vars:
    _use_fixed: "{{ (contentiq_oauth_fixed_callback_base | default('') | trim | length) > 0 }}"
    _use_fixed_microsoft: "{{ (contentiq_oauth_fixed_microsoft_redirect_uri | default('') | trim | length) > 0 }}"
    _base: "{{ contentiq_oauth_fixed_callback_base | default('') | trim | regex_replace('/$', '') }}"
    _microsoft_uri: >-
      {{
        (contentiq_oauth_fixed_microsoft_redirect_uri | default('') | trim)
        if (_use_fixed_microsoft | bool)
        else ('https://' ~ contentiq_oauth_backend_host ~ '/api/connections/microsoft/auth/microsoft/callback')
      }}
    _google_uri: >-
      {{
        (contentiq_oauth_fixed_google_redirect_uri | default('') | trim)
        if (_use_fixed | bool and (contentiq_oauth_fixed_google_redirect_uri | default('') | trim | length > 0))
        else (
          (_base ~ '/api/connections/googledrive/auth/google/callback')
          if (_use_fixed | bool)
          else ('https://' ~ contentiq_oauth_backend_host ~ '/api/connections/googledrive/auth/google/callback')
        )
      }}
    _box_uri: >-
      {{
        (contentiq_oauth_fixed_box_redirect_uri | default('') | trim)
        if (_use_fixed | bool and (contentiq_oauth_fixed_box_redirect_uri | default('') | trim | length > 0))
        else (
          (_base ~ '/api/connections/box/auth/box/callback')
          if (_use_fixed | bool)
          else ('https://' ~ contentiq_oauth_backend_host ~ '/api/connections/box/auth/box/callback')
        )
      }}
    _secret_patch: >-
      {{
        {
          'GOOGLE_REDIRECT_URI': _google_uri,
          'BOX_REDIRECT_URI': _box_uri,
          'OAUTH_CALLBACK_BACKEND_ORIGIN': 'https://' ~ contentiq_oauth_backend_host
        }
        | combine(
            {'MICROSOFT_REDIRECT_URI': _microsoft_uri}
            if (_use_fixed_microsoft | bool)
            else {}
          )
        | combine(
            {'OAUTH_CALLBACK_PROXY_BASE': _base}
            if (_use_fixed | bool)
            else {}
          )
      }}
