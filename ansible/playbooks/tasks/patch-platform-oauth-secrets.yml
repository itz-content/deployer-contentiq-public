---
# Merge platform Google/Box app credentials from backend-secrets-template.yaml into the live
# contentiq-backend-secrets Secret (IBM SM path). Redirect URIs are set separately via
# resolve-oauth-redirect-uris.yml + route alignment (Step 6b).
#
# Requires: contentiq_backend_secret_manifest, contentiq_namespace, contentiq_oc_binary
# Optional: contentiq_platform_oauth_template_keys (list of stringData keys to copy)

- name: "Platform OAuth: Parse backend secrets template"
  ansible.builtin.set_fact:
    contentiq_backend_template_parsed: "{{ lookup('file', contentiq_backend_secret_manifest) | from_yaml }}"
  no_log: true

- name: "Platform OAuth: Build credential overlay from template stringData"
  ansible.builtin.set_fact:
    contentiq_platform_oauth_overlay_stringdata: >-
      {{
        contentiq_platform_oauth_overlay_stringdata | default({})
        | combine({item: contentiq_backend_template_parsed.stringData[item]})
      }}
  loop: "{{ contentiq_platform_oauth_template_keys }}"
  when:
    - contentiq_backend_template_parsed.stringData is defined
    - item in (contentiq_backend_template_parsed.stringData | default({}))
    - contentiq_backend_template_parsed.stringData[item] | default('') | trim | length > 0
  no_log: true

- name: "Platform OAuth: Skip merge when template produced no credential keys"
  ansible.builtin.debug:
    msg: >-
      No platform OAuth credentials found in {{ contentiq_backend_secret_manifest }}
      (keys: {{ contentiq_platform_oauth_template_keys | join(', ') }}). Skipping overlay.
  when: contentiq_platform_oauth_overlay_stringdata | default({}) | length == 0

- name: "Platform OAuth: Merge template credentials into contentiq-backend-secrets"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - patch
      - secret
      - contentiq-backend-secrets
      - -n
      - "{{ contentiq_namespace }}"
      - --type=merge
      - -p
      - "{{ {'stringData': contentiq_platform_oauth_overlay_stringdata} | to_json }}"
  register: contentiq_platform_oauth_secret_patch
  changed_when: true
  when: contentiq_platform_oauth_overlay_stringdata | default({}) | length > 0
  no_log: true
