---
# Load contentiq-broker-secrets from IBM SM after Routes exist (Step 9), when Step 1b deferred broker fetch.
# Requires contentiq_ibmsm_access_token and _ibmsm_ep from Step 1b (fetch-and-apply-ibm-sm-secrets.yml).
#
# GET + parse run in ONE shell so IBM SM JSON is never passed between Ansible tasks under no_log (which can
# strip registered stdout and leave the parser with an empty stdin / len=0 JSON error).

- name: Assert IBM SM session facts exist for deferred broker fetch
  ansible.builtin.assert:
    that:
      - contentiq_ibmsm_access_token is defined
      - (contentiq_ibmsm_access_token | default('') | trim | length) > 0
      - _ibmsm_ep is defined
      - (_ibmsm_ep | default('') | trim | length) > 0
    fail_msg: >-
      Deferred broker fetch needs Step 1b (Ansible IBM SM sync) to have obtained an IAM token and endpoint.
      Use contentiq_ibmsm_sync_engine: ansible, or set contentiq_ibmsm_defer_broker_sm_fetch_until_osb: false
      to fetch the broker secret during Step 1b instead.

- name: GET and parse broker OSB secret from IBM SM (deferred, single shell)
  block:
    - name: GET and parse broker OSB secret from IBM SM (deferred, single shell)
      ansible.builtin.shell: |
        set -euo pipefail
        TMPFILE="$(mktemp)"
        trap 'rm -f "${TMPFILE}"' EXIT
        if [[ "${IBMSM_TLS_VERIFY:-1}" == "0" ]]; then EXTRA=( -k ); else EXTRA=(); fi
        curl -fsS "${EXTRA[@]}" -X GET "${SM_URL}" \
          -H "Authorization: Bearer ${IBM_IAM_TOKEN}" \
          -H "Accept: application/json" \
          -o "${TMPFILE}"
        python3 - "${TMPFILE}" <<'PY'
        import ast
        import base64
        import json
        import os
        import re
        import sys

        path = sys.argv[1]
        with open(path, "r", encoding="utf-8", errors="replace") as f:
            raw_in = f.read()

        def debug_shape(j, label, p=None):
            if os.environ.get("BROKER_SM_DEBUG_SHAPE", "0").strip().lower() not in ("1", "true", "yes", "on"):
                return
            d = j.get("data") or {}
            if p is None:
                p = d.get("payload", j.get("payload"))
                if p is None and isinstance(d.get("secret_data"), dict):
                    p = d["secret_data"].get("payload")
            pt = type(p).__name__
            plen = len(p) if isinstance(p, str) else (len(json.dumps(p)) if p is not None else 0)
            sys.stderr.write(
                "%s: top_keys=%s data_keys=%s payload_present=%s payload_type=%s payload_len=%s\n"
                % (
                    label,
                    sorted(j.keys()),
                    sorted(d.keys()) if isinstance(d, dict) else [],
                    p is not None,
                    pt,
                    plen,
                )
            )

        b64wrap = os.environ.get("BWRAP", "0") == "1"
        try:
            j = json.loads(raw_in)
        except json.JSONDecodeError as e:
            sys.stderr.write(
                "broker SM GET response is not JSON (len=%s): %s\n"
                "Check IAM access, secret id, and that curl returned the secret document (not an HTML error page).\n"
                % (len(raw_in), e)
            )
            sys.exit(1)

        debug_shape(j, "BROKER_SM_SHAPE", None)

        d = j.get("data") or {}
        p = d.get("payload", j.get("payload"))
        if p is None and isinstance(d.get("secret_data"), dict):
            p = d["secret_data"].get("payload")
        if p is None:
            sys.stderr.write("broker SM JSON missing payload; top keys: %s\n" % (sorted(j.keys()),))
            sys.exit(1)
        if not isinstance(p, str):
            p = json.dumps(p)
        raw = p.strip().lstrip("\ufeff")
        if b64wrap:
            b = raw.replace("\n", "").replace("\r", "").replace(" ", "")
            pad = (-len(b)) % 4
            raw = base64.b64decode(b + ("=" * pad), validate=False).decode("utf-8", errors="replace").strip().lstrip("\ufeff")
        if not raw:
            sys.stderr.write(
                "broker SM payload is empty after unwrap.\n"
                "If the secret is stored base64-wrapped in SM, set contentiq_ibmsm_broker_payload_base64_wrapped: true.\n"
            )
            sys.exit(1)

        def defs_from_kv_lines(text):
            out = {}
            for line in text.splitlines():
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                m = re.match(r"^(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$", line)
                if not m:
                    continue
                k, v = m.group(1), m.group(2).strip()
                if len(v) >= 2 and v[0] == v[-1] and v[0] in "\"'":
                    v = v[1:-1]
                out[k] = v
            return out

        def defs_from_colon_lines(text):
            out = {}
            for line in text.splitlines():
                line = line.strip()
                if not line or line.startswith("#"):
                    continue
                m = re.match(r"^([A-Za-z_][A-Za-z0-9_]*)\s*:\s*(.+)$", line)
                if not m:
                    continue
                k, v = m.group(1), m.group(2).strip()
                if len(v) >= 2 and v[0] == v[-1] and v[0] in "\"'":
                    v = v[1:-1]
                out[k] = v
            return out

        def flat_str_dict(obj):
            if not isinstance(obj, dict):
                return None
            return {str(k): ("" if v is None else str(v)) for k, v in obj.items()}

        def coerce_obj_to_defs(obj):
            if obj is None:
                return None
            if isinstance(obj, dict):
                return flat_str_dict(obj)
            if isinstance(obj, list):
                for el in obj:
                    d = coerce_obj_to_defs(el)
                    if d:
                        return d
                return None
            if isinstance(obj, str):
                s = obj.strip().lstrip("\ufeff")
                if not s:
                    return None
                try:
                    return coerce_obj_to_defs(json.loads(s))
                except json.JSONDecodeError:
                    pass
                if s.startswith("{") and len(s) < 65536:
                    try:
                        return coerce_obj_to_defs(ast.literal_eval(s))
                    except (ValueError, SyntaxError):
                        pass
                return None
            return None

        def defs_from_json_or_yaml(text):
            blob = text.strip().lstrip("\ufeff")
            if not blob:
                return None, ""
            err = ""
            try:
                obj = json.loads(blob)
                d = coerce_obj_to_defs(obj)
                if d:
                    return d, ""
            except json.JSONDecodeError as e:
                err = str(e)
            try:
                import yaml  # type: ignore
            except ImportError:
                yaml = None
            if yaml:
                try:
                    obj = yaml.safe_load(blob)
                    d = coerce_obj_to_defs(obj)
                    if d:
                        return d, err
                except Exception as e:
                    err = err or str(e)
            return None, err

        defs = defs_from_kv_lines(raw)
        payload_format = "kv"
        if not defs:
            defs = defs_from_colon_lines(raw)
            if defs:
                payload_format = "colon"
        if not defs:
            defs, _json_err_unused = defs_from_json_or_yaml(raw)
            if defs:
                payload_format = "json"
        if not defs:
            blob = raw.strip().lstrip("\ufeff")
            if blob.startswith("{"):
                try:
                    outer = json.loads(blob)
                    inner = None
                    if isinstance(outer, dict):
                        inner = outer.get("payload") or outer.get("secret") or outer.get("values")
                    if isinstance(inner, str) and inner.strip():
                        defs = (
                            defs_from_kv_lines(inner)
                            or defs_from_colon_lines(inner)
                            or defs_from_json_or_yaml(inner)[0]
                            or {}
                        )
                        if defs:
                            payload_format = "json-envelope"
                except json.JSONDecodeError:
                    pass
        if os.environ.get("BROKER_SM_DEBUG_SHAPE", "0").strip().lower() in ("1", "true", "yes", "on"):
            sys.stderr.write(
                "BROKER_SM_SHAPE: payload_text_lines=%s payload_format=%s parsed_assignment_names=%s\n"
                % (
                    len(raw.splitlines()),
                    payload_format,
                    ", ".join(sorted(defs.keys())) or "(none)",
                )
            )
        if not defs and raw:
            je = ""
            try:
                json.loads(raw.strip().lstrip("\ufeff"))
            except json.JSONDecodeError as e:
                je = str(e)
            sys.stderr.write(
                "broker deferred parse: could not read broker assignments from payload (len=%s).\n"
                "Supported: KEY=value lines, KEY: value lines, JSON object or JSON array of object, "
                "or JSON envelope {\"payload\": \"...\"} / {\"secret\": \"...\"} with inner text or JSON.\n"
                % (len(raw),)
            )
            if je:
                sys.stderr.write("json.loads diagnostic on raw payload: %s\n" % (je,))
            sys.exit(1)
        api_prefix = (defs.get("BROKER_API_PREFIX") or "/api/broker").strip()
        api_version = (defs.get("BROKER_API_VERSION") or "2.12").strip()
        service_id = (
            defs.get("DEFAULT_BROKER_SERVICE_ID")
            or defs.get("SERVICE_ID")
            or defs.get("CONTENTIQ_BROKER_SERVICE_ID")
            or ""
        ).strip()
        plan_id = (
            defs.get("PRESET_PLAN_ID")
            or defs.get("PLAN_ID")
            or defs.get("CONTENTIQ_RESOURCE_PLAN_ID")
            or ""
        ).strip()
        bearer = (
            defs.get("PRESET_BROKER_BEARER")
            or defs.get("BROKER_BEARER")
            or ""
        ).strip()
        out = {
            "api_prefix": api_prefix,
            "api_version": api_version,
            "service_id": service_id,
            "plan_id": plan_id,
            "bearer": bearer,
        }
        missing = [k for k in ("service_id", "plan_id", "bearer") if not out[k]]
        if missing:
            sys.stderr.write(
                "broker deferred parse: missing or empty after mapping: %s\n"
                "Assignment names seen in payload (values not shown): %s\n"
                % (", ".join(missing), ", ".join(sorted(defs.keys())) or "(none)")
            )
            sys.exit(1)
        print(json.dumps(out, separators=(",", ":")))
        PY
      environment:
        IBM_IAM_TOKEN: "{{ contentiq_ibmsm_access_token }}"
        SM_URL: "{{ _ibmsm_ep }}/api/v2/secrets/{{ contentiq_ibmsm_broker_secret_id | trim }}"
        IBMSM_TLS_VERIFY: "{{ '0' if not (contentiq_ibmsm_tls_validate | default(true) | bool) else '1' }}"
        BWRAP: "{{ '1' if (contentiq_ibmsm_broker_payload_base64_wrapped | default(false) | bool) else '0' }}"
        BROKER_SM_DEBUG_SHAPE: >-
          {{
            '1'
            if (
              (contentiq_ibmsm_apply_show_logs | default(false) | bool)
              or (contentiq_ibmsm_registry_apply_show_logs | default(false) | bool)
            )
            else '0'
          }}
      register: contentiq_ibmsm_broker_deferred_parse
      changed_when: false
      no_log: >-
        {{
          not (
            (contentiq_ibmsm_apply_show_logs | default(false) | bool)
            or (contentiq_ibmsm_registry_apply_show_logs | default(false) | bool)
          )
        }}

    - name: Record contentiq_broker_osb from deferred IBM SM fetch
      ansible.builtin.set_fact:
        contentiq_broker_osb: "{{ contentiq_ibmsm_broker_deferred_parse.stdout | from_json }}"
      no_log: >-
        {{
          not (
            (contentiq_ibmsm_apply_show_logs | default(false) | bool)
            or (contentiq_ibmsm_registry_apply_show_logs | default(false) | bool)
          )
        }}

  rescue:
    - name: Report deferred broker SM failure (stderr from failed task; no secret values)
      ansible.builtin.fail:
        msg:
          - >-
            Deferred broker IBM SM step failed on task
            {{ ansible_failed_task.name | default('unknown') | quote }}.
          - "Return code: {{ ansible_failed_result.rc | default('n/a') }}"
          - >-
            stderr (parser or curl):
            {{ ansible_failed_result.stderr | default('') | trim }}
          - >-
            If stderr is empty, see module msg (truncated):
            {{ ansible_failed_result.msg | default('') | trim | truncate(400, True, '…') }}
          - >-
            Typical fixes: (1) GET+parse run in one shell — if you previously saw empty JSON (len=0), that was
            Ansible no_log hiding GET stdout between tasks; re-run with this playbook version.
          - >-
            (2) Ensure SM arbitrary secret payload is either KEY=value lines or a JSON object with non-empty
            DEFAULT_BROKER_SERVICE_ID, PRESET_PLAN_ID, PRESET_BROKER_BEARER (or BROKER_BEARER).
          - >-
            (3) Match contentiq_ibmsm_broker_payload_base64_wrapped to how the payload is stored in SM.
          - >-
            (4) To print redacted BROKER_SM_SHAPE lines (JSON keys, payload type/len, KEY names only) to the log,
            run once with contentiq_ibmsm_apply_show_logs: true (disables no_log for SM tasks; may expose secrets elsewhere).
