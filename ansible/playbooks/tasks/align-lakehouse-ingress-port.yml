---
# Align lakehouse backend secret for in-cluster edge-gateway:
#   LAKEHOUSE_INGRESS_PORT  — from edge-gateway Service port (default 8080)
#   LAKEHOUSE_INGRESS_HOST  — edge-gateway (IBM SM may carry a stale external IP)
#   LAKEHOUSE_SERVICE_TOKEN — from lakekeeper-auth-tokens when present
# Without this, playground "Analyzing data sources" may hang/time out (ERR_INCOMPLETE_CHUNKED_ENCODING).
# contentiq_align_lakehouse_restart_backend: restart when secret changes (false if a later task restarts backend).

- name: "Lakehouse align: Detect edge-gateway Service"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - svc
      - "{{ contentiq_lakehouse_ingress_service_name }}"
      - -n
      - "{{ contentiq_namespace }}"
  register: contentiq_lakehouse_svc_get
  changed_when: false
  failed_when: false

- name: "Lakehouse align: Read edge-gateway Service port"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - svc
      - "{{ contentiq_lakehouse_ingress_service_name }}"
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - jsonpath={.spec.ports[0].port}
  register: contentiq_lakehouse_svc_port
  changed_when: false
  when: contentiq_lakehouse_svc_get.rc == 0

- name: "Lakehouse align: Read LAKEHOUSE_INGRESS_PORT from backend secret"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - secret
      - contentiq-backend-secrets
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - jsonpath={.data.LAKEHOUSE_INGRESS_PORT}
  register: contentiq_lakehouse_secret_port_b64
  changed_when: false
  failed_when: false
  when: contentiq_lakehouse_svc_get.rc == 0

- name: "Lakehouse align: Decode current LAKEHOUSE_INGRESS_PORT"
  ansible.builtin.set_fact:
    contentiq_lakehouse_secret_port_current: >-
      {{
        (contentiq_lakehouse_secret_port_b64.stdout | trim | b64decode)
        if (contentiq_lakehouse_secret_port_b64.stdout | default('') | trim | length) > 0
        else ''
      }}
  when: contentiq_lakehouse_svc_get.rc == 0

- name: "Lakehouse align: Read LAKEHOUSE_INGRESS_HOST from backend secret"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - secret
      - contentiq-backend-secrets
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - jsonpath={.data.LAKEHOUSE_INGRESS_HOST}
  register: contentiq_lakehouse_secret_host_b64
  changed_when: false
  failed_when: false
  when: contentiq_lakehouse_svc_get.rc == 0

- name: "Lakehouse align: Decode current LAKEHOUSE_INGRESS_HOST"
  ansible.builtin.set_fact:
    contentiq_lakehouse_secret_host_current: >-
      {{
        (contentiq_lakehouse_secret_host_b64.stdout | trim | b64decode)
        if (contentiq_lakehouse_secret_host_b64.stdout | default('') | trim | length) > 0
        else ''
      }}
  when: contentiq_lakehouse_svc_get.rc == 0

- name: "Lakehouse align: Read lakekeeper SERVICE_TOKEN when auth secret exists"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - secret
      - lakekeeper-auth-tokens
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - jsonpath={.data.SERVICE_TOKEN}
  register: contentiq_lakehouse_auth_token_b64
  changed_when: false
  failed_when: false
  when: contentiq_lakehouse_svc_get.rc == 0

- name: "Lakehouse align: Read LAKEHOUSE_SERVICE_TOKEN from backend secret"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - secret
      - contentiq-backend-secrets
      - -n
      - "{{ contentiq_namespace }}"
      - -o
      - jsonpath={.data.LAKEHOUSE_SERVICE_TOKEN}
  register: contentiq_lakehouse_backend_token_b64
  changed_when: false
  failed_when: false
  when: contentiq_lakehouse_svc_get.rc == 0

- name: "Lakehouse align: Decode lakehouse token values"
  ansible.builtin.set_fact:
    contentiq_lakehouse_auth_token_expected: >-
      {{
        (contentiq_lakehouse_auth_token_b64.stdout | trim | b64decode)
        if (contentiq_lakehouse_auth_token_b64.stdout | default('') | trim | length) > 0
        else ''
      }}
    contentiq_lakehouse_backend_token_current: >-
      {{
        (contentiq_lakehouse_backend_token_b64.stdout | trim | b64decode)
        if (contentiq_lakehouse_backend_token_b64.stdout | default('') | trim | length) > 0
        else ''
      }}
  when: contentiq_lakehouse_svc_get.rc == 0

- name: "Lakehouse align: Determine if backend secret patch is needed"
  ansible.builtin.set_fact:
    contentiq_lakehouse_port_needs_patch: >-
      {{
        (contentiq_lakehouse_secret_port_current | default('') | trim)
        != (contentiq_lakehouse_svc_port.stdout | trim)
      }}
    contentiq_lakehouse_host_needs_patch: >-
      {{
        (contentiq_lakehouse_secret_host_current | default('') | trim)
        != (contentiq_lakehouse_ingress_service_name | trim)
      }}
    contentiq_lakehouse_token_needs_patch: >-
      {{
        (contentiq_lakehouse_auth_token_expected | default('') | trim | length) > 0
        and (contentiq_lakehouse_backend_token_current | default('') | trim)
        != (contentiq_lakehouse_auth_token_expected | trim)
      }}
    contentiq_lakehouse_secret_needs_patch: >-
      {{
        (contentiq_lakehouse_secret_port_current | default('') | trim)
        != (contentiq_lakehouse_svc_port.stdout | trim)
        or (contentiq_lakehouse_secret_host_current | default('') | trim)
        != (contentiq_lakehouse_ingress_service_name | trim)
        or (
          (contentiq_lakehouse_auth_token_expected | default('') | trim | length) > 0
          and (contentiq_lakehouse_backend_token_current | default('') | trim)
          != (contentiq_lakehouse_auth_token_expected | trim)
        )
      }}
  when: contentiq_lakehouse_svc_get.rc == 0

- name: "Lakehouse align: Merge-patch lakehouse keys when missing or wrong"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - patch
      - secret
      - contentiq-backend-secrets
      - -n
      - "{{ contentiq_namespace }}"
      - --type=merge
      - -p
      - "{{ contentiq_lakehouse_secret_patch_body | to_json }}"
  vars:
    contentiq_lakehouse_secret_patch_body:
      stringData: >-
        {{
          {
            'LAKEHOUSE_INGRESS_PORT': (contentiq_lakehouse_svc_port.stdout | trim | string),
            'LAKEHOUSE_INGRESS_HOST': (contentiq_lakehouse_ingress_service_name | trim),
          }
          | combine(
              {'LAKEHOUSE_SERVICE_TOKEN': (contentiq_lakehouse_auth_token_expected | trim)}
              if (contentiq_lakehouse_auth_token_expected | default('') | trim | length) > 0
              else {}
            )
        }}
  register: contentiq_lakehouse_secret_patch
  changed_when: true
  no_log: true
  when:
    - contentiq_lakehouse_svc_get.rc == 0
    - contentiq_lakehouse_secret_needs_patch | bool

- name: "Lakehouse align: Ensure backend deployment progress deadline before restart"
  ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/roles/contentiq_install/tasks/patch_deployment_min_progress_deadline.yml"
  vars:
    patch_dep_name: contentiq-backend
    patch_dep_namespace: "{{ contentiq_namespace }}"
  when:
    - contentiq_lakehouse_svc_get.rc == 0
    - contentiq_lakehouse_secret_needs_patch | bool
    - contentiq_align_lakehouse_restart_backend | bool
    - contentiq_align_lakehouse_wait_rollout | bool

- name: "Lakehouse align: Restart backend to pick up lakehouse secret changes"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - rollout
      - restart
      - deployment/contentiq-backend
      - -n
      - "{{ contentiq_namespace }}"
  register: contentiq_lakehouse_backend_restart
  changed_when: "'restarted' in contentiq_lakehouse_backend_restart.stdout | default('')"
  when:
    - contentiq_lakehouse_svc_get.rc == 0
    - contentiq_lakehouse_secret_needs_patch | bool
    - contentiq_align_lakehouse_restart_backend | bool

- name: "Lakehouse align: Wait for backend rollout after lakehouse secret patch"
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - rollout
      - status
      - deployment/contentiq-backend
      - -n
      - "{{ contentiq_namespace }}"
      - "--timeout={{ contentiq_rollout_timeout_seconds }}s"
  changed_when: false
  when:
    - contentiq_lakehouse_svc_get.rc == 0
    - contentiq_lakehouse_secret_needs_patch | bool
    - contentiq_align_lakehouse_restart_backend | bool
    - contentiq_align_lakehouse_wait_rollout | bool

- name: "Lakehouse align: edge-gateway Service not present (skip)"
  ansible.builtin.debug:
    msg: >-
      Skipped LAKEHOUSE_INGRESS_PORT: Service {{ contentiq_lakehouse_ingress_service_name }} not found
      in {{ contentiq_namespace }} (structured data may be deferred or not deployed).
  when: contentiq_lakehouse_svc_get.rc != 0

- name: "Lakehouse align: backend secret already correct"
  ansible.builtin.debug:
    msg: >-
      LAKEHOUSE_INGRESS_HOST={{ contentiq_lakehouse_secret_host_current | trim }},
      LAKEHOUSE_INGRESS_PORT={{ contentiq_lakehouse_secret_port_current | trim }},
      token aligned={{ not (contentiq_lakehouse_token_needs_patch | default(false) | bool) }} (no patch).
  when:
    - contentiq_lakehouse_svc_get.rc == 0
    - not (contentiq_lakehouse_secret_needs_patch | bool)

- name: "Lakehouse align: Patched lakehouse backend secret"
  ansible.builtin.debug:
    msg: >-
      Set LAKEHOUSE_INGRESS_HOST={{ contentiq_lakehouse_ingress_service_name }},
      LAKEHOUSE_INGRESS_PORT={{ contentiq_lakehouse_svc_port.stdout | trim }},
      token_sync={{ contentiq_lakehouse_token_needs_patch | default(false) | bool }}.
  when:
    - contentiq_lakehouse_svc_get.rc == 0
    - contentiq_lakehouse_secret_needs_patch | bool
