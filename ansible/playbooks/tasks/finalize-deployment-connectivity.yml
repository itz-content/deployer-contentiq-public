---
# One-shot post-rollout connectivity: HAProxy timeouts, backend CORS/URLs, frontend /env.json, verification.
# Run after core (and ideally structured-data) operands are Ready so operator reconcile does not undo alignment.

- name: "Finalize: Annotate Route HAProxy timeouts (first pass)"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/annotate-route-timeouts.yml"
  when: contentiq_annotate_route_timeouts | bool

- name: "Finalize: Align LAKEHOUSE_INGRESS_PORT from edge-gateway Service (patch only; backend restarts below)"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/align-lakehouse-ingress-port.yml"
  vars:
    contentiq_align_lakehouse_restart_backend: false
    contentiq_align_lakehouse_wait_rollout: false
  when: contentiq_align_lakehouse_ingress_port | bool

- name: "Finalize: Bootstrap Lakekeeper (accept-terms-of-use; idempotent)"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/bootstrap-lakekeeper.yml"
  when:
    - contentiq_bootstrap_lakekeeper | default(true) | bool
    - not (contentiq_defer_phase2_and_structured_poststeps | default(false) | bool)

- name: "Finalize: Align backend secret to live Routes (restart + wait)"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/patch-backend-secret-to-live-routes.yml"
  vars:
    contentiq_align_backend_restart_after_patch: true
    contentiq_align_backend_wait_rollout_after_patch: "{{ contentiq_step6b_wait_backend_rollout_after_align | bool }}"
  when: contentiq_align_backend_secret_to_live_routes | bool

- name: "Finalize: Register OAuth redirect URIs with external providers (Azure Graph)"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/sync-oauth-provider-redirect-uris.yml"
  when: (contentiq_sync_oauth_redirect_uris_to_providers | default('auto') | string | lower) != 'false'

- name: "Finalize: Ensure frontend-host /api path Route (before same-origin apiBaseUrl)"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/ensure-frontend-api-path-route.yml"
  when: contentiq_ensure_frontend_api_path_route | default(true) | bool

- name: "Finalize: Align frontend /env.json and playground stream timeout"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/align-frontend-runtime-config.yml"
  when: contentiq_align_frontend_runtime_config | bool

- name: "Finalize: Re-annotate Route HAProxy timeouts (after rollouts; operator may reset Routes)"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/annotate-route-timeouts.yml"
  when: contentiq_annotate_route_timeouts | bool

- name: "Finalize: Assert app Route HAProxy timeouts"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/assert-route-timeouts.yml"
  when:
    - contentiq_annotate_route_timeouts | bool
    - contentiq_assert_route_timeouts | bool

- name: "Finalize: Verify /env.json, CORS, and optional edge-gateway"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/verify-deployment-connectivity.yml"
  vars:
    contentiq_verify_env_json_and_cors: true
  when: contentiq_verify_deploy_connectivity | bool

- name: "Finalize: Deployment connectivity complete"
  ansible.builtin.debug:
    msg:
      - "Routes, backend secret, frontend /env.json, frontend /api path Route, and HAProxy timeouts are aligned."
      - "Open the UI at https://<frontend-route-host> (not the backend route host)."
      - "Hard-refresh the browser after deploy if you had an old session open."
  when: contentiq_finalize_connectivity_after_deploy | bool
