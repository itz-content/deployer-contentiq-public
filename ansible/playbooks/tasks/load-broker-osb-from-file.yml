---
# Parse broker OSB settings from a local file (same KEY=value format as IBM SM broker arbitrary secret).
# Sets fact contentiq_broker_osb for Step 9 (osb-provision-bind-contentiq.yml) when SM did not supply it.
#
# Required extra var: contentiq_broker_assignments_file (absolute or playbook-relative path).

- name: Assert broker assignments file path is set
  ansible.builtin.assert:
    that:
      - contentiq_broker_assignments_file | default('') | trim | length > 0
    fail_msg: >-
      load-broker-osb-from-file requires contentiq_broker_assignments_file (e.g. ansible/broker.yml).

- name: Stat broker assignments file
  ansible.builtin.stat:
    path: "{{ contentiq_broker_assignments_file | trim }}"
  register: contentiq_broker_file_stat

- name: Assert broker assignments file exists and is a regular file
  ansible.builtin.assert:
    that:
      - contentiq_broker_file_stat.stat.exists | bool
      - contentiq_broker_file_stat.stat.isreg | bool
    fail_msg: >-
      Broker assignments file not found or not a regular file: {{ contentiq_broker_assignments_file | trim }}

- name: Read broker assignments file for parsing
  ansible.builtin.slurp:
    src: "{{ contentiq_broker_assignments_file | trim }}"
  register: contentiq_broker_file_slurp
  no_log: true

- name: Parse broker OSB settings from file body
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PY'
    import json
    import os
    import re
    import sys

    raw = os.environ.get("BROKER_RAW", "").strip()
    if not raw:
        sys.stderr.write("broker file body is empty\n")
        sys.exit(1)
    defs = {}
    for line in raw.splitlines():
        line = line.strip()
        if not line or line.startswith("#"):
            continue
        m = re.match(r"^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$", line)
        if not m:
            continue
        k, v = m.group(1), m.group(2).strip()
        if len(v) >= 2 and v[0] == v[-1] and v[0] in "\"'":
            v = v[1:-1]
        defs[k] = v
    api_prefix = (defs.get("BROKER_API_PREFIX") or "/api/broker").strip()
    api_version = (defs.get("BROKER_API_VERSION") or "2.12").strip()
    service_id = (
        defs.get("DEFAULT_BROKER_SERVICE_ID")
        or defs.get("SERVICE_ID")
        or defs.get("CONTENTIQ_BROKER_SERVICE_ID")
        or ""
    ).strip()
    plan_id = (
        defs.get("PRESET_PLAN_ID")
        or defs.get("PLAN_ID")
        or defs.get("CONTENTIQ_RESOURCE_PLAN_ID")
        or ""
    ).strip()
    bearer = (defs.get("PRESET_BROKER_BEARER") or defs.get("BROKER_BEARER") or "").strip()
    out = {
        "api_prefix": api_prefix,
        "api_version": api_version,
        "service_id": service_id,
        "plan_id": plan_id,
        "bearer": bearer,
    }
    missing = [k for k in ("service_id", "plan_id", "bearer") if not out[k]]
    if missing:
        sys.stderr.write("broker file parse: missing keys: %s\n" % (", ".join(missing),))
        sys.exit(1)
    print(json.dumps(out, separators=(",", ":")))
    PY
  environment:
    BROKER_RAW: "{{ contentiq_broker_file_slurp.content | b64decode }}"
  register: contentiq_broker_file_parse
  changed_when: false
  no_log: true

- name: Record contentiq_broker_osb from local broker file
  ansible.builtin.set_fact:
    contentiq_broker_osb: "{{ contentiq_broker_file_parse.stdout | from_json }}"
  no_log: true
