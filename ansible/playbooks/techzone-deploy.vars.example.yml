---
# TechZone / deployer custom_values — Ansible parameters file (no secrets).
#
# In TechZone Terraform overrides → custom_values, reference this file from the release tag:
#
#   {
#     "deployer": {
#       "public": true,
#       "repoName": "deployer-contentiq-public",
#       "release": "contentiq-1.0.0-ansible",
#       "parameters": "ansible/playbooks/techzone-deploy.vars.example.yml",
#       "ansible": {
#         "ansiblePlaybook": "ansible/playbooks/deploy.yml"
#       }
#     }
#   }
#
# Or pass the same keys via Terraform override post_deploy_override_variables (JSON string).
#
# IBM Secrets Manager (default TechZone path): Step 1b syncs backend/RAG/registry from SM.
# API key: kube-system/ibm-secret when IBM_CLOUD_API_KEY is unset (see deploy.yml).
# SM UUIDs / payload formats: same as playbooks/ibm-sm-deploy.vars.example.yml and tekton/.env.sm.example.
# Symplistic operators refresh SM from templates: ./scripts/push-ibm-sm-secrets.sh
# Verify: ./playbooks/scripts/compare-ibm-sm-to-local-templates.sh

contentiq_fetch_secrets_from_ibm_sm: true
contentiq_manage_pull_secret: false

# OAuth: auto-register each reservation's Microsoft callback in Azure when AZURE_GRAPH_* are in IBM SM.
# contentiq_sync_oauth_redirect_uris_to_providers: auto

# Google/Box: fixed platform OAuth callback (defaults also in deploy.yml).
# Platform creds (BOX_*, GOOGLE_*, AZURE_GRAPH_*) live in the backend SM secret.
# Per deploy: Step 1b pulls SM; Step 6b patches fixed redirects, enables dynamic OAuth,
# ensures OAUTH_CALLBACK_STATE_SECRET (cluster → template fallback), and sets
# OAUTH_CALLBACK_BACKEND_ORIGIN from the reservation's live contentiq-backend Route.
contentiq_oauth_fixed_callback_base: "https://oauth.contentiq.symplistic.ai"
# contentiq_oauth_fixed_google_redirect_uri: ""
# contentiq_oauth_fixed_box_redirect_uri: ""
# contentiq_oauth_callback_state_secret: ""   # optional; else cluster secret or backend template
# contentiq_oauth_state_ttl_seconds: "1800"
# Optional POC: fixed Microsoft callback; register this URI once in Azure and set
# OAUTH_CALLBACK_STATE_SECRET in the backend and callback proxy to the same value.
# contentiq_oauth_fixed_microsoft_redirect_uri: "https://oauth.contentiq.symplistic.ai/api/connections/microsoft/auth/microsoft/callback"

# Optional: skip OSB Step 9 in lab when broker secret is not configured
# contentiq_skip_osb_provision: true

# --- Local disk secrets (no IBM SM) — only if you pre-fill ansible/secrets/*.yaml in the release:
# contentiq_use_local_secrets: true
# contentiq_fetch_secrets_from_ibm_sm: false
# contentiq_manage_pull_secret: false
# contentiq_merge_platform_oauth_from_template: true   # lab only: overlay from backend-secrets-template.yaml
