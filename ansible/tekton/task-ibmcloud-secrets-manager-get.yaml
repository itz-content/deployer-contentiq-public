# IBM-style single-secret fetch. Compatible with clusters using tekton.dev/v1beta1.
#
# Same flow as: ibmcloud secrets-manager secret --id <uuid> (API GET /api/v2/secrets/{id}).
# One SM instance URL + three UUIDs (backend / RAG / registry): override KEY_ID per run, or use
# Pipeline ibmcloud-secrets-manager-get-three for three parallel GETs; use contentiq-sync-secrets-from-ibm-sm
# to fetch all three and oc apply to the cluster.
# Requires secret kube-system/ibm-secret data.apiKey (IBM Cloud API key with SM read access).
#
# WARNING: Tekton task results are size-capped (~4KB on many installs). Use this Task for
# small payloads only. For ContentIQ backend/RAG bundles, prefer task-contentiq-sync-secrets-from-ibm-sm
# (writes to temp files, no result) or mount an optional workspace and write the payload there.
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: ibmcloud-secrets-manager-get
  labels:
    app.kubernetes.io/version: "0.3"
  annotations:
    tekton.dev/categories: IBM Cloud
    tekton.dev/pipelines.minVersion: "0.17.0"
    tekton.dev/tags: cli
    tekton.dev/displayName: "IBM Cloud Secrets Manager Get Secret"
    tekton.dev/platforms: "linux/amd64"
spec:
  description: >-
    Retrieves a secret payload from IBM Cloud Secrets Manager (v2 API) by secret ID.
    Writes the decoded arbitrary secret payload to result secret-value. For large payloads,
    use optional workspace secret-payload instead (result may be truncated or rejected).
  params:
    - name: KEY_ID
      description: >-
        IBM Secrets Manager arbitrary secret ID (UUID), same as `ibmcloud secrets-manager secret --id`.
        Default points at contentiq-backend-secrets; override for RAG/registry or other secrets.
      type: string
      default: "83eec62f-23d7-80d3-de6c-f7aa48c3ec4e"
    - name: SECRETS_MANAGER_ENDPOINT_URL
      description: >-
        Instance base URL (no path). Override if you use another region or instance.
      type: string
      default: "https://afa20521-cd75-4864-843f-e59fd0ffd49d.us-south.secrets-manager.appdomain.cloud"
    - name: CLI_IMAGE
      description: Image with oc, curl, and python3 (for JSON). RHEL ose-cli recommended.
      type: string
      default: registry.redhat.io/openshift4/ose-cli-rhel9:v4.16
  results:
    - name: secret-value
      description: Payload string from Secrets Manager (size-limited; see Task description).
  workspaces:
    - name: smoutput
      description: >-
        If bound, full payload is written to $(workspaces.smoutput.path)/payload
        in addition to the result (use for large arbitrary secrets).
      optional: true
  steps:
    - name: retrieve-key
      image: $(params.CLI_IMAGE)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        if [[ -z "$(params.KEY_ID)" ]]; then
          echo "KEY_ID is required"
          exit 1
        fi
        if [[ -z "$(params.SECRETS_MANAGER_ENDPOINT_URL)" ]]; then
          echo "SECRETS_MANAGER_ENDPOINT_URL is required"
          exit 1
        fi
        END="$(params.SECRETS_MANAGER_ENDPOINT_URL)"
        END="${END%/}"
        if [[ "${END}" != https://* ]]; then
          echo "SECRETS_MANAGER_ENDPOINT_URL must start with https://"
          exit 1
        fi

        IBMCLOUD_API_KEY="$(oc get secret ibm-secret -n kube-system -o jsonpath='{.data.apiKey}' | base64 -d)"
        AUTH_RESPONSE_JSON="$(curl -fsS -X POST "https://iam.cloud.ibm.com/identity/token" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -H "Accept: application/json" \
          --data-urlencode "grant_type=urn:ibm:params:oauth:grant-type:apikey" \
          --data-urlencode "apikey=${IBMCLOUD_API_KEY}")"
        export IBM_IAM_TOKEN_JSON="$AUTH_RESPONSE_JSON"
        ACCESS_TOKEN="$(python3 -c 'import json,os; print(json.loads(os.environ["IBM_IAM_TOKEN_JSON"])["access_token"])')"

        export SECRET_JSON="$(curl -fsS -X GET \
          "${END}/api/v2/secrets/$(params.KEY_ID)" \
          -H "Authorization: Bearer ${ACCESS_TOKEN}" \
          -H "Accept: application/json")"

        PAYLOAD="$(python3 -c '
        import json, os, sys
        j = json.loads(os.environ["SECRET_JSON"])
        data = j.get("data") or {}
        p = data.get("payload")
        if p is None:
            p = j.get("payload")
        if p is None and isinstance(data.get("secret_data"), dict):
            p = data["secret_data"].get("payload")
        if p is None:
            sys.stderr.write("No payload in SM response. Top-level keys: %s\n" % list(j.keys()))
            sys.exit(1)
        if not isinstance(p, str):
            p = json.dumps(p)
        sys.stdout.write(p)
        ')"

        printf '%s' "${PAYLOAD}" | tee "$(results.secret-value.path)"

        if [[ "$(workspaces.smoutput.bound)" == "true" ]]; then
          printf '%s' "${PAYLOAD}" > "$(workspaces.smoutput.path)/payload"
        fi
