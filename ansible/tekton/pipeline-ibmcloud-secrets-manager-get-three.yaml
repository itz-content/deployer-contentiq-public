# Runs ibmcloud-secrets-manager-get three times in parallel (same SM instance URL, three secret UUIDs).
# Use for debugging / result inspection. Task results are size-limited (~4KB on many clusters).
# To apply backend + RAG + registry to OpenShift, use pipeline-contentiq-sync-secrets-from-ibm-sm instead.
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ibmcloud-secrets-manager-get-three
  labels:
    app.kubernetes.io/part-of: contentiq
spec:
  description: >-
    Three parallel GETs to IBM Secrets Manager (same endpoint as contentiq SM sync).
    Same as three `ibmcloud secrets-manager secret --id` calls. Does not oc apply anything.
  params:
    - name: CLI_IMAGE
      type: string
      default: registry.redhat.io/openshift4/ose-cli-rhel9:v4.16
    - name: SECRETS_MANAGER_ENDPOINT_URL
      type: string
      default: "https://afa20521-cd75-4864-843f-e59fd0ffd49d.us-south.secrets-manager.appdomain.cloud"
    - name: BACKEND_SECRET_KEY_ID
      type: string
      default: "83eec62f-23d7-80d3-de6c-f7aa48c3ec4e"
    - name: RAG_SECRET_KEY_ID
      type: string
      default: "3520bb5f-9050-8928-e812-67ed3c959fa8"
    - name: REGISTRY_SECRET_KEY_ID
      type: string
      default: "3ede12f0-7c8a-fd86-d245-197d064641f9"
  tasks:
    - name: get-backend
      taskRef:
        kind: Task
        name: ibmcloud-secrets-manager-get
      params:
        - name: CLI_IMAGE
          value: $(params.CLI_IMAGE)
        - name: SECRETS_MANAGER_ENDPOINT_URL
          value: $(params.SECRETS_MANAGER_ENDPOINT_URL)
        - name: KEY_ID
          value: $(params.BACKEND_SECRET_KEY_ID)
    - name: get-rag
      taskRef:
        kind: Task
        name: ibmcloud-secrets-manager-get
      params:
        - name: CLI_IMAGE
          value: $(params.CLI_IMAGE)
        - name: SECRETS_MANAGER_ENDPOINT_URL
          value: $(params.SECRETS_MANAGER_ENDPOINT_URL)
        - name: KEY_ID
          value: $(params.RAG_SECRET_KEY_ID)
    - name: get-registry
      taskRef:
        kind: Task
        name: ibmcloud-secrets-manager-get
      params:
        - name: CLI_IMAGE
          value: $(params.CLI_IMAGE)
        - name: SECRETS_MANAGER_ENDPOINT_URL
          value: $(params.SECRETS_MANAGER_ENDPOINT_URL)
        - name: KEY_ID
          value: $(params.REGISTRY_SECRET_KEY_ID)
