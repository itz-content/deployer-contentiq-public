# Sync ContentIQ Kubernetes secrets from IBM Cloud Secrets Manager (arbitrary secrets).
#
# Prerequisites in IBM Secrets Manager (arbitrary secrets), by BACKEND_PAYLOAD_FORMAT / RAG_PAYLOAD_FORMAT
# and optional *_PAYLOAD_BASE64 ("true" = SM payload string is base64 before yaml/json handling):
#   - kubernetes-yaml: full Kubernetes Secret manifest for that secret.
#   - json-stringdata: JSON object of key -> string values → Secret stringData
#     (same keys as under stringData in backend-secrets-template / rag-secrets-template).
#   - env-stringdata: dotenv-style text (KEY=value, # comments, optional export) → Secret stringData.
#   REGISTRY: full Secret/List (kubernetes-yaml), JSON object -> stringData Secret (json-stringdata), or raw .dockerconfigjson (dockerconfigjson).
#
# Cluster: kube-system secret ibm-secret with key apiKey (base64) = IBM Cloud API key
# that can read those Secrets Manager secrets (see rbac-kube-system-ibm-secret-reader.yaml).
#
# If `oc apply` rejects apiVersion tekton.dev/v1, switch Task/Pipeline/PipelineRun to v1beta1.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: contentiq-sync-secrets-from-ibm-sm
  labels:
    app.kubernetes.io/part-of: contentiq
spec:
  description: >-
    Fetch three arbitrary secrets from IBM Cloud Secrets Manager and apply them
    to OpenShift (contentiq namespace). Payloads are not written to Git.
  params:
    - name: CLI_IMAGE
      type: string
      description: Image with oc and python3 (RHEL-based ose-cli recommended).
      default: registry.redhat.io/openshift4/ose-cli-rhel9:v4.16
    - name: SECRETS_MANAGER_ENDPOINT_URL
      type: string
      description: >-
        Instance URL, e.g. https://<instance-id>.us-south.secrets-manager.appdomain.cloud
    - name: BACKEND_SECRET_KEY_ID
      type: string
      description: IBM Secrets Manager secret ID (UUID) for backend K8s Secret YAML payload.
    - name: RAG_SECRET_KEY_ID
      type: string
      description: IBM Secrets Manager secret ID for RAG / personalization-api-secrets YAML payload.
    - name: REGISTRY_SECRET_KEY_ID
      type: string
      description: IBM Secrets Manager secret ID for image pull credentials.
    - name: TARGET_NAMESPACE
      type: string
      default: contentiq
    - name: REGISTRY_K8S_SECRET_NAME
      type: string
      description: Name of docker-registry / dockerconfigjson secret in TARGET_NAMESPACE.
      default: dockerhub-pull
    - name: REGISTRY_PAYLOAD_FORMAT
      type: string
      description: kubernetes-yaml (full Secret/List), json-stringdata (JSON object -> Opaque stringData), or dockerconfigjson (raw JSON only).
      default: json-stringdata
    - name: BACKEND_PAYLOAD_FORMAT
      type: string
      description: >-
        kubernetes-yaml, json-stringdata (JSON object), or env-stringdata (KEY=value / # comments)
        for the backend SM secret payload.
      default: json-stringdata
    - name: RAG_PAYLOAD_FORMAT
      type: string
      description: >-
        kubernetes-yaml, json-stringdata (JSON object), or env-stringdata (KEY=value / # comments)
        for the RAG SM secret payload.
      default: kubernetes-yaml
    - name: BACKEND_PAYLOAD_BASE64
      type: string
      description: When "true", base64-decode backend SM payload after fetch (before format handling).
      default: "false"
    - name: RAG_PAYLOAD_BASE64
      type: string
      description: When "true", base64-decode RAG SM payload after fetch.
      default: "true"
    - name: REGISTRY_PAYLOAD_BASE64
      type: string
      description: When "true", base64-decode registry SM payload before apply (plain YAML → keep false).
      default: "false"
    - name: BACKEND_K8S_SECRET_NAME
      type: string
      default: contentiq-backend-secrets
    - name: RAG_K8S_SECRET_NAME
      type: string
      default: personalization-api-secrets
    - name: ROLLOUT_RESTART
      type: string
      description: "true" to restart backend and RAG deployments after secret sync.
      default: "false"
  steps:
    - name: sync-from-secrets-manager
      image: $(params.CLI_IMAGE)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        extract_sm_payload() {
          local json_file="$1"
          python3 - "$json_file" <<'PY'
        import json, sys
        path = sys.argv[1]
        with open(path, "r", encoding="utf-8") as f:
            j = json.load(f)
        data = j.get("data") or {}
        # Common IBM SM v2 shapes
        p = data.get("payload")
        if p is None:
            p = j.get("payload")
        if p is None and isinstance(data.get("secret_data"), dict):
            p = data["secret_data"].get("payload")
        if p is None:
            sys.stderr.write(
                "Could not find payload in Secrets Manager JSON. Keys at top: %s\n"
                % list(j.keys())
            )
            sys.exit(1)
        if not isinstance(p, str):
            p = json.dumps(p)
        sys.stdout.write(p)
        PY
        }

        get_access_token() {
          local apikey
          apikey="$(oc get secret ibm-secret -n kube-system -o jsonpath='{.data.apiKey}' | base64 -d)"
          local resp
          resp="$(curl -fsS -X POST "https://iam.cloud.ibm.com/identity/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Accept: application/json" \
            --data-urlencode "grant_type=urn:ibm:params:oauth:grant-type:apikey" \
            --data-urlencode "apikey=${apikey}")"
          export IBM_IAM_TOKEN_JSON="$resp"
          python3 -c 'import json,os; print(json.loads(os.environ["IBM_IAM_TOKEN_JSON"])["access_token"])'
        }

        fetch_secret_json() {
          local key_id="$1"
          local out="$2"
          local token="$3"
          local url="$(params.SECRETS_MANAGER_ENDPOINT_URL)/api/v2/secrets/${key_id}"
          curl -fsS -X GET "$url" \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/json" \
            -o "$out"
        }

        apply_k8s_yaml_payload() {
          local payload_file="$1"
          oc apply -f "$payload_file" -n "$(params.TARGET_NAMESPACE)"
        }

        apply_registry_k8s_yaml_payload() {
          local payload_file="$1"
          # Do not force -n: payload may be List / multi-namespace pull secrets (marketplace, operators, contentiq).
          oc apply -f "$payload_file"
        }

        # Plain YAML passes through. JSON object (Secret/List) passes through. JSON *array* → wrap as v1/List for oc apply.
        normalize_registry_k8s_yaml_for_oc_apply() {
          local src="$1"
          local dst="$2"
          python3 - "$src" "$dst" <<'PY'
        import json
        import sys

        src, dst = sys.argv[1], sys.argv[2]
        raw = open(src, encoding="utf-8").read().strip()
        if not raw:
            sys.exit("registry SM payload is empty")
        try:
            data = json.loads(raw)
        except json.JSONDecodeError:
            open(dst, "w", encoding="utf-8").write(raw)
            sys.exit(0)
        if isinstance(data, list):
            if not data:
                sys.exit("registry SM JSON is an empty array")
            out = {"apiVersion": "v1", "kind": "List", "items": data}
        elif isinstance(data, dict):
            out = data
        else:
            sys.exit("registry SM JSON root must be an object or array, not " + type(data).__name__)
        with open(dst, "w", encoding="utf-8") as f:
            json.dump(out, f)
        PY
        }

        apply_registry_dockerconfigjson() {
          local payload_file="$1"
          local ns="$(params.TARGET_NAMESPACE)"
          local name="$(params.REGISTRY_K8S_SECRET_NAME)"
          # Validate JSON
          python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$payload_file"
          oc create secret docker-registry "$name" \
            -n "$ns" \
            --from-file=.dockerconfigjson="$payload_file" \
            --dry-run=client -o yaml | oc apply -f -
        }

        # json-stringdata: SM payload is JSON object → oc apply JSON Secret (same as YAML to API).
        json_stringdata_to_k8s_secret_file() {
          local payload_file="$1"
          local k8s_secret_name="$2"
          local ns="$3"
          local out_file="$4"
          python3 - "$payload_file" "$k8s_secret_name" "$ns" "$out_file" <<'PY'
        import json
        import sys

        payload_path, name, ns, outp = sys.argv[1:5]
        raw = open(payload_path, encoding="utf-8").read().strip()
        if not (raw.startswith("{") and raw.endswith("}")):
            raise SystemExit(
                "json-stringdata expects a JSON object in the SM payload"
            )
        data = json.loads(raw)
        if not isinstance(data, dict):
            raise SystemExit("Root JSON must be an object of string keys")

        def to_str(v):
            if v is None:
                return ""
            if isinstance(v, (dict, list)):
                return json.dumps(v)
            return str(v)

        string_data = {k: to_str(v) for k, v in data.items()}
        manifest = {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": name, "namespace": ns},
            "type": "Opaque",
            "stringData": string_data,
        }
        with open(outp, "w", encoding="utf-8") as f:
            json.dump(manifest, f)
        PY
        }

        env_stringdata_to_k8s_secret_file() {
          local payload_file="$1"
          local k8s_secret_name="$2"
          local ns="$3"
          local out_file="$4"
          python3 - "$payload_file" "$k8s_secret_name" "$ns" "$out_file" <<'PY'
        import json
        import re
        import sys

        payload_path, name, ns, outp = sys.argv[1:5]
        raw = open(payload_path, encoding="utf-8").read().strip()
        if not raw:
            sys.exit("SM payload is empty (env-stringdata)")

        def parse_env_stringdata(blob):
            out = {}
            re_colon = re.compile(r"^([A-Za-z_][A-Za-z0-9_.-]*)\s*:\s*(.+)$")
            re_equals = re.compile(r"^([A-Za-z_][A-Za-z0-9_.-]*)\s*=\s*(.+)$")
            for raw_line in blob.splitlines():
                s = raw_line.strip()
                if not s or s.startswith("#"):
                    continue
                if s.startswith("export "):
                    s = s[7:].lstrip()
                m = re_colon.match(s) or re_equals.match(s)
                if not m:
                    continue
                key, val = m.group(1), m.group(2).strip()
                if not key or key.startswith("#"):
                    continue
                if len(val) >= 2 and val[0] == val[-1] and val[0] in ("\"", "'"):
                    val = val[1:-1]
                out[key] = val
            return out

        data = parse_env_stringdata(raw)
        if not data:
            sys.exit(
                "env-stringdata: no KEY=value or KEY: value entries (comments/blank lines skipped). "
                "If the payload is still base64-wrapped, set BACKEND_PAYLOAD_BASE64 / RAG_PAYLOAD_BASE64 true."
            )
        string_data = {k: str(v) for k, v in data.items()}
        manifest = {
            "apiVersion": "v1",
            "kind": "Secret",
            "metadata": {"name": name, "namespace": ns},
            "type": "Opaque",
            "stringData": string_data,
        }
        with open(outp, "w", encoding="utf-8") as f:
            json.dump(manifest, f)
        PY
        }

        prepare_sm_payload_file() {
          local sm_json="$1"
          local raw_out="$2"
          local k8s_name="$3"
          local final_out="$4"
          local fmt="$5"
          local decode_b64="${6:-false}"
          extract_sm_payload "$sm_json" > "$raw_out"
          if [[ "${decode_b64}" == "true" ]]; then
            local tmpf="${raw_out}.b64dec"
            base64 -d < "$raw_out" > "$tmpf" && mv "$tmpf" "$raw_out"
          fi
          case "${fmt}" in
            kubernetes-yaml)
              cp "$raw_out" "$final_out"
              ;;
            json-stringdata)
              json_stringdata_to_k8s_secret_file "$raw_out" "$k8s_name" "$(params.TARGET_NAMESPACE)" "$final_out"
              ;;
            env-stringdata)
              env_stringdata_to_k8s_secret_file "$raw_out" "$k8s_name" "$(params.TARGET_NAMESPACE)" "$final_out"
              ;;
            *)
              echo "Unknown payload format: ${fmt}"
              exit 1
              ;;
          esac
        }

        TOKEN="$(get_access_token)"
        END="$(params.SECRETS_MANAGER_ENDPOINT_URL)"
        if [[ "${END}" != https://* ]]; then
          echo "SECRETS_MANAGER_ENDPOINT_URL must start with https://"
          exit 1
        fi

        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT

        # --- Backend ---
        fetch_secret_json "$(params.BACKEND_SECRET_KEY_ID)" "$TMP/backend.json" "$TOKEN"
        prepare_sm_payload_file "$TMP/backend.json" "$TMP/backend.raw" "$(params.BACKEND_K8S_SECRET_NAME)" "$TMP/backend-secret.manifest" "$(params.BACKEND_PAYLOAD_FORMAT)" "$(params.BACKEND_PAYLOAD_BASE64)"
        oc apply -f "$TMP/backend-secret.manifest" -n "$(params.TARGET_NAMESPACE)"

        # --- RAG ---
        fetch_secret_json "$(params.RAG_SECRET_KEY_ID)" "$TMP/rag.json" "$TOKEN"
        prepare_sm_payload_file "$TMP/rag.json" "$TMP/rag.raw" "$(params.RAG_K8S_SECRET_NAME)" "$TMP/rag-secret.manifest" "$(params.RAG_PAYLOAD_FORMAT)" "$(params.RAG_PAYLOAD_BASE64)"
        oc apply -f "$TMP/rag-secret.manifest" -n "$(params.TARGET_NAMESPACE)"

        # --- Registry ---
        fetch_secret_json "$(params.REGISTRY_SECRET_KEY_ID)" "$TMP/reg.json" "$TOKEN"
        extract_sm_payload "$TMP/reg.json" > "$TMP/registry.payload"
        if [[ "$(params.REGISTRY_PAYLOAD_BASE64)" == "true" ]]; then
          tmpreg="${TMP}/registry.payload.dec"
          base64 -d < "$TMP/registry.payload" > "$tmpreg" && mv "$tmpreg" "$TMP/registry.payload"
        fi
        case "$(params.REGISTRY_PAYLOAD_FORMAT)" in
          kubernetes-yaml)
            normalize_registry_k8s_yaml_for_oc_apply "$TMP/registry.payload" "$TMP/registry.manifest.apply.yaml"
            apply_registry_k8s_yaml_payload "$TMP/registry.manifest.apply.yaml"
            ;;
          json-stringdata)
            json_stringdata_to_k8s_secret_file "$TMP/registry.payload" "$(params.REGISTRY_K8S_SECRET_NAME)" "$(params.TARGET_NAMESPACE)" "$TMP/registry-secret.manifest.json"
            oc apply -f "$TMP/registry-secret.manifest.json" -n "$(params.TARGET_NAMESPACE)"
            ;;
          dockerconfigjson)
            apply_registry_dockerconfigjson "$TMP/registry.payload"
            ;;
          *)
            echo "Unknown REGISTRY_PAYLOAD_FORMAT: $(params.REGISTRY_PAYLOAD_FORMAT)"
            exit 1
            ;;
        esac

        if [[ "$(params.ROLLOUT_RESTART)" == "true" ]]; then
          oc rollout restart deployment/contentiq-backend -n "$(params.TARGET_NAMESPACE)" || true
          oc rollout restart deployment/personalization-rag -n "$(params.TARGET_NAMESPACE)" || true
        fi

        echo "Sync finished."
