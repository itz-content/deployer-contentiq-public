# Thin wrapper so you can run from OpenShift Pipelines UI or `tkn pipeline start`.
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: contentiq-sync-secrets-from-ibm-sm
  labels:
    app.kubernetes.io/part-of: contentiq
spec:
  description: >-
    Fetch backend, RAG, and registry material from IBM Secrets Manager and apply to the cluster.
  params:
    - name: CLI_IMAGE
      type: string
      default: registry.redhat.io/openshift4/ose-cli-rhel9:v4.16
    - name: SECRETS_MANAGER_ENDPOINT_URL
      type: string
      default: "https://afa20521-cd75-4864-843f-e59fd0ffd49d.us-south.secrets-manager.appdomain.cloud"
    - name: BACKEND_SECRET_KEY_ID
      type: string
      default: "83eec62f-23d7-80d3-de6c-f7aa48c3ec4e"
    - name: RAG_SECRET_KEY_ID
      type: string
      default: "3520bb5f-9050-8928-e812-67ed3c959fa8"
    - name: REGISTRY_SECRET_KEY_ID
      type: string
      default: "3ede12f0-7c8a-fd86-d245-197d064641f9"
    - name: TARGET_NAMESPACE
      type: string
      default: contentiq
    - name: REGISTRY_K8S_SECRET_NAME
      type: string
      default: dockerhub-pull
    - name: REGISTRY_PAYLOAD_FORMAT
      type: string
      default: json-stringdata
    - name: BACKEND_PAYLOAD_FORMAT
      type: string
      default: json-stringdata
    - name: RAG_PAYLOAD_FORMAT
      type: string
      default: kubernetes-yaml
    - name: BACKEND_PAYLOAD_BASE64
      type: string
      default: "false"
    - name: RAG_PAYLOAD_BASE64
      type: string
      default: "true"
    - name: REGISTRY_PAYLOAD_BASE64
      type: string
      default: "false"
    - name: BACKEND_K8S_SECRET_NAME
      type: string
      default: contentiq-backend-secrets
    - name: RAG_K8S_SECRET_NAME
      type: string
      default: personalization-api-secrets
    - name: ROLLOUT_RESTART
      type: string
      default: "false"
  tasks:
    - name: sync
      taskRef:
        kind: Task
        name: contentiq-sync-secrets-from-ibm-sm
      params:
        - name: CLI_IMAGE
          value: $(params.CLI_IMAGE)
        - name: SECRETS_MANAGER_ENDPOINT_URL
          value: $(params.SECRETS_MANAGER_ENDPOINT_URL)
        - name: BACKEND_SECRET_KEY_ID
          value: $(params.BACKEND_SECRET_KEY_ID)
        - name: RAG_SECRET_KEY_ID
          value: $(params.RAG_SECRET_KEY_ID)
        - name: REGISTRY_SECRET_KEY_ID
          value: $(params.REGISTRY_SECRET_KEY_ID)
        - name: TARGET_NAMESPACE
          value: $(params.TARGET_NAMESPACE)
        - name: REGISTRY_K8S_SECRET_NAME
          value: $(params.REGISTRY_K8S_SECRET_NAME)
        - name: REGISTRY_PAYLOAD_FORMAT
          value: $(params.REGISTRY_PAYLOAD_FORMAT)
        - name: BACKEND_PAYLOAD_FORMAT
          value: $(params.BACKEND_PAYLOAD_FORMAT)
        - name: RAG_PAYLOAD_FORMAT
          value: $(params.RAG_PAYLOAD_FORMAT)
        - name: BACKEND_PAYLOAD_BASE64
          value: $(params.BACKEND_PAYLOAD_BASE64)
        - name: RAG_PAYLOAD_BASE64
          value: $(params.RAG_PAYLOAD_BASE64)
        - name: REGISTRY_PAYLOAD_BASE64
          value: $(params.REGISTRY_PAYLOAD_BASE64)
        - name: BACKEND_K8S_SECRET_NAME
          value: $(params.BACKEND_K8S_SECRET_NAME)
        - name: RAG_K8S_SECRET_NAME
          value: $(params.RAG_K8S_SECRET_NAME)
        - name: ROLLOUT_RESTART
          value: $(params.ROLLOUT_RESTART)
