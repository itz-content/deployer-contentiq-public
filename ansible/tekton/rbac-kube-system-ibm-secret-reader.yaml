# Allow the sync ServiceAccount (in TARGET_NS) to read kube-system/ibm-secret only.
# Replace TARGET_NS with the namespace where you run TaskRuns/PipelineRuns (e.g. contentiq).
#
# Apply (as cluster admin), after editing TARGET_NS:
#   oc apply -f rbac-kube-system-ibm-secret-reader.yaml
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: contentiq-read-ibm-secret
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["ibm-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: contentiq-read-ibm-secret
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: contentiq-read-ibm-secret
subjects:
  - kind: ServiceAccount
    name: contentiq-sm-sync
    namespace: contentiq
