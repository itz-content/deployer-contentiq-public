---
# CUSTOMER-GUIDE.md — Step 2: Pull secrets in openshift-marketplace, openshift-operators, contentiq (+ default SA links)

- name: Render docker pull secrets
  ansible.builtin.template:
    src: pull-secret.yaml.j2
    dest: "{{ contentiq_render_dir }}/pull-secret-{{ item }}.yaml"
    mode: "0600"
  vars:
    contentiq_target_namespace: "{{ item }}"
  loop:
    - "{{ contentiq_catalogsource_namespace }}"
    - "{{ contentiq_operator_namespace }}"
    - "{{ contentiq_namespace }}"
  when: contentiq_manage_pull_secret | bool
  no_log: true

- name: Apply docker pull secrets
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - apply
      - -f
      - "{{ contentiq_render_dir }}/pull-secret-{{ item }}.yaml"
  loop:
    - "{{ contentiq_catalogsource_namespace }}"
    - "{{ contentiq_operator_namespace }}"
    - "{{ contentiq_namespace }}"
  register: contentiq_install_pull_secret_apply
  changed_when: >-
    'created' in contentiq_install_pull_secret_apply.stdout
    or 'configured' in contentiq_install_pull_secret_apply.stdout
  when: contentiq_manage_pull_secret | bool
  no_log: true

- name: Link pull secret to default service accounts
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - secrets
      - link
      - default
      - "{{ contentiq_pull_secret_name }}"
      - --for=pull
      - -n
      - "{{ item }}"
  loop:
    - "{{ contentiq_catalogsource_namespace }}"
    - "{{ contentiq_operator_namespace }}"
    - "{{ contentiq_namespace }}"
  changed_when: false
  when: contentiq_manage_pull_secret | bool
