---
# CUSTOMER-GUIDE.md — Step 5: Backend + RAG secrets (oc apply equivalent via rendered/patched Secret)

- name: Check for existing backend secret
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - secret
      - "{{ contentiq_backend_secret_name }}"
      - -n
      - "{{ contentiq_namespace }}"
  register: contentiq_install_backend_secret_exists
  failed_when: false
  changed_when: false
  no_log: true

- name: Check for existing RAG secret
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - secret
      - "{{ contentiq_rag_secret_name }}"
      - -n
      - "{{ contentiq_namespace }}"
  register: contentiq_install_rag_secret_exists
  failed_when: false
  changed_when: false
  no_log: true

- name: Render backend secret manifest
  ansible.builtin.template:
    src: backend-secret.yaml.j2
    dest: "{{ contentiq_render_dir }}/backend-secret.yaml"
    mode: "0600"
  no_log: true

- name: Render RAG secret manifest
  ansible.builtin.template:
    src: rag-secret.yaml.j2
    dest: "{{ contentiq_render_dir }}/rag-secret.yaml"
    mode: "0600"
  no_log: true

- name: Create backend secret when missing
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - apply
      - -f
      - "{{ contentiq_render_dir }}/backend-secret.yaml"
  register: contentiq_install_backend_secret_create
  changed_when: >-
    'created' in contentiq_install_backend_secret_create.stdout
    or 'configured' in contentiq_install_backend_secret_create.stdout
  when: contentiq_install_backend_secret_exists.rc != 0
  no_log: true

- name: Merge-patch backend secret when it already exists
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - patch
      - secret
      - "{{ contentiq_backend_secret_name }}"
      - -n
      - "{{ contentiq_namespace }}"
      - --type=merge
      - -p
      - "{{ {'stringData': contentiq_install_backend_secret_resolved} | to_json }}"
  register: contentiq_install_backend_secret_patch
  changed_when: true
  when: contentiq_install_backend_secret_exists.rc == 0
  no_log: true

- name: Create RAG secret when missing
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - apply
      - -f
      - "{{ contentiq_render_dir }}/rag-secret.yaml"
  register: contentiq_install_rag_secret_create
  changed_when: >-
    'created' in contentiq_install_rag_secret_create.stdout
    or 'configured' in contentiq_install_rag_secret_create.stdout
  when: contentiq_install_rag_secret_exists.rc != 0
  no_log: true

- name: Merge-patch RAG secret when it already exists
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - patch
      - secret
      - "{{ contentiq_rag_secret_name }}"
      - -n
      - "{{ contentiq_namespace }}"
      - --type=merge
      - -p
      - "{{ {'stringData': contentiq_install_rag_secret_resolved} | to_json }}"
  register: contentiq_install_rag_secret_patch
  changed_when: true
  when: contentiq_install_rag_secret_exists.rc == 0
  no_log: true

- name: Check whether backend deployment exists before restart
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - deployment
      - contentiq-backend
      - -n
      - "{{ contentiq_namespace }}"
  register: contentiq_install_backend_deployment_exists
  failed_when: false
  changed_when: false

- name: Check whether RAG deployment exists before restart
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - get
      - deployment
      - personalization-rag
      - -n
      - "{{ contentiq_namespace }}"
  register: contentiq_install_rag_deployment_exists
  failed_when: false
  changed_when: false

- name: Restart backend deployment after secret reconciliation
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - rollout
      - restart
      - deployment/contentiq-backend
      - -n
      - "{{ contentiq_namespace }}"
  register: contentiq_install_backend_rollout_restart
  changed_when: "'restarted' in contentiq_install_backend_rollout_restart.stdout"
  when:
    - contentiq_restart_deployments_on_secret_apply | bool
    - contentiq_install_backend_deployment_exists.rc == 0

- name: Restart RAG deployment after secret reconciliation
  ansible.builtin.command:
    argv:
      - "{{ contentiq_oc_binary }}"
      - rollout
      - restart
      - deployment/personalization-rag
      - -n
      - "{{ contentiq_namespace }}"
  register: contentiq_install_rag_rollout_restart
  changed_when: "'restarted' in contentiq_install_rag_rollout_restart.stdout"
  when:
    - contentiq_restart_deployments_on_secret_apply | bool
    - contentiq_install_rag_deployment_exists.rc == 0
